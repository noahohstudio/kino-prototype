        ${TO_FOLLOW.slice(0, 4).map(([q, via]) => `<div class="e-row pp-row">${avatar(q)}<span class="e-row__body"><b>${P[q].full}</b><span class="sub">${via ? `Followed by ${P[via].n}` : `${P[q].followers} followers`}</span></span>${followBtn(st, q)}</div>`).join('')}
        <button class="k-btn k-btn--secondary k-btn--block" data-go="#/invites">${ic('link-simple')}Invite friends</button></section>`;
    const recentNew = `<div class="s-section h-recent"><div class="m-section-head"><h3>Recently released</h3></div><div class="m-shelf h-grid">${RECENT.map(k => `<div>${tile(k)}</div>`).join('')}</div></div>`;
    const topNew = `<div class="h-top narrow-only"><button class="s-wm" data-act="gather" aria-label="Kino">kino<i></i></button>${bellBtn(st, 'data-go="#/notifications"')}</div>`;
    // On iPhone the intro ends and Kino keeps going (your note): trailers and takes from people you don't follow yet, a page at a
    // time, like Home's feed. The web's two columns already fill the screen.
    const more = `<div class="h-feed fu-more narrow-only"><div class="m-section-head"><h3>Around Kino</h3></div>${Array.from({ length: st.feedPages }, (_, n) => feedHtml(st, n + 1, false, true)).join('')}
      <div class="feed-more">${loader(st, 'md', null, 'Loading more')}</div></div>`;
    return `${topNew}<div class="fu"><div class="fu-main"><div class="s-head h-hero"><h1 class="s-title">Welcome, Dani</h1><p class="s-sub">${done ? 'Your taste is taking shape.' : 'A few quick rankings and Kino starts to learn your taste.'}</p></div>${card}${people}</div>
      <aside class="fu-side">${group}${recentNew}</aside></div>${more}`;
  }

  // 5 · Talking about the pick: a preview on the vote, the whole conversation in a sheet
  const TALK = [['maya', 'I put The Odyssey in, but Hail Mary looks great too.', 'Tue'], ['jo', 'Hail Mary. I\'ve been waiting for this one all year.', 'Tue'],
    ['ari', 'The Odyssey, on the biggest screen we can find.', 'Wed'], ['', 'Jo voted for Project Hail Mary', 'Wed'], ['maya', 'Snacks are on me Friday.', '2h']];
  const talkAll = st => [...TALK, ...(st.talk || [])];
  const talkRow = ([q, txt, t]) => (!q ? `<p class="tk-sys">${txt} · ${t}</p>`
    : `<div class="th-reply${q === 'you' ? ' is-you' : ''}">${pfLink(q, avatar(q, 'sm'))}<div><span class="th-reply__who">${pfLink(q, `<b>${q === 'you' ? 'You' : P[q].n}</b>`)} · ${t}</span><p>${txt}</p></div></div>`);
  const talkCompose = st => `<div class="th-compose">${avatar('you', 'sm')}<input data-input="talk" placeholder="Say something to the group" value="${st.talkDraft || ''}" aria-label="Message Thursday film club"><button class="k-btn k-btn--primary k-btn--sm" data-act="tk-send">Send</button></div>`;
  function talkPreview(st) {
    const all = talkAll(st).filter(m => m[0]);
    return `<section class="tk-preview"><div class="m-section-head"><h3>Talk</h3><span class="sub">${all.length} messages</span></div>${all.slice(-2).map(talkRow).join('')}
      <button class="k-btn k-btn--secondary k-btn--sm k-btn--block" data-act="tk-open">${ic('chat-circle')}Open the conversation</button></section>`;
  }
  const talkSheet = st => sheetWrap(st.tsheet, 'tkoverlay', 'Talk', `${sheetHead('Thursday film club', 'tkclose')}<div class="th-list tk-list">${talkAll(st).map(talkRow).join('')}</div>${talkCompose(st)}`, 'tk');


  /* ---------- splash, loading and states (round 1 picked 2026-10-11, applied the same day) ----------
     The splash plays whenever Kino opens (st.splash { t } freezes it at t seconds, for boards). The loading dots are always in
     colour: the people's own when people are involved, Kino's crowd colours everywhere else. A screen shows what you saw last while
     it catches up (st.loading 'cached'); with no connection and nothing to show, its quiet shapes and a whole-screen line
     (st.loading 'shapes' with st.offline). Empty spaces always offer something to start from (st.blank). Errors stay in place
     (st.err 'feed' | 'vote' | 'code' | 'poster'); the whole screen only when Kino itself is down (st.err 'down'). Offline is one
     quiet line, and anything you do waits as a hollow dot (st.offline). Round 2, passed: pull to refresh (st.pull), the lock screen
     (#/lock), a slow connection (st.slow) and asking first, when it matters (st.ask) */

  // Kino's crowd: the general colours the splash gathers and the loader carries when no one in particular is involved (your note:
  // "a general color that friends will most likely have"). Your dot stays Tomato.
  const CROWD = ['rose', 'amber', 'citron', 'fern', 'sky', 'lilac'], CROWD3 = ['rose', 'citron', 'sky'];
  // 1 · The splash, whenever Kino opens: a plain canvas first (iOS's launch screen can't move), the crowd drifts in around your dot,
  // tucks in behind it, and your dot docks beside "kino" as its camera dot. About a second and a half.
  function splashHtml(st) {
    const still = st.splash.t != null, dots = CROWD.map((h, i) => `<span class="sp__f id-${h}" style="--a:${i * 60 + 18}deg;--i:${i}"></span>`).join('');
    return `<div class="sp sp--gather${still ? ' sp--still' : ''}"${still ? ` style="--t:${st.splash.t}"` : ''} aria-hidden="true">
      <div class="sp__stage"><span class="sp__wm"><span class="sp__letters">kino</span><i class="sp__you"><span class="sp__core"></span>${dots}</i></span></div></div>`;
  }

  // 2 · The loading dots: three taking turns, always in colour. Whoever you're waiting on when there are people (a group, a profile),
  // the crowd's colours everywhere else. Inside a button (plain) they take the label's colour, so they never fight it.
  const loader = (st, size = 'md', who = null, label = 'Loading', tag = 'div', plain = false) => {
    const dots = who ? who.slice(0, 4).map(q => (q === 'you' ? ' is-you' : ' id-' + P[q].h)) : CROWD3.map(h => (plain ? '' : ' id-' + h));
    return `<${tag} class="ld ld--${size}" role="status" aria-label="${label}">${dots.map((c, i) => `<span class="k-dot${c}" style="--i:${i}"></span>`).join('')}</${tag}>`; };

  // 3 · A screen, loading: what you saw last with "Catching up" for an ordinary load; the quiet shapes when there's nothing to show
  // yet (a breath, never a shimmer), and if that's because you're offline, one whole-screen line over them.
  const sk = (cls, style = '') => `<span class="sk ${cls}"${style ? ` style="${style}"` : ''}></span>`;
  const skItem = () => `<div class="sk-item"><div class="sk-row">${sk('sk--av')}${sk('sk--line', 'width:38%')}</div><div class="sk-row">${sk('sk--poster')}<div class="sk-col">${sk('sk--title', 'width:72%')}${sk('sk--line', 'width:48%')}${sk('sk--line', 'width:88%')}</div></div></div>`;
  const offWhole = st => (st.offline ? `<div class="st-whole"><span class="k-dot k-dot--empty st-whole__dot"></span><h2 class="kino-display-m">You're offline</h2><p class="s-sub">Kino will load this when you're back. Your rankings are safe.</p><button class="k-btn k-btn--secondary k-btn--sm" data-act="retry">Try again</button></div>` : '');
  const slowLine = st => (st.slow && !st.offline ? `<div class="st-slowline">${loader(st, 'sm', null, 'Loading', 'span')}<span>${st.slow.stage === 2 ? 'Still trying. Your rankings are safe.' : 'Taking a little longer than usual'}</span></div>` : '');
  function loadingView(st) {
    const [, a] = st.route.split('/'), wrap = body => `${slowLine(st)}<div class="sk-stage"><div class="sk-wrap${st.offline ? ' is-off' : ''}">${body}</div>${offWhole(st)}</div>`;
    if (a === 'profile' || a === 'me') return `${topbar('', { back: a === 'profile' })}${wrap(`<div class="sk-profile">${sk('sk--avatar')}${sk('sk--name')}${sk('sk--line', 'width:120px')}
        <div class="sk-stats">${sk('sk--stat')}${sk('sk--stat')}${sk('sk--stat')}</div><div class="sk-stats">${sk('sk--pill')}${sk('sk--pill')}</div>${sk('sk--tabs')}${skItem()}</div>`)}`;
    if (a === 'explore') return `${topbar('')}<div class="s-head"><h1 class="s-title">Explore</h1></div>${wrap(`<div class="sk-x">${sk('sk--search')}
        <div class="sk-row">${sk('sk--chip')}${sk('sk--chip')}${sk('sk--chip')}</div><div class="narrow-only"><div class="sk-grid">${Array.from({ length: 6 }, () => sk('sk--poster sk--fill')).join('')}</div></div>
        <div class="wide-only"><div class="sk-piles">${[0, 1, 2].map(i => `<span class="sk-pile">${sk('sk--poster sk--fill', `--r:${[-4, 3, -2][i]}deg`)}${sk('sk--poster sk--fill', `--r:${[5, -6, 4][i]}deg`)}${sk('sk--poster sk--fill', '--r:0deg')}</span>`).join('')}</div></div></div>`)}`;
    return `<div class="h-top narrow-only"><span class="s-wm">kino<i></i></span>${bellBtn(st, '')}</div>${wrap(`<div class="sk-home"><div class="sk-hero">${sk('sk--greet')}${sk('sk--line', 'width:64%')}</div>
      <div class="sk-split"><div class="sk-main">${sk('sk--head')}${skItem()}${skItem()}${skItem()}</div><div class="sk-side"><div class="sk-card">${sk('sk--title', 'width:50%')}<div class="sk-grid sk-grid--3">${sk('sk--poster sk--fill')}${sk('sk--poster sk--fill')}${sk('sk--poster sk--fill')}</div>${sk('sk--button')}</div></div></div></div>`)}`;
  }
  // Catching up, under the greeting, for an ordinary load. On a slow connection the line at the top says so instead (offLine)
  const catchUp = (st, who = null) => (st.loading === 'cached' && !st.slow ? `<div class="st-catch">${loader(st, 'sm', who, 'Catching up', 'span')}<span>Catching up</span></div>` : '');

  // 4 · Nothing here yet: every empty space offers something real to start from (worth keeping fresh, your note)
  const hollowPile = () => `<span class="st-pile" aria-hidden="true"><span></span><span></span><span></span></span>`;
  const emptyWatch = () => `<div class="st-empty">${hollowPile()}<b>Nothing saved yet</b><span class="sub">Tap the bookmark on a film to keep it here. Friends saved these lately:</span></div>
        <div class="poster-grid st-empty__grid">${[['dune', ['jo', 'sam']], ['parasite', ['ari']], ['budapest', ['maya']]].map(([k, who]) => tile(k, who)).join('')}</div>`;
  const emptyDiary = () => `<div class="st-empty"><b>Your diary starts with your next film</b><span class="sub">Watched one of these lately? Tap it to log when, and who with.</span></div>
        <div class="st-empty__row">${['interstellar', 'odyssey', 'coyote'].map(k => `<button class="tile" data-act="log-k" data-k="${k}" aria-label="Log ${F[k][0]}">${poster(k, 'm')}</button>`).join('')}</div>`;
  const emptyBell = () => `<div class="st-empty"><b>All quiet</b><span class="sub">When friends vote, rank or reply, it shows up here. Meanwhile, from this week:</span></div>
        <div class="n-sec">${[['maya', 'interstellar', 9.3, '2h'], ['sam', 'arrival', 9.4, 'Yesterday']].map(([q, k, s2, when]) => `<div class="n-row tap" data-go="#/film/${k}"><span class="n-row__lead">${pfLink(q, avatar(q))}</span>
          <span class="n-row__body"><span class="n-row__text"><b>${P[q].n}</b> ranked ${F[k][0]}</span><span class="n-row__sub">${score(q, s2)}<span aria-hidden="true">·</span><span>${when}</span></span></span><span class="n-row__end"><span class="n-thumb">${poster(k, 'xs')}</span></span></div>`).join('')}</div>`;
  const emptySearch = () => `<div class="st-empty"><b>No films called "Paddingtn"</b><span class="sub">Try a director, or a friend's name. Or start with what friends are loving:</span></div>
        <div class="poster-grid st-empty__grid">${PILES[0].films.slice(0, 6).map(k => tile(k, PILES[0].who[k])).join('')}</div>`;

  // 5 · When something breaks: only the part that failed says so, in place (glitches, little irks), and your rankings are safe. Actions
  // that fail keep what you did and offer Try again. The whole screen only when it really goes wrong: Kino itself down ('down').
  const errCard = (what, extra = '') => `<div class="st-err"><span class="st-err__mark" aria-hidden="true"><span></span><span></span><span></span></span>
      <b>Couldn't load ${what}</b><span class="sub">Check your connection and try again. Your rankings are safe.${extra}</span><button class="k-btn k-btn--secondary k-btn--sm" data-act="retry">Try again</button></div>`;
  const errScreen = () => `<div class="st-down"><span class="st-err__mark st-err__mark--big" aria-hidden="true"><span></span><span></span><span></span></span>
      <h1 class="kino-display-l">Something went sideways.</h1><p class="s-sub">Kino couldn't load just now. Your rankings and lists are safe.</p>
      <button class="k-btn k-btn--primary" data-act="retry">Try again</button></div>`;
  // A poster that won't load shows the placeholder (the same dots as a missing backdrop), never a broken image
  const brokenPoster = (k, size = 'm') => `<div class="k-poster k-poster--${size} is-broken" role="img" aria-label="${F[k][0]}"></div>`;

  // 6 · Offline: one quiet line under the top (worth the room, your note); what you saw stays, and anything you do waits as a
  // hollow dot, like your vote, until you're back. A slow connection on a page that has loaded uses the same line (round 2, Noah's
  // pick: a very visible indicator); with nothing loaded yet it's the smaller line over the shapes (slowLine).
  const offLine = st => (st.offline ? `<div class="st-off" role="status"><span class="k-dot k-dot--empty"></span><span><b>You're offline.</b> Kino will catch up when you're back.</span><button class="k-btn k-btn--ghost k-btn--sm st-off__go" data-act="online">Try again</button></div>`
    : st.slow ? `<div class="st-off" role="status">${loader(st, 'sm', null, 'Loading', 'span')}<span><b>Slow connection.</b> Showing what you saw last.</span></div>` : '');

  /* ---------- round 2, passed (2026-10-10): only Noah's picks are left ----------
     st.pull { p: 0..1, state: 'pull' | 'loading' } · #/lock · st.slow { stage: 1 | 2 } · st.ask { what: 'push' | 'contacts', step: 'pre' | 'system' } */

  // 1 · Pull to refresh (iPhone): the crowd's dots arrive one by one as you pull, then take turns while it refreshes
  function pullZone(st) {
    const pl = st.pull, p = Math.max(0, Math.min(1, pl.p == null ? 1 : pl.p)), loading = pl.state === 'loading', h = Math.round((loading ? 1 : p) * 76);
    const body = loading ? loader(st, 'md', null, 'Refreshing') : `<span class="pr-dots">${CROWD3.map((hh, i) => `<span class="k-dot id-${hh}" style="--s:${Math.max(0, Math.min(1, p * 3 - i))}"></span>`).join('')}</span>`;
    return `<div class="pr" style="height:${h}px" aria-hidden="${!loading}">${body}</div>`;
  }

  // 2 · Push notifications, on the lock screen: the people lead, in iOS's communication style. A friend's own avatar carries the
  // bell's cream dot just off its top right instead of Kino's mark on the photo (Noah's note: the mark looked jumbled and covered the
  // initials); It's settled. leads with the group's bundle and nothing on it. On a real iPhone, iOS itself adds the app's icon to the
  // corner of the sender's photo in this style and an app can't replace it, so this shows the intent.
  const PUSHES = [['jo', 'Jo', 'Nudged you to vote', 'Thursday film club is waiting on you. Friday, 8pm.', 'now'],
    ['', 'It\'s settled.', 'Project Hail Mary, Friday at 8pm', 'Thursday film club picked it. Streaming on MUBI.', '12m'],
    ['maya', 'Maya', 'Ranked Interstellar 9.3', 'Rewatched it on the biggest screen I could find. The docking scene still makes my palms sweat.', '1h'],
    ['ari', 'Ari', 'Replied to your take on Arrival', 'IMAX or nothing.', '2h']];
  function lockScreen() {
    const lead = q => (q ? `<span class="lk-av">${avatar(q, '')}<span class="lk-new" role="img" aria-label="New"></span></span>` : `<span class="lk-av lk-av--group">${cluster(GROUPS[0].who, 38)}</span>`);
    const row = ([q, who, title, body, when]) => `<div class="lk-note"><span class="lk-lead">${lead(q)}</span><span class="lk-text"><span class="lk-top"><b>${who}</b><span>${when}</span></span>
        <span class="lk-title">${title}</span><span class="lk-body">${body}</span></span></div>`;
    return `<div class="lk"><img class="lk-wall" src="stills/backdrop-interstellar.jpg" alt=""><div class="lk-in"><div class="lk-clock"><span>Saturday, October 11</span><b>9:41</b></div>
      <div class="lk-stack">${PUSHES.map(row).join('')}</div></div></div>`;
  }

  // 4 · Asking for permission: Kino asks in its own words right when it matters (after your first vote; when you're finding your
  // people), then iOS asks, and you're back where you were with the pill saying what changed (Noah: "fleeting, but very important")
  function askSheet(st) {
    const a = st.ask, push = a.what !== 'contacts', g = GROUPS[0];
    // then the system asks: iOS's alert on iPhone; on the web, the browser's own prompt under the address bar (drawn plainly)
    if (a.step === 'system') return `<div class="app__overlay ios-dim"><div class="narrow-only"><div class="ios-alert" role="alertdialog"><div class="ios-alert__text"><b>“Kino” Would Like to ${push ? 'Send You Notifications' : 'Access Your Contacts'}</b>
        <span>${push ? 'Notifications may include alerts, sounds and icon badges. These can be configured in Settings.' : 'Kino finds friends who are already here. Your contacts never leave your phone.'}</span></div>
        <div class="ios-alert__acts"><button data-act="ask-no">Don’t Allow</button><button data-act="ask-yes">Allow</button></div></div></div>
        <div class="wide-only"><div class="br-ask" role="alertdialog"><b>kino.app wants to</b><span class="br-ask__what">${ic('bell')}Show notifications</span>
        <div class="br-ask__acts"><button data-act="ask-no">Block</button><button class="is-main" data-act="ask-yes">Allow</button></div></div></div></div>`;
    return sheetWrap({ fresh: false }, 'ask-no', push ? 'Notifications' : 'Contacts', `${sheetHead('', 'ask-no')}<div class="gs-confirm ask">${push ? cluster(g.who, 64) : `<span class="set-mark">${ic('users-three')}</span>`}
        <h2 class="kino-display-m">${push ? 'Know when it\'s settled?' : 'Find friends from your contacts?'}</h2><p class="s-sub">${push ? 'Kino will tell you when Thursday film club picks, and when it\'s your turn. Nothing else.' : 'Kino checks who\'s already here. Your contacts never leave your phone.'}</p></div>
        <button class="k-btn k-btn--primary k-btn--block" data-act="ask-go">${push ? 'Turn on notifications' : 'Find my friends'}</button><button class="k-btn k-btn--ghost k-btn--block" data-act="ask-no">Not now</button>`, 'ask-sh');
  }

  /* ---------- rank flow (sheet) ---------- */
  function myListWith(st) { return Object.entries(Object.assign({}, MY, st.ranked)).sort((a, b) => b[1] - a[1]); }
  function rankSheet(st) {
    const r = st.sheet, k = r.k, b = r.bucket && BUCKETS[r.bucket];
    const dots = [0, 1, 2].map(i => `<span class="k-dot ${i <= r.step ? '' : 'k-dot--empty'}"></span>`).join('');
    let body;
    // The question floats in the middle; the answers sit low, where a thumb already is
    if (r.step === 0) body = `<div class="r-q">${poster(k, 'm')}<h2 style="margin-top:12px">How was ${F[k][0]}?</h2><p class="s-sub">Pick a feeling first. We'll find the exact spot next.</p></div>
      <div class="r-choices">${Object.entries(BUCKETS).map(([id, bb]) => `<button class="k-btn k-btn--secondary" data-act="bucket" data-b="${id}">${ic(bb.icon)}${bb.label}</button>`).join('')}</div>`;
    else if (r.step === 1) { const vs = b.vs[r.i];
      body = `<div class="r-q"><span class="sub">Comparison ${r.i + 1} of ${b.vs.length}</span><h2>Which did you like more?</h2></div>
      <div class="r-versus">${[k, vs].map(kk => `<button class="r-option" data-act="pick" data-win="${kk === k ? 1 : 0}">${poster(kk, 'l')}<b>${F[kk][0]}</b><span class="r-option__meta">${F[kk][1]}${kk !== k ? score('you', MY[kk]) : ''}</span></button>`).join('')}</div>
      <div class="r-ties"><button class="k-btn k-btn--ghost k-btn--sm r-tie" data-act="pick" data-win="0.5">Too close to call</button><button class="k-btn k-btn--ghost k-btn--sm r-tie" data-act="pick" data-win="skip">Haven't seen ${F[vs][0]}</button></div>
`; }
    else {
      const s = st.ranked[k], list = myListWith(st), i = list.findIndex(([kk]) => kk === k), around = list.slice(Math.max(0, i - 1), i + 2);
      const fr = (X[k] || {}).friends || [];
      const closest = fr.slice().sort((a, b2) => Math.abs(a[1] - s) - Math.abs(b2[1] - s))[0];
      // The film you just ranked leads the result (quick fix, 2026-10-09: the cards are the priority while you rank)
      body = `<div class="r-result"><span class="r-result__poster">${poster(k, 'm')}</span><div class="r-result__text"><span class="r-result__label">Ranked</span><span class="k-score k-score--hero"><span class="k-dot"></span><span class="k-score__num" data-count="${s}" data-from="${b.range[0]}">${fmt(s)}</span></span>

        all.push(l); st.lsnew = null;
        if (n.withFilm) { st.toast = { text: `Added ${F[n.withFilm][0]} to ${l.name}` }; render(true); toastAway(); } else { st.nav = 'fwd'; go('#/list/' + id); } }
      else if (a === 'lsadd') { st.rpick = { fresh: true, mode: 'list', list: t.dataset.l }; render(true); }
      else if (a === 'pptab') { st.pplTab = t.dataset.t; if (st.ppsheet) render(true); else patch(['.m-seg', '.pp-list']); }
      else if (a === 'ppclose' || a === 'ppoverlay') dismiss(root, () => { st.ppsheet = null; render(true); });
      else if (a === 'thread') { const key = t.dataset.key, take = FRIEND_TAKES.concat(STRANGER_TAKES).find(x => x[0] + x[1] === key);
        if (st.threadStyle === 'inline') { st.openThread = st.openThread === key ? null : key; render(true); } else if (take) { st.thread = { fresh: true, take }; render(true); } }
      else if (a === 'thclose' || a === 'thoverlay') dismiss(root, () => { st.thread = null; render(true); });
      else if (a === 'th-send') { const key = t.dataset.key, txt = ((st.drafts || {})[key] || '').trim(); if (!txt) return;
        st.myReplies[key] = [...(st.myReplies[key] || []), ['you', txt, 'now']]; st.drafts[key] = ''; render(true); }
      else if (a === 'ob-start') { st.ob = obFresh(st.obDefaults); st.nav = 'fwd'; go('#/join'); }
      else if (a === 'ob-exit') { st.si = 'back'; st.nav = 'back'; go('#/signin'); }
      else if (a === 'ob-next') obNext();
      else if (a === 'ob-back') { if (st.ob && st.ob.i > 0) { st.ob.i--; st.nav = 'back'; render(); } else { st.nav = 'back'; go(st.ob && st.ob.flow === 'friend' ? '#/signin' : '#/welcome'); } }
      else if (a === 'ob-seen') { const k = t.dataset.k; if (st.ob.seen[k]) delete st.ob.seen[k]; else { st.ob.seen[k] = true; st.fx = 'seen-' + k; } render(true); }
      else if (a === 'ob-vs') { const ob = st.ob; if (t.dataset.k) ob.wins[t.dataset.k] = (ob.wins[t.dataset.k] || 0) + 1; ob.vs++; if (ob.vs >= obPairs(st).length) obNext(); else { st.nav = 'fwd'; render(); } }
      else if (a === 'ob-follow') { const p2 = t.dataset.p; st.ob.fol[p2] = t.getAttribute('aria-pressed') !== 'true'; render(true); }
      else if (a === 'ob-done') obDone();
      else if (a === 'ymenu') { st.ymenu = st.ymenu ? null : 'fresh'; st.bell = null; render(true); }
      else if (a === 'gear') { if (root.offsetWidth >= 900) { st.nav = 'fwd'; go('#/settings'); } else { st.ysheet = { fresh: true }; render(true); } }
      else if (a === 'yoverlay') dismiss(root, () => { st.ysheet = null; render(true); });
      else if (a === 'signout') { st.ymenu = null; st.ysheet = null; st.setsheet = null; st.si = 'back'; st.nav = 'tab'; go('#/signin'); st.hist = []; }
      else if (a === 'si') { st.si = t.dataset.v; render(true); }
      else if (a === 'signin') { st.si = 'back'; st.nav = 'tab'; go('#/home'); st.hist = []; }
      else if (a === 'mtab') { if (t.dataset.t === st.mtab) return; st.mtab = t.dataset.t; render(true); }
      else if (a === 'setsheet') { st.setsheet = { id: t.dataset.s, fresh: true }; render(true); }
      else if (a === 'setclose' || a === 'soverlay') dismiss(root, () => { st.setsheet = null; render(true); });
      else if (a === 'hue') { P.you.h = t.dataset.h; render(true); }
      else if (a === 'priv') { st.priv = t.dataset.p; render(true); }
      else if (a === 'import') { st.setsheet.done = true; render(true); }
      else if (a === 'delete') { st.setsheet = null; st.si = 'other'; st.nav = 'tab'; go('#/signin'); st.hist = []; }
      else if (a === 'theme') { st.theme = t.dataset.t; if (opts.hash) applyTheme(st.theme); render(true); }
      else if (a === 'copy') { st.copied = true; render(true); }
      else if (a === 'nset') { const on = st.nprefs[t.dataset.t] = !st.nprefs[t.dataset.t]; t.setAttribute('aria-checked', on); } // in place, so the switch slides
    });
    render();
    if (window.ResizeObserver) new ResizeObserver(() => { const sc = root.querySelector('.app__scroll'); if (sc) root.style.setProperty('--app-h', sc.clientHeight + 'px'); }).observe(root);
    // Boards can open a frame part-way down a screen (e.g. straight to "Where to watch")
    if (opts.scrollTo) {
      const jump = () => { const sc = root.querySelector('.app__scroll'), el = root.querySelector(opts.scrollTo); if (!sc || !el) return;
        let y = 0, n = el; while (n && n !== root) { y += n.offsetTop; n = n.offsetParent; }
        const stick = root.querySelector('.s-sticky'), under = stick && stick !== el && (stick.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING) ? stick.offsetHeight : 0;
        sc.scrollTop = Math.max(0, y - sc.offsetTop - 12 - under); };
      requestAnimationFrame(jump); if (document.fonts) document.fonts.ready.then(jump);
    }
    return st;
  }
  return { mount };
})();
