      else if (a === 'gmenu') { st.swiped = null; st.gsheet = { id: t.dataset.gid, step: 'menu' }; render(true); }
      else if (a === 'gask') { st.swiped = null; st.gsheet = { id: t.dataset.gid, step: t.dataset.step }; render(true); }
      else if (a === 'gmute') { const id = t.dataset.gid; st.muted[id] = !st.muted[id]; st.swiped = null; st.gsheet = null; render(true); }
      else if (a === 'gclose' || a === 'goverlay') dismiss(root, () => { st.gsheet = null; render(true); });
      else if (a === 'gdo') { // the sheet closes, the row folds away, then an Undo stays up for a few seconds
        const id = t.dataset.gid, g = GROUPS.find(x => x.id === id), leaving = st.route.startsWith('#/group/');
        st.gsheet = null; render(true);
        const done = () => { st.removed[id] = true; st.toast = { text: `${t.dataset.step === 'delete' ? 'Deleted' : 'You left'} ${g.name}`, undo: id };
          if (leaving) { st.hist.push(st.route); st.route = '#/groups'; st.nav = 'back'; render(); } else render(true);
          clearTimeout(toastTimer); toastTimer = setTimeout(() => { st.toast = null; const el = root.querySelector('.app__toast'); if (el) el.remove(); }, 5000); };
        const row = root.querySelector(`.g-item[data-gid="${id}"]`);
        if (row && !calm()) row.animate([{ height: row.offsetHeight + 'px', opacity: 1 }, { height: '0px', opacity: 0 }], { duration: 280, easing: 'cubic-bezier(.2,.7,.2,1)' }).onfinish = done; else done(); }
      else if (a === 'undo') { delete st.removed[st.toast.undo]; st.toast = null; clearTimeout(toastTimer); render(true); }
      else if (a === 'group' && st.swiped) { st.swiped = null; root.querySelectorAll('.g-item.is-open').forEach(i => i.classList.remove('is-open')); }
      else if (a === 'group') { if (t.dataset.to) { st.nav = 'fwd'; go(t.dataset.to); } } // no spin: a quiet press, then the group pushes in
      else if (a === 'close' || a === 'overlay' || a === 'done') dismiss(root, () => { st.sheet = null; render(true); });
      else if (a === 'bucket') { r.bucket = t.dataset.b; r.step = 1; r.i = 0; r.wins = 0; r.dir = 'fwd'; render(true); }
      else if (a === 'pick') { if (r.busy) return; r.busy = true; // the poster you picked steps forward, the other steps back, then the next pair slides in
        const opts2 = t.closest('.r-body').querySelectorAll('.r-option');
        opts2.forEach(o => o.classList.add(t.dataset.win === '0.5' ? 'is-tie' : o === t ? 'is-chosen' : 'is-passed'));
        setTimeout(() => { r.busy = false; r.wins += +t.dataset.win; r.i++; r.dir = 'fwd'; const b = BUCKETS[r.bucket];
        if (r.i >= b.vs.length) { const [lo, hi] = b.range; st.ranked[r.k] = Math.round((lo + (hi - lo) * (r.wins / b.vs.length)) * 10) / 10; r.step = 2; }
        render(true); }, calm() ? 0 : 280); }
      else if (a === 'rback') { r.dir = 'back'; if (r.step === 2) { delete st.ranked[r.k]; r.step = 1; r.i = 0; r.wins = 0; } else if (r.i > 0) { r.i--; } else r.step = 0; render(true); }
      else if (a === 'chip') { const set = st.pile ? st.pchips[st.pile] : st.chips; set[t.dataset.c] = !set[t.dataset.c]; patch(['.x-chips', '.x-zone']); }
      else if (a === 'pile') { st.pile = t.dataset.p; patch(['.x-chips', '.x-zone']); }
      else if (a === 'unpile') { st.pile = null; patch(['.x-chips', '.x-zone']); }
      else if (a === 'rfilter') { st.rfilter = t.dataset.f; patch(['.r-feel', '.r-all']); }
      else if (a === 'toggle') { const on = st.prefs[t.dataset.t] = !st.prefs[t.dataset.t]; t.setAttribute('aria-checked', on); // in place, so the switch slides
        t.closest('.e-row').querySelector('.sub').textContent = on ? t.dataset.v : t.dataset.v + ' · only you'; }
      else if (a === 'vote') { st.myVote = st.myVote === t.dataset.k ? null : t.dataset.k; render(true); }
      else if (a === 'suggest') { st.suggested = 'spiderman'; render(true); }
      else if (a === 'nudge') { st.nudged = true; st.fx = 'nudge'; render(true); }
      else if (a === 'lock') { st.locked = true; st.hist.push(st.route); st.route = '#/group/thursday/picked'; st.nav = 'fwd'; render(); }
      else if (a === 'unlock') { st.locked = false; st.route = '#/group/thursday'; st.nav = 'back'; render(); }
      else if (a === 'save') { const k = st.route.split('/')[2]; st.saved[k] = !st.saved[k]; st.fx = 'save'; render(true); }
      else if (a === 'ptab') { const i = +t.dataset.i; if (i === st.ptab) return; st.tabDir = i > st.ptab ? 'fwd' : 'back'; st.ptab = i; render(true); }
      else if (a === 'like') { const k = t.dataset.key; st.liked[k] = !st.liked[k]; st.fx = 'like-' + k; render(true); }
      else if (a === 'follow') { const p2 = t.dataset.p; st.followed[p2] = !following(st, p2); st.fx = 'follow-' + p2; render(true); }
      else if (a === 'fsave') { const k = t.dataset.k; st.saved[k] = !st.saved[k]; st.fx = 'save-' + k; render(true); }
      else if (a === 'play') { const k = t.dataset.k; st.playing = st.playing === k ? null : k; render(true); }
      else if (a === 'bell') { st.bell = st.bell ? null : 'list'; st.notesSeen = true; st.bellFx = st.bell && 'open'; render(true); }
      else if (a === 'bell-set') { st.bell = 'settings'; st.bellFx = 'fwd'; render(true); }
      else if (a === 'bell-list') { st.bell = 'list'; st.bellFx = 'back'; render(true); }
      else if (a === 'nset') { const on = st.nprefs[t.dataset.t] = !st.nprefs[t.dataset.t]; t.setAttribute('aria-checked', on); } // in place, so the switch slides
    });
    render();
    if (window.ResizeObserver) new ResizeObserver(() => { const sc = root.querySelector('.app__scroll'); if (sc) root.style.setProperty('--app-h', sc.clientHeight + 'px'); }).observe(root);
    // Boards can open a frame part-way down a screen (e.g. straight to "Where to watch")
    if (opts.scrollTo) {
      const jump = () => { const sc = root.querySelector('.app__scroll'), el = root.querySelector(opts.scrollTo); if (!sc || !el) return;
        let y = 0, n = el; while (n && n !== root) { y += n.offsetTop; n = n.offsetParent; }
        const stick = root.querySelector('.s-sticky'), under = stick && stick !== el && (stick.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING) ? stick.offsetHeight : 0;
        sc.scrollTop = Math.max(0, y - sc.offsetTop - 12 - under); };
      requestAnimationFrame(jump); if (document.fonts) document.fonts.ready.then(jump);
    }
    return st;
  }
  return { mount };
})();
</script>
