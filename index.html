        <div class="s-film__main">
          <div class="m-card m-card--flush"><div class="m-section-head"><h3>Friends · average ${fmt(avg)}</h3></div>
            ${friends.map(([p, s, t]) => `<div class="m-person" data-go="#/profile/${p}" style="cursor:pointer">${avatar(p)}<div class="m-person__body"><div class="m-person__name">${P[p].n === 'Maya' ? 'Maya Kim' : P[p].n}</div><div class="m-person__sub">${t || 'Ranked this week'}</div></div>${score(p, s)}</div>`).join('')}
          </div>
          <div class="s-section"><div class="m-section-head"><h3>About</h3></div><p class="s-sub" style="color:var(--kino-text-primary)">${x.about || 'A film your friends keep bringing up.'}</p>
            <div class="facts"><div><span>Director</span>${F[k][2]}</div><div><span>Released</span>${F[k][1]}</div><div><span>Runtime</span>${x.rt || '–'}</div><div><span>Genre</span>${(x.g || []).join(', ')}</div></div></div>
          ${where}
          ${x.cast ? `<div class="s-section"><div class="m-section-head"><h3>Cast</h3></div><div class="cast">${x.cast.map(([n, r]) => `<div>${face(n)}<b>${n}</b>${r}</div>`).join('')}</div></div>` : ''}
        </div>
      </div>`;
  }

  // No groups yet: friends and films take turns around the "+" in one even ring (V.2.1 crit: nothing ever sits on top of anything,
  // no big gaps, always roughly a circle). The ring turns slowly as one; each piece bobs a little. Laid out afresh each visit.
  const FIELD = [['maya', 'jo', 'ari', 'sam', 'noor', 'toystory5', 'spirited', 'interstellar', 'budapest', 'hailmary'],
    ['theo', 'kai', 'lena', 'rui', 'arrival', 'parasite', 'coyote', 'dune']]; // the second, wider scatter shows on web only
  const rng = seed => () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 2 ** 32;
  function field(seed) {
    const r = rng(seed), out = [], shuffle = a => a.map(x => [r(), x]).sort((p, q) => p[0] - q[0]).map(([, x]) => x);
    FIELD.forEach((pieces, band) => {
      const people = shuffle(pieces.filter(x => P[x])), films = shuffle(pieces.filter(x => !P[x])), ring = [];
      while (people.length || films.length) { if (people.length) ring.push(people.shift()); if (films.length) ring.push(films.shift()); }
      const step = 360 / ring.length, off = r() * 360;
      ring.forEach((x, i) => { const person = !!P[x];
        // The web's outer ring sits closer (V.2.1, passed crit; was 1.14 for everyone): its people at 1.02 and its films at 1.10,
        // the nearest each can come at web size without ever touching an inner piece, whatever the angle
        out.push({ x, person, wide: band === 1, a: off + i * step + (r() - .5) * step * .14, d: band ? (person ? 1.02 : 1.1) : (person ? .66 : .7) + (r() - .5) * .03,
          s: person ? 30 + r() * 2 : 42 + r() * 4, dur: band ? 320 : 260, bob: 5 + r() * 3, bd: -r() * 6 }); });
    });
    return out;
  }
  const fieldItem = o => `<span class="g-field__item ${o.person ? 'is-person' : 'is-film'} ${o.wide ? 'wide-only' : ''}" style="--a:${o.a.toFixed(1)}deg;--d:${o.d.toFixed(3)};--s:${o.s.toFixed(0)}px;--dur:${o.dur.toFixed(0)}s;--bob:${o.bob.toFixed(1)}s;--bd:${o.bd.toFixed(1)}s">
      <span class="g-field__up">${o.person ? `<span class="k-avatar id-${P[o.x].h}">${P[o.x].i}</span>` : poster(o.x, 's')}</span></span>`;

  function groups(st) {
    const top = topbar('');
    const head = `<div class="s-head g-head"><h1 class="s-title">Groups</h1><p class="s-sub">Pick something everyone will love, together.</p></div>`;
    if (st.noGroups) {
      return `${top}${head}
        <div class="g-start">
          <div class="g-orbit"><span class="g-field" aria-hidden="true">${field(st.seed).map(fieldItem).join('')}</span>
            <button class="g-orbit__plus" data-act="gnew" aria-label="Start a group">${ic('plus')}</button>
          </div>
          <div class="g-start__copy"><h2 class="kino-display-m">Start your first group</h2><p class="s-sub">Pick a few friends. Kino finds films you'll all love.</p>
            <button class="k-btn k-btn--secondary">${ic('share-network')}Invite with a link</button></div>
        </div>`;
    }
    // Quiet rows, like Messages: a bundle of the members' dots, the name, one line of what's happening.
    // A Tomato dot on the bundle's top right means it's your turn, like a notification. Tapping gives a little, then opens the group.
    // On iPhone, swipe a row left for Mute and Leave (Delete, if you started it). On web, "…" on a row opens the same options.
    const item = g => {
      const live = g.id === 'thursday', mine = g.by === 'you', open = st.swiped === g.id, tab = open ? '' : 'tabindex="-1"';
      const sub = live ? 'Voting for Friday. Waiting on you' : g.last ? `Last pick: ${F[g.last][0]}` : `${g.who.length} people · no pick yet`;
      const when = live ? 'Fri' : g.date || '';
      const to = live ? '#/group/thursday' : g.id === 'two' ? '#/profile/maya' : g.fresh ? '#/group/' + g.id : '';
      return `<div class="g-item ${open ? 'is-open' : ''}" data-gid="${g.id}">
        <span class="g-acts narrow-only"><button class="g-act" data-act="gmute" data-gid="${g.id}" ${tab}><span class="g-act__dot">${ic('bell')}</span>${st.muted[g.id] ? 'Unmute' : 'Mute'}</button>
          <button class="g-act g-act--danger" data-act="gask" data-gid="${g.id}" data-step="${mine ? 'delete' : 'leave'}" ${tab}><span class="g-act__dot">${ic('x')}</span>${mine ? 'Delete' : 'Leave'}</button></span>
        <button class="g-row ${live ? 'is-live' : ''}" data-act="group" data-to="${to}" aria-label="${g.name}, ${members(g.who)}${live ? ', waiting on you' : ''}">
          <span class="g-bundle">${cluster(g.who, 60)}${live ? '<span class="g-bundle__turn" aria-hidden="true"></span>' : ''}</span><span class="g-row__text"><span class="g-row__title">${g.name}</span><span class="g-row__sub">${st.muted[g.id] ? 'Muted · ' : ''}${sub}</span></span><span class="g-row__when">${when}</span></button>
        <span class="wide-only"><button class="k-iconbtn k-iconbtn--ghost k-iconbtn--sm g-more" data-act="gmenu" data-gid="${g.id}" aria-label="Options for ${g.name}">${ic('dots-three')}</button></span></div>`; };
    return `${top}${head}
      <div class="g-list">${allGroups(st).filter(g => !st.removed[g.id]).map(item).join('')}
        <div class="g-item"><button class="g-row g-row--new" data-act="gnew" aria-label="Start a new group"><span class="g-new">${ic('plus')}</span><span class="g-row__text"><span class="g-row__title">New group</span><span class="g-row__sub">Pick a few friends, or invite with a link</span></span><span></span></button></div>
        <div class="g-item"><button class="g-row g-row--new" data-act="gjoin" aria-label="Join a group with a code"><span class="g-new">${ic('ticket')}</span><span class="g-row__text"><span class="g-row__title">Join with a code</span><span class="g-row__sub">Got a code from a friend?</span></span><span></span></button></div></div>
      <button class="k-btn k-btn--accent k-btn--block narrow-only">${ic('popcorn')}Start a group pick</button>`;
  }

  // Group options: mute, leave, or delete if you started it. Leaving and deleting ask once more, with the bundle front and centre.
  function groupSheet(st) {
    const s = st.gsheet, g = GROUPS.find(x => x.id === s.id), mine = g.by === 'you', del = s.step === 'delete';
    const body = s.step === 'menu'
      ? `<div class="gs-head">${cluster(g.who, 56)}<div class="gs-head__text"><b>${g.name}</b><span class="sub">${members(g.who)}</span></div></div>
        <div class="gs-list">
          <button class="gs-row" data-act="gmute" data-gid="${g.id}"><b>${st.muted[g.id] ? 'Unmute' : 'Mute for a week'}</b><span class="sub">${st.muted[g.id] ? 'Nudges and pick alerts come back on' : 'No nudges or pick alerts from this group'}</span></button>
          <button class="gs-row gs-row--danger" data-act="gask" data-gid="${g.id}" data-step="leave"><b>Leave group</b><span class="sub">Anyone in it can invite you back</span></button>
          ${mine ? `<button class="gs-row gs-row--danger" data-act="gask" data-gid="${g.id}" data-step="delete"><b>Delete group</b><span class="sub">Removes it for everyone in it</span></button>`
            : `<p class="sub gs-note">Only ${P[g.by].n}, who started it, can delete it</p>`}
        </div>
        <button class="k-btn k-btn--ghost k-btn--block" data-act="gclose">Done</button>`
      : `<div class="gs-confirm">${cluster(g.who, 72)}<h2 class="kino-display-m">${del ? 'Delete' : 'Leave'} ${g.name}?</h2>
          <p class="s-sub">${del ? 'It goes for everyone in it. Past picks stay in everyone\'s rankings.' : 'You\'ll stop seeing its picks and nudges. Anyone in it can invite you back.'}</p></div>
        <button class="k-btn k-btn--danger k-btn--block" data-act="gdo" data-gid="${g.id}" data-step="${s.step}">${del ? 'Delete group' : 'Leave group'}</button>
        <button class="k-btn k-btn--ghost k-btn--block" data-act="gclose">Keep it</button>`;
    return `<div class="app__overlay" data-act="goverlay"><div class="app__sheet app__sheet--fit gs" role="dialog" aria-label="${g.name}">${body}</div></div>`;
  }

  function vote(st) {
    const g = GROUPS[0], host = st.host || 'you', pending = st.pending || [];
    const pool = CANDS.concat(st.suggested ? [{ k: st.suggested, by: 'you', fit: '3 of 4 likely 8 or higher', votes: [] }] : []);
    const voted = c => c.votes.filter(p => !pending.includes(p)).concat(st.myVote === c.k ? ['you'] : []);
    const waitingOn = g.who.filter(p => (p === 'you' ? !st.myVote : pending.includes(p)));
    const others = waitingOn.filter(p => p !== 'you'), allIn = !waitingOn.length, nIn = g.who.length - waitingOn.length;
    const by = c => c.by === 'kino' ? `<span class="v-by">Kino's pick</span>`
      : `<span class="v-by"><span class="k-dot ${c.by === 'you' ? '' : 'id-' + P[c.by].h}"></span>${c.by === 'you' ? 'Your pick' : P[c.by].n + '\'s pick'}</span>`;
    const spots = POOL_MAX - pool.length, top = Math.max(...pool.map(c => voted(c).length));
    // Equal posters, spaced out. Your choice is the largest; before you vote, the leader lifts a little to show where the group is leaning.
    // Voters' dots (with initials) just touch each poster's bottom edge: the one thing
    // allowed on a poster (call 1). The titles stay underneath as captions.
    const film = c => { const v = voted(c), mine = st.myVote === c.k, lead = !st.myVote && top > 0 && v.length === top;
      return `<div class="v-film ${mine ? 'is-mine' : ''} ${lead ? 'is-lead' : ''}" data-flip="vf-${c.k}">
        <button class="v-film__poster" data-act="vote" data-k="${c.k}" data-flip-t="vp-${c.k}" aria-pressed="${mine}" aria-label="${mine ? 'Your vote: ' : 'Vote for '}${F[c.k][0]}">${poster(c.k, 'm')}</button>
        <span class="v-film__votes" aria-label="${v.length ? 'Votes from ' + names(v) : 'No votes yet'}">${v.length ? v.map(p => `<span class="v-dot ${p === 'you' ? 'id-you' : 'id-' + P[p].h}${p === 'you' && (st.offline || st.err === 'vote') ? ' is-pending' : ''}" data-flip="vd-${p}">${P[p].i}</span>`).join('') : '<span class="v-film__none">No votes</span>'}</span>
        <span class="v-film__title tap" data-go="#/film/${c.k}">${F[c.k][0]}</span>${by(c)}</div>`; };
    // The next empty slot holds a "+" dot to suggest a film (one each, five films at most)
    const add = !st.suggested && spots > 0 ? `<button class="v-film v-film--add" data-act="suggest" data-flip="v-add"><span class="v-plus">${ic('plus')}</span><span class="v-film__title">Suggest a film</span><span class="v-by">${spots} spot${spots === 1 ? '' : 's'} left</span></button>` : '';
    const focus = pool.find(c => c.k === st.myVote);
    const sub = !st.myVote ? 'Tap a poster to vote. Kino\'s picks are films the whole group is likely to love.'
      : !allIn ? `You're in. Waiting on ${names(others)}`
      : host === 'you' ? 'Everyone\'s in. Lock it whenever you\'re ready.' : `Everyone's in. ${P[host].n} will lock it soon.`;
    return `${topbar(g.name, { back: true, end: iconbtn('dots-three', 'Group options', 'data-act="gmenu" data-gid="thursday"') })}<div class="wide-only s-pagenav">${webBack}</div>
      ${offLine(st)}<div class="s-head"><span class="sub wide-only">${g.name}</span><h1 class="s-title">What are we watching ${g.when.split(' ·')[0]}?</h1><p class="s-sub">${sub}</p></div>${catchUp(st, g.who)}
      <div class="s-vote">
        <div><div class="v-field v-field--${st.dots || 'edge'}">${pool.map(film).join('')}${add}</div>
          ${focus ? `<p class="v-focus">Your vote: <b>${F[focus.k][0]}</b>. ${st.offline ? 'It sends when you\'re back online' : st.err === 'vote' ? 'It didn\'t send yet' : focus.fit}${st.suggested ? `<br>You've added your suggestion. ${spots} spot${spots === 1 ? '' : 's'} left` : ''}</p>` : ''}</div>
        <aside><div class="v-tally"><div class="m-section-head"><h3>${nIn} of ${g.who.length} voted</h3></div>
          <div class="v-voters">${g.who.map(p => { const done = !waitingOn.includes(p); return `<button class="v-voter pf-link ${done ? '' : 'is-waiting'}" data-go="${pf(p)}" aria-label="${p === 'you' ? 'Your profile' : P[p].n + '\'s profile'}"><span class="k-avatar id-${P[p].h}">${P[p].i}${done ? `<span class="v-check">${ic('check')}</span>` : ''}</span>${P[p].n}</button>`; }).join('')}</div>
          ${others.length ? `<button class="k-btn k-btn--secondary k-btn--sm k-btn--block${fx(st, 'nudge', 'is-ring')}" data-act="nudge" ${st.nudged ? 'disabled' : ''}>${ic('bell')}${st.nudged ? 'Nudged ' : 'Nudge '}${P[others[0]].n}</button>` : ''}
          ${host === 'you'
            ? `<button class="k-btn k-btn--accent k-btn--block" data-act="lock" ${allIn ? '' : 'disabled'}>${ic('popcorn')}Lock the pick</button>
               <p class="sub" style="text-align:center">${allIn ? 'Only the host can lock it. That\'s you.' : st.myVote ? 'You can lock it once everyone\'s in.' : 'Vote first, then you can lock it.'}</p>`
            : `<p class="sub v-hostnote">${avatar(host, 'sm')}<span>${P[host].n} locks it once everyone's in</span></p>`}</div>${talkPreview(st)}</aside>
      </div>`;
  }

  function picked(st) {
    const g = GROUPS[0];
    const tally = CANDS.map(c => [c.k, c.votes.length + (st.myVote === c.k ? 1 : 0)]).sort((a, b) => b[1] - a[1]);
    const k = tally[0][0], [prov] = wtwFor(k);
    // No orbit: everyone's dot drops onto the pick's bottom edge, the same way votes sit on a poster. One screen, no scrolling.
    const dots = `<span class="p-dots" aria-label="Watching: ${names(g.who)}">${g.who.map((p, i) => `<span class="v-dot ${p === 'you' ? 'id-you' : 'id-' + P[p].h}" style="--i:${i}">${P[p].i}</span>`).join('')}</span>`;
    return `${topbar('', { back: true })}<div class="wide-only s-pagenav">${webBack}</div>
      <div class="picked"><h1 class="picked__hero">It's settled.</h1>
        <div class="p-stage tap" data-go="#/film/${k}" aria-label="${F[k][0]}">${poster(k, 'xl')}${dots}</div>
        <div class="picked__info">
          <div class="s-head"><h2 class="picked__title">${F[k][0]}</h2><span class="s-sub">${g.name} · ${g.when}</span></div>
          <p class="s-sub picked__why">${tally[0][1]} of 4 voted for it, and Kino predicts the group will score it around 8.7</p>
          <div class="picked__actions"><button class="k-btn k-btn--primary">Watch now${ic('arrow-up-right')}</button><span class="sub">Streaming on ${prov[0]}</span>
            <div class="picked__row"><button class="k-btn k-btn--secondary">${ic('calendar-blank')}Add to calendar</button><button class="k-btn k-btn--secondary">${ic('share-network')}Share</button></div>
            <button class="k-btn k-btn--ghost" data-act="unlock">Change the pick</button></div>
          <p class="sub">After Friday, everyone gets a nudge to rank it.</p></div></div>`;
  }

  function profile(st, p) {
    if (!P[p] || p === 'you') p = 'maya';
    const stranger = !!P[p].followers, list = p === 'maya' ? null : [...FRIEND_TAKES, ...STRANGER_TAKES].filter(x => x[0] === p).map(([, k, s2, t, txt]) => [k, s2, t, txt, 4, 1]);
    const TABS = [['Taste', () => taste(p) + match(p)], ...(stranger ? [] : [['Together', () => together(p)]]), ['Rankings', () => rankings(p, { mine: Object.assign({}, MY, st.ranked) })], ['Takes', () => takes(p === 'maya' ? {} : { who: p, list })]];
    const actions = `${followBtn(st, p, 'k-btn--primary')}${stranger ? '' : `<button class="k-btn k-btn--secondary k-btn--sm">${ic('arrows-left-right')}Compare</button>`}`;

        <div>${catchUp(st, [p, 'you'])}<div class="s-sticky"><div class="m-seg" role="tablist">${TABS.map(([t], i) => `<button role="tab" aria-selected="${i === st.ptab}" data-act="ptab" data-i="${i}">${t}</button>`).join('')}</div></div>
          <div class="s-panel ${st.ptab === 0 ? 's-panel--2' : ''} ${st.tabDir ? 's-panel--' + st.tabDir : ''}">${TABS[st.ptab][1]()}</div></div>
      </div>`;
  }

  function me(st) {
    const list = myListWith(st), total = MY_TOTAL + Object.keys(st.ranked).length;
    const tools = iconbtn('share-network', 'Share profile') + iconbtn('gear-six', 'Settings and more', 'data-act="gear"');
    return `${topbar('', { end: tools })}
      <div class="s-split" data-profile><aside class="s-profile-side"><div class="wide-only"><div class="s-profile-tools">${tools}</div></div>${header('own')}</aside>
        <div>${taste('you', { top: list.slice(0, 3).map(([k]) => k) })}
          <section class="mf mf--profile"><div class="m-section-head"><h3>Your films</h3><span class="sub">${total} ranked</span></div>${filmsBody(st, false)}</section>${credit(st)}</div></div>`;
  }
  const rankRow = (k, s, n) => `<div class="o-rank__row tap" data-go="#/film/${k}"><span class="o-rank__num">${n}</span>${poster(k, 'xs')}<div class="o-rank__body"><span class="o-rank__title">${F[k][0]}</span><span class="m-film-row__meta">${F[k][1]} · ${F[k][2]}</span></div><div class="o-cols"><span class="o-col">${score('you', s)}</span></div></div>`;

  // Every film you've ranked, best first. Very simple filtering: search, plus the three feelings from the rank flow.
  function allRanked(st) {
    const list = myListWith(st), total = MY_TOTAL + Object.keys(st.ranked).length, f = st.rfilter, q = st.rq.trim().toLowerCase();
    const rows = list.map(([k, s], i) => [k, s, i + 1]).filter(([k, s]) => feels(f, s) && (!q || F[k][0].toLowerCase().includes(q)));
    return `${topbar('', { back: true })}
      <div class="s-narrow">
        <div class="s-head"><h1 class="s-title">Your rankings</h1><p class="s-sub">${total} films, best first</p></div>
        <div class="s-sticky"><label class="k-search">${ic('magnifying-glass')}<input type="search" placeholder="Search your rankings" aria-label="Search your rankings" data-input="rsearch" value="${st.rq}"></label>
          <div class="chips r-feel">${FEEL.map(([id, l]) => `<button class="k-chip" aria-pressed="${f === id}" data-act="rfilter" data-f="${id}">${l}</button>`).join('')}</div></div>
        <div class="r-all">${rows.length ? rows.map(([k, s, n]) => rankRow(k, s, n)).join('') : `<p class="sub r-all__none">Nothing ${q ? `called "${st.rq.trim()}"` : 'here'} yet.</p>`}
          ${f === 'all' && !q ? `<div class="r-all__more"><span class="sub">Showing ${rows.length} of ${total}</span><button class="k-btn k-btn--secondary k-btn--sm">Show more</button></div>` : ''}</div>
      </div>`;
  }

  // Edit profile: the basics, your colour, and what your profile shows. Hidden details stay visible to you, marked "only you".
  function editProfile(st) {
    const sw = (id, icon, label, value) => `<div class="e-row">${ic(icon)}<span class="e-row__body"><b>${label}</b><span class="sub">${st.prefs[id] ? value : value + ' · only you'}</span></span>
      <button class="k-switch" role="switch" aria-checked="${st.prefs[id]}" aria-label="Show ${label.toLowerCase()} on your profile" data-act="toggle" data-t="${id}" data-v="${value}"><span></span></button></div>`;
    const save = `<button class="k-btn k-btn--primary k-btn--sm" data-act="back">Save</button>`;
    return `${topbar('Edit profile', { back: true, end: save })}
      <div class="s-narrow e-form">
        <div class="wide-only"><div class="e-head"><h1 class="s-title">Edit profile</h1><span class="e-head__end"><button class="k-btn k-btn--ghost k-btn--sm" data-act="back">Cancel</button>${save}</span></div></div>
        <div class="e-photo">${avatar('you', 'xl')}<button class="k-btn k-btn--ghost k-btn--sm">${ic('pencil-simple')}Change photo</button></div>
        <label class="k-field"><span class="k-field__label">Name</span><span class="k-field__control"><input value="Dani Cho" autocomplete="off"></span></label>

        <label class="k-field"><span class="k-field__label">Bio</span><span class="k-field__control"><textarea maxlength="120" rows="2">Ranking everything Denis Villeneuve ever made. Ask me about Arrival.</textarea></span><span class="k-field__help"><span>Shows under your name</span><span>68/120</span></span></label>
        <div class="e-group"><span class="m-label">Your colour</span>
          <button class="e-row e-row--go" data-act="setsheet" data-s="colour"><span class="k-dot k-dot--lg id-${P.you.h}"></span><span class="e-row__body"><b>${cap(P.you.h)}</b><span class="sub">Friends see your dot in this colour everywhere</span></span>${ic('caret-right')}</button></div>
        <div class="e-group e-prefs"><span class="m-label">On your profile</span>
          ${sw('loc', 'map-pin', 'Location', 'Toronto')}${sw('habit', 'clock', 'When you usually watch', 'Fridays')}
          <div class="e-row">${ic('calendar-blank')}<span class="e-row__body"><b>Joined</b><span class="sub">January 2024 · always shown</span></span></div></div>
      </div>`;
  }

  // Notifications (pushed from the bell on iPhone; "See all" from the web panel). The gear opens the settings.
  function notifications(st) {
    const gear = iconbtn('gear-six', 'Notification settings', 'data-go="#/notifications/settings"');
    return `${topbar('', { back: true, end: gear })}
      <div class="s-narrow n-page"><div><div class="wide-only">${webBack}</div><div class="n-head"><h1 class="s-title">Notifications</h1><span class="wide-only">${gear}</span></div></div>${st.blank === 'bell' ? emptyBell() : noteList(st)}</div>`;
  }
  function notifSettings(st) {
    return `${topbar('Notification settings', { back: true })}
      <div class="s-narrow e-form"><div class="wide-only">${webBack}<h1 class="s-title">Notification settings</h1></div>
        <div class="e-group"><span class="m-label">Tell me about</span>${NSET.map(x => nswitch(st, x)).join('')}</div></div>`;
  }


  /* ---------- the extra info, round 1 (2026-10-10): your menu, My films, stats, settings, invites, signing in ---------- */
  // Your menu (picked A): you at the bottom of the rail opens it on the web, like the original; the gear on your profile on iPhone
  const YOU_MENU = [['user', 'Profile', '#/me', ''], ['chart-bar', 'Your stats', '#/me/stats', 'How you rank, what you love, who you match'],
    ['ticket', 'Invites', '#/invites', 'Bring a friend in, see who joined'], ['gear-six', 'Settings', '#/settings', 'Your account, appearance and privacy']];
  const youPop = st => `<div class="y-pop${st.ymenu === 'fresh' ? ' is-fresh' : ''}" role="menu" aria-label="Your menu">
      ${YOU_MENU.map(([i, l, h]) => `<button class="y-pop__row" role="menuitem" data-go="${h}">${ic(i)}<span>${l}</span></button>`).join('')}
      <span class="y-pop__sep" role="separator"></span><button class="y-pop__row y-pop__out" role="menuitem" data-act="signout">${ic('sign-out')}<span>Sign out</span></button></div>`;
  function youSheet(st) {
    const f = st.ysheet.fresh;
    return `<div class="app__overlay${f ? '' : ' app__overlay--still'}" data-act="yoverlay"><div class="app__sheet app__sheet--fit gs${f ? '' : ' app__sheet--still'}" role="dialog" aria-label="Your menu">
      <div class="gs-head">${avatar('you', 'lg')}<div class="gs-head__text"><b>Dani Cho</b><span class="sub">@dani.watches</span></div></div>
      <div class="gs-list">${YOU_MENU.slice(1).map(([i, l, h, sub]) => `<button class="gs-row y-row" data-go="${h}">${ic(i)}<span class="y-row__text"><b>${l}</b><span class="sub">${sub}</span></span>${ic('caret-right')}</button>`).join('')}</div>
      <button class="k-btn k-btn--ghost k-btn--block" data-act="signout">${ic('sign-out')}Sign out</button></div></div>`;
  }

  // My films (picked A, with your change): your top 3 on the podium with the big quiet numbers, then everything else by feeling,
  // the feelings as captions. No numbers on the cards: the order is the ranking. Watchlist is the second tab.
  const watchlist = st => WATCH.filter(k => st.saved[k] !== false).concat(Object.keys(st.saved).filter(k => st.saved[k] && !WATCH.includes(k)));
  // Long grids load as you go: past the first screenful, a poster's image loads only as it comes near (Noah, interactions round 1: "smartload")
  const filmTile = (k, meta, i = 0) => `<button class="mf-tile" data-go="#/film/${k}" aria-label="${F[k][0]}">${i >= 12 ? poster(k, 'm').replace('<img ', '<img loading="lazy" ') : poster(k, 'm')}<span class="mf-tile__t">${F[k][0]}</span><span class="mf-tile__m">${meta}</span></button>`;
  const feelCount = (st, id) => FEEL_N[id] + Object.values(st.ranked).filter(s => feels(id, s)).length;
  function filmsBody(st, podium) {
    const list = myListWith(st), total = MY_TOTAL + Object.keys(st.ranked).length, tab = st.mtab || 'ranked', watch = watchlist(st);
    const feel = ([id, label]) => { const films = list.slice(3).filter(([, s2]) => feels(id, s2)); return films.length ? `<section class="mf-feel">
        <p class="mf-cap">${label}<span>${feelCount(st, id)}</span></p><div class="mf-grid">${films.map(([k, s2], i) => filmTile(k, `${score('you', s2)}<span>${F[k][1]}</span>`, i)).join('')}</div></section>` : ''; };
    return `<div class="m-seg mf-tabs" role="tablist">${[['ranked', 'Rankings'], ['diary', 'Diary'], ['watch', 'Watchlist'], ['lists', 'Lists']].map(([id, l]) => `<button role="tab" aria-selected="${tab === id}" data-act="mtab" data-t="${id}">${l}</button>`).join('')}</div>
        ${tab === 'ranked' ? `${podium ? `<div class="mf-podium">${top3('you', { top: list.slice(0, 3).map(([k]) => k) })}</div>` : ''}${FEEL.slice(1).map(feel).join('')}
          <div class="r-all__more"><span class="sub">Showing ${list.length} of ${total}</span><button class="k-btn k-btn--secondary k-btn--sm">Show more</button></div>`
        : tab === 'diary' ? (st.blank === 'diary' ? emptyDiary() : diary(st)) : tab === 'lists' ? listsView(st)

        : watch.length ? `<div class="mf-grid">${watch.map((k, i) => filmTile(k, `<span>${F[k][1]}</span>`, i)).join('')}</div>`
