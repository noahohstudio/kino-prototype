<style>
/* Kino v3 tokens
   Names mirror the Figma variables (collections "Kino v3 / Primitives | Color | Size").
   Figma variable  color/bg/canvas  →  CSS  --kino-bg-canvas
   Dark is the default. Light applies with [data-theme="light"] on <html>. */

:root {
  /* ---------- primitives ---------- */
  --kino-neutral-1000: #1B1916;
  --kino-neutral-950: #121110;
  --kino-neutral-900: #1B1A17;
  --kino-neutral-850: #24221F;
  --kino-neutral-800: #302E2A;
  --kino-neutral-700: #45423C;
  --kino-neutral-500: #A19B92;
  --kino-neutral-400: #655D51;
  --kino-neutral-300: #D3C8B6;
  --kino-linen-300: #E1D6C4;
  --kino-linen-200: #EDE5D7;
  --kino-linen-100: #F4EEE3;
  --kino-linen-50: #FBF8F2;
  --kino-cream-50: #F3EEE6;
  --kino-white: #FFFFFF;

  --kino-tomato-300: #FF6A3D;
  --kino-tomato-600: #CF421D;
  --kino-tomato-650: #B8371A;
  --kino-tomato-700: #B53816;
  --kino-crimson-300: #FF5C7A;
  --kino-crimson-600: #C21F45;
  --kino-green-300: #6ED39A;
  --kino-green-600: #1A7346;
  --kino-blue-300: #8EBAFF;
  --kino-blue-600: #2F5FD0;

  --kino-identity-rose-dark: #FF93CB;        --kino-identity-rose-light: #A44B79;
  --kino-identity-amber-dark: #F5AE39;       --kino-identity-amber-light: #9A6100;
  --kino-identity-citron-dark: #D5BF36;      --kino-identity-citron-light: #816F00;
  --kino-identity-fern-dark: #87D576;        --kino-identity-fern-light: #418032;
  --kino-identity-mint-dark: #2CDCAF;        --kino-identity-mint-light: #008663;
  --kino-identity-lagoon-dark: #00DAE4;      --kino-identity-lagoon-light: #00818A;
  --kino-identity-sky-dark: #41CCFF;         --kino-identity-sky-light: #0078AF;
  --kino-identity-periwinkle-dark: #8EBAFF;  --kino-identity-periwinkle-light: #496BBA;
  --kino-identity-lilac-dark: #C5A9FF;       --kino-identity-lilac-light: #755DB1;
  --kino-identity-orchid-dark: #E89CF9;      --kino-identity-orchid-light: #8F539D;

  /* ---------- size ---------- */
  --kino-space-0: 0px;  --kino-space-2: 2px;  --kino-space-4: 4px;  --kino-space-6: 6px;
  --kino-space-8: 8px;  --kino-space-12: 12px; --kino-space-16: 16px; --kino-space-20: 20px;
  --kino-space-24: 24px; --kino-space-32: 32px; --kino-space-40: 40px; --kino-space-48: 48px; --kino-space-64: 64px;

  --kino-radius-poster: 4px;   /* every poster size; never scales up */
  --kino-radius-input: 8px;    /* text fields, composers */
  --kino-radius-card: 12px;    /* cards, lists */
  --kino-radius-sheet: 20px;   /* sheets, modals */
  --kino-radius-pill: 999px;   /* buttons, chips, search, tabs */

  --kino-size-icon-sm: 16px;
  --kino-size-icon-md: 20px;
  --kino-size-icon-lg: 24px;
  --kino-size-control-sm: 36px;
  --kino-size-control-lg: 48px;

  /* ---------- type ---------- */
  --kino-font-display: "Bricolage Grotesque", "Geist", system-ui, sans-serif;
  --kino-font-ui: "Geist", system-ui, -apple-system, sans-serif;

  --kino-motion-fast: 120ms;
  --kino-motion-base: 200ms;
  --kino-ease: cubic-bezier(.2, .7, .2, 1);
}

/* ---------- semantic: Dark (default) ---------- */
:root,
[data-theme="dark"] {
  color-scheme: dark;
  --kino-bg-canvas: var(--kino-neutral-950);
  --kino-bg-surface: var(--kino-neutral-900);
  --kino-bg-fill: var(--kino-neutral-850);
  --kino-bg-inverse: var(--kino-cream-50);
  --kino-bg-accent: var(--kino-tomato-600);
  --kino-bg-accent-pressed: var(--kino-tomato-700);
  --kino-bg-disabled: var(--kino-neutral-850);

  --kino-text-primary: var(--kino-cream-50);
  --kino-text-secondary: var(--kino-neutral-500);
  --kino-text-disabled: var(--kino-neutral-700);
  --kino-text-on-inverse: var(--kino-neutral-950);
  --kino-text-on-accent: var(--kino-white);
  --kino-text-on-identity: var(--kino-neutral-950);
  --kino-text-accent: var(--kino-tomato-300);
  --kino-text-danger: var(--kino-crimson-300);
  --kino-text-success: var(--kino-green-300);

  --kino-icon-primary: var(--kino-cream-50);
  --kino-icon-secondary: var(--kino-neutral-500);
  --kino-icon-on-inverse: var(--kino-neutral-950);
  --kino-icon-on-accent: var(--kino-white);

  --kino-border-subtle: var(--kino-neutral-800);
  --kino-border-strong: var(--kino-neutral-700);
  --kino-border-focus: var(--kino-neutral-500); /* focus is a calm grey, never a blue glow (2026-10-08) */
  --kino-border-danger: var(--kino-crimson-300);

  --kino-signal-you: var(--kino-tomato-300);
  --kino-signal-unread: var(--kino-cream-50); /* unread is cream, never Tomato: Tomato means you */

  --kino-effect-shadow-key: rgb(5 4 3 / .45);
  --kino-effect-shadow-ambient: rgb(5 4 3 / .60);
  --kino-effect-highlight: rgb(255 255 255 / .045);

  --kino-identity-rose: var(--kino-identity-rose-dark);
  --kino-identity-amber: var(--kino-identity-amber-dark);
  --kino-identity-citron: var(--kino-identity-citron-dark);
  --kino-identity-fern: var(--kino-identity-fern-dark);
  --kino-identity-mint: var(--kino-identity-mint-dark);
  --kino-identity-lagoon: var(--kino-identity-lagoon-dark);
  --kino-identity-sky: var(--kino-identity-sky-dark);
  --kino-identity-periwinkle: var(--kino-identity-periwinkle-dark);
  --kino-identity-lilac: var(--kino-identity-lilac-dark);
  --kino-identity-orchid: var(--kino-identity-orchid-dark);
}

/* ---------- semantic: Light ---------- */
[data-theme="light"] {
  color-scheme: light;
  --kino-bg-canvas: var(--kino-linen-100);
  --kino-bg-surface: var(--kino-linen-50);
  --kino-bg-fill: var(--kino-linen-200);
  --kino-bg-inverse: var(--kino-neutral-1000);
  --kino-bg-accent: var(--kino-tomato-600);
  --kino-bg-accent-pressed: var(--kino-tomato-700);
  --kino-bg-disabled: var(--kino-linen-200);

  --kino-text-primary: var(--kino-neutral-1000);
  --kino-text-secondary: var(--kino-neutral-400);
  --kino-text-disabled: var(--kino-neutral-300);
  --kino-text-on-inverse: var(--kino-linen-50);
  --kino-text-on-accent: var(--kino-white);
  --kino-text-on-identity: var(--kino-white);
  --kino-text-accent: var(--kino-tomato-650);
  --kino-text-danger: var(--kino-crimson-600);
  --kino-text-success: var(--kino-green-600);

  --kino-icon-primary: var(--kino-neutral-1000);
  --kino-icon-secondary: var(--kino-neutral-400);
  --kino-icon-on-inverse: var(--kino-linen-50);
  --kino-icon-on-accent: var(--kino-white);

  --kino-border-subtle: var(--kino-linen-300);
  --kino-border-strong: var(--kino-neutral-300);
  --kino-border-focus: var(--kino-neutral-400);
  --kino-border-danger: var(--kino-crimson-600);

  --kino-signal-you: var(--kino-tomato-650);
  --kino-signal-unread: var(--kino-neutral-1000);

  --kino-effect-shadow-key: rgb(42 30 15 / .06);
  --kino-effect-shadow-ambient: rgb(42 30 15 / .09);
  --kino-effect-highlight: rgb(255 255 255 / .7);

  --kino-identity-rose: var(--kino-identity-rose-light);
  --kino-identity-amber: var(--kino-identity-amber-light);
  --kino-identity-citron: var(--kino-identity-citron-light);
  --kino-identity-fern: var(--kino-identity-fern-light);
  --kino-identity-mint: var(--kino-identity-mint-light);
  --kino-identity-lagoon: var(--kino-identity-lagoon-light);
  --kino-identity-sky: var(--kino-identity-sky-light);
  --kino-identity-periwinkle: var(--kino-identity-periwinkle-light);
  --kino-identity-lilac: var(--kino-identity-lilac-light);
  --kino-identity-orchid: var(--kino-identity-orchid-light);
}

/* ---------- elevation (Figma: Kino v3/Elevation/1|2) ---------- */
/* declared on every themed element so nested themes recompute their shadow colours */
:root, [data-theme] {
  --kino-elevation-1: inset 0 1px 0 var(--kino-effect-highlight), 0 1px 2px var(--kino-effect-shadow-key), 0 8px 24px var(--kino-effect-shadow-ambient);
  --kino-elevation-2: inset 0 1px 0 var(--kino-effect-highlight), 0 2px 6px var(--kino-effect-shadow-key), 0 16px 40px var(--kino-effect-shadow-ambient);
}

/* ---------- identity helpers: set --kino-id on any element ---------- */
.id-rose { --kino-id: var(--kino-identity-rose); }
.id-amber { --kino-id: var(--kino-identity-amber); }
.id-citron { --kino-id: var(--kino-identity-citron); }
.id-fern { --kino-id: var(--kino-identity-fern); }
.id-mint { --kino-id: var(--kino-identity-mint); }
.id-lagoon { --kino-id: var(--kino-identity-lagoon); }
.id-sky { --kino-id: var(--kino-identity-sky); }
.id-periwinkle { --kino-id: var(--kino-identity-periwinkle); }
.id-lilac { --kino-id: var(--kino-identity-lilac); }
.id-orchid { --kino-id: var(--kino-identity-orchid); }
.id-you { --kino-id: var(--kino-signal-you); }

/* ---------- text styles (Figma: Kino v3/…) — sentence case, never mono ---------- */
.kino-display-hero { font: 800 48px/48px var(--kino-font-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.kino-display-xl   { font: 800 34px/40px var(--kino-font-display); letter-spacing: -.02em; }
.kino-display-l    { font: 700 28px/34px var(--kino-font-display); letter-spacing: -.015em; }
.kino-display-m    { font: 700 22px/28px var(--kino-font-display); letter-spacing: -.01em; }
.kino-title-l      { font: 600 17px/22px var(--kino-font-ui); letter-spacing: -.005em; }
.kino-title-m      { font: 600 15px/20px var(--kino-font-ui); letter-spacing: -.0025em; }
.kino-body-l       { font: 400 17px/24px var(--kino-font-ui); }
.kino-body-m       { font: 400 15px/22px var(--kino-font-ui); }
.kino-body-s       { font: 400 13px/18px var(--kino-font-ui); }
.kino-label-l      { font: 600 15px/20px var(--kino-font-ui); }
.kino-label-m      { font: 500 13px/16px var(--kino-font-ui); }
.kino-label-s      { font: 500 11px/14px var(--kino-font-ui); letter-spacing: .002em; }
.kino-score-list   { font: 600 17px/20px var(--kino-font-ui); letter-spacing: -.005em; font-variant-numeric: tabular-nums; }
</style>
<style>
/* Kino v3 atoms. Every value comes from tokens.css. */

/* ---------- Icon ---------- */
.k-icon { width: var(--k-icon-size, var(--kino-size-icon-lg)); height: var(--k-icon-size, var(--kino-size-icon-lg)); flex: none; fill: currentColor; color: inherit; }
.k-icon--sm { --k-icon-size: var(--kino-size-icon-sm); }
.k-icon--md { --k-icon-size: var(--kino-size-icon-md); }

/* ---------- Dot ---------- */
.k-dot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: var(--kino-radius-pill); background: var(--kino-id, var(--kino-signal-you)); }
.k-dot--lg { width: 12px; height: 12px; }
.k-dot--empty { background: transparent; border: 1.5px solid var(--kino-border-strong); box-sizing: border-box; } /* a border, not an inset shadow: survives Figma captures */

/* ---------- Avatar ---------- */
.k-avatar { --k-av: 40px; position: relative; flex: none; width: var(--k-av); height: var(--k-av); border-radius: var(--kino-radius-pill);
  display: inline-grid; place-items: center; background: var(--kino-id, var(--kino-identity-periwinkle)); color: var(--kino-text-on-identity);
  font: 600 15px/1 var(--kino-font-ui); letter-spacing: -.01em; user-select: none; }
.k-avatar--sm { --k-av: 24px; font: 500 10px/1 var(--kino-font-ui); }
.k-avatar--lg { --k-av: 72px; font: 700 24px/1 var(--kino-font-display); letter-spacing: -.02em; }
.k-avatar--xl { --k-av: 144px; font: 800 52px/1 var(--kino-font-display); letter-spacing: -.03em; }
.k-avatar--hero { --k-av: 200px; font: 800 72px/1 var(--kino-font-display); letter-spacing: -.035em; }
.k-avatar--xxl { --k-av: 176px; font: 800 64px/1 var(--kino-font-display); letter-spacing: -.035em; }
.k-avatar--more { --kino-id: var(--kino-bg-fill); color: var(--kino-text-secondary); font-weight: 600; letter-spacing: -.02em; }
.k-avatar__photo { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; background: var(--kino-bg-fill); display: grid; place-items: center; color: var(--kino-icon-secondary); }
.k-avatar__photo img { width: 100%; height: 100%; object-fit: cover; }
.k-avatar__photo .k-icon { --k-icon-size: 50%; }
.k-avatar__photo::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 2px var(--kino-id, var(--kino-identity-periwinkle)); }
.k-avatar--sm .k-avatar__photo::after { box-shadow: inset 0 0 0 1.5px var(--kino-id, var(--kino-identity-periwinkle)); }
/* The camera dot sits OUTSIDE the avatar, top right, like the wordmark's dot beside the "o". It never overlaps. */
.k-avatar { --k-you: max(7px, calc(var(--k-av) * .15)); --k-you-gap: max(2px, calc(var(--k-av) * .04)); }
/* Your dot sits just off the avatar's top right, at 45°, like the wordmark's dot beside the "o". Never on the avatar. */
.k-avatar__you { position: absolute; left: calc(85.36% + var(--k-you-gap)); top: calc(14.64% - var(--k-you-gap)); transform: translateY(-100%); width: var(--k-you); height: var(--k-you); border-radius: var(--kino-radius-pill); background: var(--kino-signal-you); }
.k-avatar:has(> .k-avatar__you) { margin-right: calc(var(--k-you) + var(--k-you-gap)); }

.k-avatar-stack { display: inline-flex; }
.k-avatar-stack > .k-avatar { box-shadow: 0 0 0 2px var(--k-stack-bg, var(--kino-bg-surface)); }
.k-avatar-stack > .k-avatar + .k-avatar { margin-left: calc(var(--k-av) * -.28); }

/* ---------- Button ---------- */
.k-btn { --k-icon-size: var(--kino-size-icon-md); display: inline-flex; align-items: center; justify-content: center; gap: var(--kino-space-8);
  height: var(--kino-size-control-lg); padding: 0 var(--kino-space-20); border-radius: var(--kino-radius-pill); border: 1.5px solid transparent;
  font: 600 15px/20px var(--kino-font-ui); white-space: nowrap; cursor: pointer; text-decoration: none; -webkit-tap-highlight-color: transparent;
  transition: background-color var(--kino-motion-fast) var(--kino-ease), border-color var(--kino-motion-fast) var(--kino-ease), transform var(--kino-motion-fast) var(--kino-ease), color var(--kino-motion-fast); }
.k-btn:active:not(:disabled) { transform: scale(.97); }
.k-btn:focus-visible, .k-iconbtn:focus-visible, .k-chip:focus-visible, .k-tab:focus-visible { outline: 2px solid var(--kino-border-focus); outline-offset: 2px; }
.k-btn--sm { --k-icon-size: var(--kino-size-icon-sm); height: var(--kino-size-control-sm); padding: 0 var(--kino-space-16); gap: var(--kino-space-6); font: 500 13px/16px var(--kino-font-ui); }
.k-btn--block { width: 100%; }

.k-btn--primary, .k-iconbtn--primary { background: var(--kino-bg-inverse); color: var(--kino-text-on-inverse); }
.k-btn--primary:hover:not(:disabled), .k-iconbtn--primary:hover:not(:disabled) { background: color-mix(in srgb, var(--kino-bg-inverse) 90%, var(--kino-bg-canvas)); }
.k-btn--primary:active:not(:disabled), .k-iconbtn--primary:active:not(:disabled), .k-btn--primary.is-pressed { background: color-mix(in srgb, var(--kino-bg-inverse) 84%, var(--kino-bg-canvas)); }

.k-btn--secondary, .k-iconbtn--secondary { background: transparent; border-color: var(--kino-border-strong); color: var(--kino-text-primary); }
.k-btn--secondary:hover:not(:disabled), .k-iconbtn--secondary:hover:not(:disabled) { background: var(--kino-bg-fill); }
.k-btn--secondary:active:not(:disabled), .k-btn--secondary.is-pressed { background: var(--kino-bg-fill); border-color: var(--kino-text-secondary); }

.k-btn--accent { background: var(--kino-bg-accent); color: var(--kino-text-on-accent); }
.k-btn--accent:hover:not(:disabled) { background: color-mix(in srgb, var(--kino-bg-accent) 88%, var(--kino-bg-accent-pressed)); }
.k-btn--accent:active:not(:disabled), .k-btn--accent.is-pressed { background: var(--kino-bg-accent-pressed); }

.k-btn--ghost, .k-iconbtn--ghost { background: transparent; color: var(--kino-text-primary); }
/* Danger: only the last step of something hard to take back (leave, delete) */
.k-btn--danger { background: var(--kino-text-danger); color: var(--kino-bg-canvas); }
.k-btn--danger:hover:not(:disabled) { background: color-mix(in srgb, var(--kino-text-danger) 88%, var(--kino-bg-canvas)); }
.k-btn--ghost:hover:not(:disabled), .k-iconbtn--ghost:hover:not(:disabled), .k-btn--ghost.is-pressed { background: var(--kino-bg-fill); }

.k-btn:disabled, .k-iconbtn:disabled { background: var(--kino-bg-disabled); color: var(--kino-text-disabled); border-color: transparent; cursor: not-allowed; }
.k-btn--secondary:disabled, .k-iconbtn--secondary:disabled { background: transparent; border-color: var(--kino-border-subtle); }
.k-btn--ghost:disabled, .k-iconbtn--ghost:disabled { background: transparent; }

/* ---------- Icon button ---------- */
.k-iconbtn { --k-icon-size: var(--kino-size-icon-md); display: inline-grid; place-items: center; flex: none; width: var(--kino-size-control-lg); height: var(--kino-size-control-lg);
  border-radius: var(--kino-radius-pill); border: 1.5px solid transparent; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background-color var(--kino-motion-fast) var(--kino-ease), transform var(--kino-motion-fast) var(--kino-ease); }
.k-iconbtn:active:not(:disabled) { transform: scale(.94); }
.k-iconbtn--sm { --k-icon-size: var(--kino-size-icon-sm); width: var(--kino-size-control-sm); height: var(--kino-size-control-sm); }

/* ---------- Chip ---------- */
.k-chip { --k-icon-size: var(--kino-size-icon-sm); display: inline-flex; align-items: center; gap: var(--kino-space-6); height: 32px; padding: 0 var(--kino-space-12);
  border-radius: var(--kino-radius-pill); border: 1px solid var(--kino-border-subtle); background: var(--kino-bg-surface); color: var(--kino-text-primary);
  font: 500 13px/16px var(--kino-font-ui); white-space: nowrap; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background-color var(--kino-motion-fast) var(--kino-ease), border-color var(--kino-motion-fast) var(--kino-ease), color var(--kino-motion-fast); }
.k-chip:hover { border-color: var(--kino-border-strong); }
.k-chip[aria-pressed="true"], .k-chip.is-selected { background: var(--kino-bg-inverse); border-color: var(--kino-bg-inverse); color: var(--kino-text-on-inverse); }
.k-chip .k-icon { color: var(--kino-icon-secondary); }
.k-chip[aria-pressed="true"] .k-icon, .k-chip.is-selected .k-icon { color: var(--kino-icon-on-inverse); }
.k-chip__remove { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-right: -4px; border-radius: var(--kino-radius-pill); color: inherit; opacity: .7; }
.k-chip__remove:hover { opacity: 1; }
.k-chip:disabled { color: var(--kino-text-disabled); border-color: var(--kino-border-subtle); background: transparent; cursor: not-allowed; }

/* ===== Motion, first pass (2026-10-08): every action answers with movement ===== */
/* Screens: forward pushes in from the right, back slides in from the left, tabs fade */
.app__page--fwd { animation: k-push .32s var(--kino-ease); }

@keyframes k-pop { from { opacity: 0; transform: translateX(-28px); } }

.app__overlay--still, .app__sheet--still { animation: none; }
@keyframes k-fade { from { opacity: 0; } }

@keyframes r-slot { from { opacity: 0; transform: translateY(-12px); } }

/* ===== On a real phone (2026-10-08): the published prototype ===== */

/* ===== V.2 crit, part two (2026-10-08): a feed that doesn't end, and the bell ===== */

.n-pop { position: absolute; top: calc(100% - 6px); right: var(--kino-space-24); z-index: 8; width: 400px; max-height: 540px; display: flex; flex-direction: column;
  background: var(--kino-bg-surface); border: 1px solid var(--kino-border-subtle); border-radius: var(--kino-radius-card); box-shadow: var(--kino-elevation-2); overflow: hidden; }
.n-pop.is-fresh { animation: n-drop .22s var(--kino-ease); transform-origin: calc(100% - 64px) 0; }

.gs-row.y-row { flex-direction: row; align-items: center; gap: var(--kino-space-12); --k-icon-size: 20px; }
.y-row > .k-icon { flex: none; color: var(--kino-icon-secondary); }
.y-row > .k-icon:last-child { --k-icon-size: 16px; }
.y-row__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

/* My films: your top 3 on the podium, then every film by feeling. The feelings are captions; the cards carry no numbers */
.mf { display: flex; flex-direction: column; gap: var(--kino-space-24); width: 100%; max-width: 1120px; margin: 0 auto; }
.mf-tabs { align-self: flex-start; }
.mf-tabs button { padding: 0 var(--kino-space-20); }
.mf-podium { padding: var(--kino-space-8) 0 var(--kino-space-8); }
.mf-podium .o-top3 { max-width: 440px; }
.mf-feel { display: flex; flex-direction: column; gap: var(--kino-space-12); }
.mf-cap { margin: 0; display: flex; align-items: baseline; gap: var(--kino-space-8); font: 600 15px/20px var(--kino-font-ui); color: var(--kino-text-primary); }
.mf-cap span { font-weight: 400; color: var(--kino-text-secondary); font-variant-numeric: tabular-nums; }
.mf-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--kino-space-20) var(--kino-space-12); }
.mf-tile { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
.mf-tile .k-poster { --k-pw: 100%; margin-bottom: 4px; transition: transform var(--kino-motion-fast); }
.mf-tile:hover .k-poster { transform: translateY(-2px); }
.mf-tile:focus-visible { outline: none; } .mf-tile:focus-visible .k-poster { outline: 2px solid var(--kino-border-focus); outline-offset: 2px; }
.mf-tile__t { font: 600 13px/18px var(--kino-font-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mf-tile__m { display: flex; align-items: center; gap: var(--kino-space-8); font: 400 13px/18px var(--kino-font-ui); color: var(--kino-text-secondary); }
.mf-none { padding: var(--kino-space-32) 0; text-align: center; }
.mf .r-all__more { padding-top: var(--kino-space-8); }
@container app (min-width: 560px) { .mf-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@container app (min-width: 900px) { .mf-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--kino-space-24) var(--kino-space-16); } .mf-tile__t { font-size: 15px; line-height: 20px; } }
@container app (min-width: 1200px) { .mf-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }

/* Your stats: cards, one idea each. Bars and the split use greys (scores are never coloured by quality) */
.st { display: flex; flex-direction: column; gap: var(--kino-space-20); width: 100%; max-width: 1040px; margin: 0 auto; }
.st-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--kino-space-12); }
.st-card { gap: var(--kino-space-16); }
.st-card__head { display: flex; flex-direction: column; gap: 2px; }
.st-card__head h3 { margin: 0; font: 600 17px/22px var(--kino-font-ui); }
.st-bars { display: flex; align-items: stretch; gap: 6px; height: 128px; }
.st-bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; min-width: 0; }
.st-bar i { width: 100%; min-height: 4px; border-radius: 4px 4px 2px 2px; background: var(--kino-bg-fill); }
.st-bar span { font: 400 11px/14px var(--kino-font-ui); color: var(--kino-text-secondary); }
.st-bar.is-now i { background: var(--kino-text-primary); }
.st-bar.is-now span { color: var(--kino-text-primary); font-weight: 600; }
.st-split { display: flex; gap: 3px; height: 12px; border-radius: var(--kino-radius-pill); overflow: hidden; }
.st-split i, .st-key i { display: block; }
.st-split__loved { background: var(--kino-text-primary); } .st-split__fine { background: var(--kino-text-secondary); } .st-split__no { background: var(--kino-bg-fill); }
.st-key { display: flex; flex-wrap: wrap; gap: var(--kino-space-8) var(--kino-space-16); font: 400 13px/18px var(--kino-font-ui); color: var(--kino-text-secondary); }
.st-key span { display: inline-flex; align-items: center; gap: 6px; } .st-key i { width: 8px; height: 8px; border-radius: 50%; } .st-key b { color: var(--kino-text-primary); font-weight: 600; }
.st-key .st-split__no { background: transparent; border: 1.5px solid var(--kino-border-strong); box-sizing: border-box; }
.st-card .chips + .chips { margin-top: calc(var(--kino-space-8) * -1); }
.st-row { display: flex; align-items: center; gap: var(--kino-space-12); min-height: 44px; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; }
button.st-row { cursor: pointer; } button.st-row:hover .st-row__name { text-decoration: underline; text-underline-offset: 3px; }
.st-row + .st-row { border-top: 1px solid var(--kino-border-subtle); }
.st-row__name { flex: 1; min-width: 0; font: 500 15px/20px var(--kino-font-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-row__pct { font: 600 15px/20px var(--kino-font-ui); font-variant-numeric: tabular-nums; }
.st-pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--kino-space-16); }
.st-pair > div { display: flex; flex-direction: column; gap: 4px; }
.st-big { font: 800 40px/1 var(--kino-font-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.st-big small { font: 500 15px/20px var(--kino-font-ui); color: var(--kino-text-secondary); letter-spacing: 0; margin-left: 6px; }
.st-more { text-align: center; }
@container app (min-width: 900px) { .st-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--kino-space-16); } .st-card--wide { grid-column: 1 / -1; } }

/* Settings: rows you can open carry a caret; Sign out and Delete account sit apart at the end */
.e-row--go { width: 100%; border: 0; background: none; font: inherit; text-align: left; cursor: pointer; }
.e-row--go > .k-icon:last-child { --k-icon-size: 16px; color: var(--kino-text-secondary); }
.e-row--go:hover .e-row__body b { text-decoration: underline; text-underline-offset: 3px; }
.e-row--go:focus-visible { outline: 2px solid var(--kino-border-focus); outline-offset: 2px; border-radius: 8px; }
.e-row--danger > .k-icon, .e-row--danger .e-row__body b { color: var(--kino-text-danger); }
.set-me { display: flex; align-items: center; gap: var(--kino-space-16); padding: var(--kino-space-16); border: 0; border-radius: var(--kino-radius-card); background: var(--kino-bg-surface);
  box-shadow: var(--kino-elevation-1); color: inherit; font: inherit; text-align: left; cursor: pointer; }
.set-me > .k-icon { --k-icon-size: 16px; color: var(--kino-text-secondary); }
.set-me .e-row__body b { font: 600 17px/22px var(--kino-font-ui); }
.set-seg { flex: none; }
.set-seg button { height: 30px; padding: 0 var(--kino-space-12); font-size: 13px; }
.set-seg [aria-checked="true"] { background: var(--kino-bg-surface); color: var(--kino-text-primary); box-shadow: inset 0 0 0 1px var(--kino-border-subtle); }
.set-hues { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--kino-space-8); justify-items: center; padding: var(--kino-space-4) 0; }
.set-hue { width: 48px; height: 48px; display: grid; place-items: center; border: 0; border-radius: 50%; background: none; cursor: pointer; }
.set-hue .k-dot { width: 32px; height: 32px; }
.set-hue[aria-checked="true"] { box-shadow: inset 0 0 0 2px var(--kino-text-primary); }
.set-hue:focus-visible { outline: 2px solid var(--kino-border-focus); outline-offset: 1px; }
.set-preview { display: flex; flex-direction: column; gap: var(--kino-space-8); padding: var(--kino-space-12) var(--kino-space-16); border-radius: var(--kino-radius-card); background: var(--kino-bg-surface); }
.set-preview__row { display: flex; align-items: center; gap: var(--kino-space-12); }
.gs-row.set-opt { flex-direction: row; align-items: center; justify-content: space-between; gap: var(--kino-space-12); }
.set-opt > span { display: flex; flex-direction: column; gap: 2px; }
.set-opt > .k-icon { --k-icon-size: 20px; visibility: hidden; } .set-opt[aria-checked="true"] > .k-icon { visibility: visible; }
.set-mark { width: 56px; height: 56px; display: grid; place-items: center; margin-bottom: var(--kino-space-4); border-radius: 50%; background: var(--kino-bg-fill); --k-icon-size: 26px; color: var(--kino-text-primary); }

/* Invites */
.inv-card { align-items: flex-start; gap: var(--kino-space-12); padding: var(--kino-space-20); }
.inv-card .kino-display-m { margin: var(--kino-space-4) 0 0; }
.inv-card .k-btn--block { align-self: stretch; }
.inv-link { align-self: stretch; display: flex; align-items: center; justify-content: space-between; gap: var(--kino-space-12); height: 48px; margin-top: var(--kino-space-4);
  padding: 0 var(--kino-space-4) 0 var(--kino-space-16); border-radius: var(--kino-radius-input); background: var(--kino-bg-fill); font: 500 15px/20px var(--kino-font-ui); }

/* Signing in: no chrome, a friend's favourite film full-bleed (dark whatever the theme), you and the buttons low where a thumb is */
.app--bare .app__rail, .app--bare .app__bar, .app--bare .app__tabs { display: none !important; }
.app--bare .app__page { padding: 0 !important; height: 100%; }
.app--bare .app__status { position: absolute; top: 0; left: 0; right: 0; z-index: 2; background: transparent; color: var(--kino-cream-50); }
.si { position: relative; min-height: 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 var(--kino-space-24) var(--kino-space-32);
  overflow: hidden; background: #121110; color: var(--kino-cream-50); }
.app--device .si { padding-bottom: calc(var(--kino-space-32) + 20px); }
.si__bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 55% 30%; }
.si__shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(18 17 16 / .35) 0%, rgb(18 17 16 / .15) 28%, rgb(18 17 16 / .85) 60%, #121110 100%); }
.si__wm { position: absolute; left: var(--kino-space-24); top: 64px; display: inline-flex; align-items: flex-start; padding: 0; border: 0; background: none; color: var(--kino-cream-50);
  font: 800 28px/1 var(--kino-font-display); letter-spacing: -.035em; cursor: pointer; }
.si__wm i { width: 7px; height: 7px; border-radius: 50%; background: var(--kino-signal-you); margin: 1px 0 0 1px; }
.si__body { position: relative; display: flex; flex-direction: column; gap: var(--kino-space-12); width: 100%; max-width: 420px; }
.si__title { margin: var(--kino-space-4) 0 0; font: 800 40px/40px var(--kino-font-display); letter-spacing: -.035em; }
.si__sub { margin: 0 0 var(--kino-space-8); color: rgb(243 238 230 / .7); }
.si .k-btn--secondary { background: transparent; color: var(--kino-cream-50); border-color: rgb(243 238 230 / .35); }
.si__link { align-self: center; padding: var(--kino-space-6); border: 0; background: none; color: rgb(243 238 230 / .7); font: 400 15px/20px var(--kino-font-ui); cursor: pointer; }
.si__link b { color: var(--kino-cream-50); font-weight: 600; }
.si__link:hover { color: var(--kino-cream-50); }
.si__cap { position: relative; margin-top: var(--kino-space-20); font: 400 12px/16px var(--kino-font-ui); color: rgb(243 238 230 / .6); }
@container app (min-width: 900px) {
  .si { justify-content: flex-end; padding: 0 72px 72px; }
  /* The stand-in still is a trailer thumbnail with its title on the left, so the web crops in on the scene */
  .si__bg { left: 36%; width: 64%; object-position: 70% 50%; transform: scale(1.3); transform-origin: 60% 15%; }
  .si__shade { background: linear-gradient(90deg, #121110 36%, rgb(18 17 16 / .8) 44%, rgb(18 17 16 / 0) 60%), linear-gradient(0deg, rgb(18 17 16 / .6), transparent 30%); }
  .si__wm { left: 72px; top: 56px; }
  .si__title { font-size: 56px; line-height: 56px; }
  .si__cap { position: absolute; right: 40px; bottom: 36px; margin: 0; }
}

/* ===== Onboarding, round 1 (2026-10-10): the welcome's drift, where the buttons sit on the web, the join flow ===== */
.si__who, .si__acts { display: flex; flex-direction: column; gap: var(--kino-space-12); }
.si__who > .k-avatar { margin-bottom: var(--kino-space-4); }
/* What drifts over the still: friends, Kino's icons or posters, rising slowly and swaying, kept clear of the words */
.drift { position: absolute; inset: 0; overflow: hidden; pointer-events: none;
  -webkit-mask-image: linear-gradient(180deg, transparent 6%, #000 15%, #000 36%, transparent 47%); mask-image: linear-gradient(180deg, transparent 6%, #000 15%, #000 36%, transparent 47%); }
.drift__i { position: absolute; left: var(--x); top: 100%; animation: drift-up var(--dur) linear var(--delay) infinite; }
.drift__in { display: block; transform: translateX(-50%) scale(var(--sc)); animation: drift-sway 7s ease-in-out infinite alternate; }
@keyframes drift-up { to { transform: translateY(calc(-1 * var(--app-h, 874px) - 120px)); } }
@keyframes drift-sway { from { translate: calc(var(--sway) * -1) 0; } to { translate: var(--sway) 0; } }
.app--calm .drift__i { animation: none; top: var(--y); } .app--calm .drift__in { animation: none; }
@media (prefers-reduced-motion: reduce) { .drift__i { animation: none; top: var(--y); } .drift__in { animation: none; } }
.drift__dot { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--kino-id); color: var(--kino-text-on-identity);
  --k-icon-size: 22px; box-shadow: 0 2px 10px rgb(0 0 0 / .28); }
.drift__dot--plain { width: 14px; height: 14px; }
.drift--faces .k-avatar { box-shadow: 0 0 0 2px rgb(18 17 16 / .55); }
@container app (min-width: 900px) {
  .si--left .drift { left: 36%; -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%); mask-image: linear-gradient(90deg, transparent, #000 18%); }
  /* The other places for the buttons on the web (the workshop's decision 2). The stand-in still is cropped in so its baked-in title stays out */
  .si--center .si__bg, .si--card .si__bg, .si--bar .si__bg { left: 0; width: 100%; transform: scale(1.6); transform-origin: 78% 20%; }
  .si--center { justify-content: center; align-items: center; text-align: center; padding: 0 72px; }
  .si--center .si__shade { background: radial-gradient(ellipse 44% 62% at 50% 55%, rgb(18 17 16 / .9) 0%, rgb(18 17 16 / .84) 34%, rgb(18 17 16 / .5) 68%, rgb(18 17 16 / 0) 100%), linear-gradient(0deg, rgb(18 17 16 / .55), transparent 40%), rgb(18 17 16 / .38); }
  .si--center .si__body { align-items: center; max-width: 440px; }
  .si--center .si__who, .si--center .si__acts { align-items: center; width: 100%; }
  .si--center .si__wm { left: 50%; transform: translateX(-50%); }
  .si--center .si__cap { left: 72px; right: auto; }
  .si--center .drift { -webkit-mask-image: radial-gradient(ellipse 34% 52% at 50% 54%, transparent 70%, #000 100%); mask-image: radial-gradient(ellipse 34% 52% at 50% 54%, transparent 70%, #000 100%); }
  .si--card { justify-content: center; align-items: flex-end; padding: 0 72px; }
  .si--card .si__shade { background: linear-gradient(90deg, rgb(18 17 16 / .15), rgb(18 17 16 / .6)); }
  .si--card .si__body { width: 420px; max-width: none; padding: var(--kino-space-32); border-radius: 24px; background: var(--kino-bg-canvas); box-shadow: var(--kino-elevation-2); gap: var(--kino-space-20); }
  .si--card .si__title { font-size: 40px; line-height: 40px; }
  .si--card .si__cap { left: 72px; right: auto; }
  .si--card .drift { right: 40%; -webkit-mask-image: linear-gradient(90deg, #000 70%, transparent); mask-image: linear-gradient(90deg, #000 70%, transparent); }
  .si--bar .si__shade { background: linear-gradient(0deg, #121110 0%, rgb(18 17 16 / .88) 26%, rgb(18 17 16 / .1) 60%); }
  .si--bar .si__body { flex-direction: row; align-items: flex-end; justify-content: space-between; gap: var(--kino-space-48, 48px); max-width: none; }
  .si--bar .si__acts { width: 360px; flex: none; }
  .si--bar .si__cap { top: 64px; bottom: auto; }
  .si--bar .drift { -webkit-mask-image: linear-gradient(180deg, transparent 8%, #000 20%, #000 46%, transparent 62%); mask-image: linear-gradient(180deg, transparent 8%, #000 20%, #000 46%, transparent 62%); }
}

/* The join flow: one question per screen, true to the app's type scale (round 1's sketches were drawn too big), the answer low where a thumb is */
.app--bare .app__scroll:has(.ob) { background: var(--kino-bg-canvas); }
.ob { display: flex; flex-direction: column; min-height: 100%; padding: 52px var(--kino-space-20) var(--kino-space-24); gap: var(--kino-space-20); }
.app--device .ob { padding-top: 56px; }
.ob-head { display: flex; align-items: center; justify-content: space-between; margin: 0 calc(var(--kino-space-8) * -1); }
.ob-body { flex: 1; display: flex; flex-direction: column; gap: var(--kino-space-20); }
.ob-hero { display: flex; flex-direction: column; gap: var(--kino-space-8); }
.ob-hero--center { align-items: center; text-align: center; }
.ob-hero--center > .k-avatar, .ob-hero--center > .ob-fan, .ob-hero--center > .set-mark { margin-bottom: var(--kino-space-8); }
.ob-title { margin: 0; font: 800 28px/34px var(--kino-font-display); letter-spacing: -.02em; }
.ob-sub { margin: 0; font: 400 15px/22px var(--kino-font-ui); color: var(--kino-text-secondary); max-width: 40ch; }
.ob-mark { display: inline-flex; align-items: flex-start; font: 800 36px/1 var(--kino-font-display); letter-spacing: -.035em; margin-bottom: var(--kino-space-8); }
.ob-mark i { width: 8px; height: 8px; border-radius: 50%; background: var(--kino-signal-you); margin: 2px 0 0 1px; }
.ob-actions { margin-top: auto; display: flex; flex-direction: column; gap: var(--kino-space-12); }
.ob-actions--row { flex-direction: row; justify-content: center; gap: var(--kino-space-8); margin-top: 0; }
.ob-actions--dock { position: sticky; bottom: 0; margin: auto calc(var(--kino-space-20) * -1) calc(var(--kino-space-24) * -1); padding: 40px var(--kino-space-20) var(--kino-space-24);
  background: linear-gradient(180deg, transparent, var(--kino-bg-canvas) 32px); align-items: center; }
.ob-actions--dock .k-btn { width: 100%; }
.ob-fine { margin: 0; text-align: center; font: 400 13px/18px var(--kino-font-ui); color: var(--kino-text-secondary); }
.ob-link { color: var(--kino-text-secondary); }
.ob-link:hover { color: var(--kino-text-primary); }
.ob-fields { display: flex; flex-direction: column; gap: var(--kino-space-16); }
.ob-tens { display: flex; gap: 6px; }
.ob-tens .k-dot { width: 8px; height: 8px; transition: background-color var(--kino-motion-fast); }
.ob-fan { display: flex; justify-content: center; padding: var(--kino-space-8) 0; }
.ob-fan > span { margin: 0 -14px; transform: rotate(calc(var(--i) * 7deg)) translateY(calc(var(--i) * var(--i) * 6px)); z-index: calc(2 - var(--i) * var(--i)); }
.ob-fan .k-poster { --k-pw: 84px; box-shadow: var(--kino-elevation-2); }
.ob-fan > span:nth-child(2) .k-poster { --k-pw: 96px; }
/* The starter, as a wall: tap what you've seen and your dot drops onto the poster's bottom edge, like a vote */
.ob-wall { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--kino-space-16) var(--kino-space-12); padding-bottom: var(--kino-space-8); }
.ob-film { position: relative; padding: 0; border: 0; background: none; cursor: pointer; }
.ob-film .k-poster { --k-pw: 100%; transition: transform var(--kino-motion-fast) var(--kino-ease), opacity var(--kino-motion-fast); }
.ob-film:active .k-poster { transform: scale(.97); }
.ob-film__dot { position: absolute; left: 50%; bottom: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--kino-signal-you);
  box-shadow: 0 0 0 3px var(--kino-bg-canvas); transform: translate(-50%, 50%) scale(0); transition: transform var(--kino-motion-base) var(--kino-ease); }
.ob-film.is-seen .ob-film__dot { transform: translate(-50%, 50%) scale(1); }
.ob-film.is-new .ob-film__dot { animation: ob-drop .36s var(--kino-ease); }
@keyframes ob-drop { from { transform: translate(-50%, -140%) scale(.6); opacity: 0; } 60% { transform: translate(-50%, 60%) scale(1.06); opacity: 1; } }
.ob-film:focus-visible { outline: none; } .ob-film:focus-visible .k-poster { outline: 2px solid var(--kino-border-focus); outline-offset: 2px; }
.ob-versus .r-option { padding: var(--kino-space-6); }
.ob-podium .o-top3 { max-width: 360px; }
.ob-line { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.ob-line p { margin: 0; font: 600 17px/24px var(--kino-font-ui); max-width: 30ch; }
.ob-match { display: flex; flex-direction: column; align-items: center; gap: var(--kino-space-4); margin-bottom: var(--kino-space-8); }
.ob-pair { display: flex; }
.ob-pair .k-avatar + .k-avatar { margin-left: -10px; box-shadow: 0 0 0 4px var(--kino-bg-canvas); }
.ob-pct { font: 800 112px/1 var(--kino-font-display); letter-spacing: -.055em; color: var(--kino-signal-you); font-variant-numeric: tabular-nums; }
.ob-match--sm .ob-pair .k-avatar + .k-avatar { margin-left: -6px; box-shadow: 0 0 0 3px var(--kino-bg-canvas); }
.ob-match--sm .ob-pct { font-size: 64px; letter-spacing: -.05em; }
.ob-match .ob-pair .k-avatar:first-child { animation: ob-meet-l .7s var(--kino-ease) backwards; }
.ob-match .ob-pair .k-avatar:last-child { animation: ob-meet-r .7s var(--kino-ease) backwards; }
.ob-match .ob-pct { animation: ob-pop .6s cubic-bezier(.3, 1.35, .5, 1) .2s backwards; }
@keyframes ob-meet-l { from { transform: translateX(-28px); } }
@keyframes ob-meet-r { from { transform: translateX(28px); } }

/* ===== A take's score: on the right, big and bold (your request, 2026-10-10, like the original's) =====
   The badge reading (.app--score-badge, the default since your note): their dot grows into a circle that carries the number.
   The number reading: a big Bricolage number with their dot. Either way the colour is who scored it, never how good the score is.
   Toned down a little after your first look, and the take's words stop short of the score's column so the two never meet. */
/* The friend's dot sits centre-left of the number, like every score dot (dots are only ever centre-left or, as markers, top right) */
.t-score { flex: none; display: inline-flex; align-items: center; gap: 5px; color: var(--kino-text-primary); font-variant-numeric: tabular-nums; white-space: nowrap; }
.t-score .k-dot { width: 9px; height: 9px; }

.app--score-badge .t-score { width: 48px; height: 48px; justify-content: center; align-items: center; border-radius: 50%; background: var(--kino-id, var(--kino-signal-you)); color: var(--kino-text-on-identity); }
.app--score-badge .t-score:not([class*="id-"]) { color: var(--kino-text-on-accent); }
.app--score-badge .t-score .k-dot { display: none; }

.o-take__film > .t-score { margin-left: auto; align-self: center; }
@container app (min-width: 900px) {

  .feed-item__body { grid-template-columns: 136px minmax(0, 1fr) auto; grid-template-areas: "poster film score" "poster quote ." "poster actions ."; }

.sk-wrap.is-off .sk { animation: none; }
.st-whole { position: absolute; left: 0; right: 0; top: 96px; display: flex; flex-direction: column; align-items: center; gap: var(--kino-space-8); padding: var(--kino-space-24) var(--kino-space-20);
  text-align: center; border-radius: var(--kino-radius-card); background: var(--kino-bg-surface); box-shadow: var(--kino-elevation-2); }
.st-whole h2, .st-whole p { margin: 0; } .st-whole .k-btn { margin-top: var(--kino-space-8); }
.st-whole__dot { width: 22px; height: 22px; border-width: 2px; margin-bottom: var(--kino-space-4); }
.st-slowline { display: flex; align-items: center; gap: var(--kino-space-8); margin: 0 0 var(--kino-space-16); font: 500 13px/18px var(--kino-font-ui); color: var(--kino-text-secondary); }
.st-catch .k-btn { margin-left: auto; }

/* ===== Round 2, passed (2026-10-10): Noah's picks ===== */
/* 1 · Pull to refresh: the crowd's dots arrive as you pull */
.pr { display: flex; align-items: flex-end; justify-content: center; overflow: hidden; padding-bottom: var(--kino-space-12); color: var(--kino-text-secondary); }
.h-split--two .pr { order: -4; }
.pr-dots { display: inline-flex; gap: 8px; }
.pr-dots .k-dot { width: 9px; height: 9px; transform: scale(var(--s)); opacity: var(--s); }
/* 2 · Push notifications, on an iPhone lock screen (iOS's own chrome, drawn plainly) */
.lk { position: absolute; inset: 0; z-index: 30; overflow: hidden; background: #000; }
.lk-wall { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 50%; opacity: .62; }
.lk-in { position: relative; height: 100%; display: flex; flex-direction: column; padding: 72px 10px 0; }
.lk-clock { display: flex; flex-direction: column; align-items: center; color: #fff; }
.lk-clock span { font: 600 17px/22px var(--kino-font-ui); opacity: .9; }
.lk-clock b { font: 600 88px/1 var(--kino-font-ui); letter-spacing: -.02em; }
.lk-stack { margin: auto 0 132px; display: flex; flex-direction: column; gap: 8px; }
.lk-note { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 12px 12px; border-radius: 22px; background: rgb(28 27 26 / .7); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); color: #fff; }
.lk-lead { flex: none; padding-top: 2px; }
.lk-av { position: relative; display: block; width: 38px; height: 38px; }
.lk-av > .k-avatar { width: 38px; height: 38px; font-size: 14px; }
.lk-av--group .m-cluster { transform: scale(.9); transform-origin: 0 0; }
/* the bell's new marker, just off the photo's top right; cream on iOS's dark card in either theme */
.lk-new { position: absolute; left: calc(85.36% + 2px); top: calc(14.64% - 2px); transform: translateY(-100%); width: 9px; height: 9px; border-radius: 50%; background: var(--kino-cream-50); }
.lk-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lk-top { display: flex; justify-content: space-between; gap: 8px; font: 600 15px/20px var(--kino-font-ui); }
.lk-top span { font: 400 13px/20px var(--kino-font-ui); opacity: .6; }
.lk-title { font: 600 15px/20px var(--kino-font-ui); }
.lk-body { font: 400 15px/20px var(--kino-font-ui); opacity: .9; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* 4 · Asking for permission: Kino's own words first, then iOS's alert (drawn plainly) */
.ask { align-items: center; text-align: center; }
.ios-dim { align-items: center !important; justify-content: center; background: rgb(0 0 0 / .42) !important; }
.ios-alert { width: 270px; border-radius: 14px; overflow: hidden; background: rgb(44 44 46 / .95); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); color: #fff; text-align: center; }
.ios-alert__text { display: flex; flex-direction: column; gap: 4px; padding: 19px 16px 18px; }
.ios-alert__text b { font: 600 17px/22px var(--kino-font-ui); }
.ios-alert__text span { font: 400 13px/17px var(--kino-font-ui); }
.ios-alert__acts { display: grid; grid-template-columns: 1fr 1fr; border-top: .5px solid rgb(255 255 255 / .18); }
.ios-alert__acts button { height: 44px; border: 0; background: none; color: #0a84ff; font: 400 17px/22px var(--kino-font-ui); cursor: pointer; }
.ios-alert__acts button + button { border-left: .5px solid rgb(255 255 255 / .18); font-weight: 600; }
/* on the web the browser asks instead: its own prompt under the address bar, and the page isn't dimmed */
.br-ask { position: absolute; top: 10px; left: 16px; width: 320px; display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 8px; background: rgb(41 42 45); color: #e8eaed; box-shadow: 0 6px 24px rgb(0 0 0 / .45); text-align: left; }
.br-ask b { font: 500 14px/20px var(--kino-font-ui); }
.br-ask__what { display: flex; align-items: center; gap: 10px; font: 400 14px/20px var(--kino-font-ui); }
.br-ask__what .k-icon { width: 18px; height: 18px; color: #9aa0a6; }
.br-ask__acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.br-ask__acts button { height: 32px; padding: 0 16px; border-radius: 16px; border: 1px solid rgb(255 255 255 / .22); background: none; color: #8ab4f8; font: 500 13px/1 var(--kino-font-ui); cursor: pointer; }
.br-ask__acts button.is-main { background: #8ab4f8; border-color: #8ab4f8; color: #202124; }
@container app (min-width: 900px) { .ios-dim { background: transparent !important; } }

/* ===== The web tightening pass (2026-10-11): Groups, profiles, the film page and the vote, read like Home and the original ===== */
/* The web revisit's rules, carried to the rest of the web: a small, steady type scale (13 / 15 / 17), hierarchy from weight and
   grey rather than size, hairline rows instead of boxes, small thumbnails, one bold thing per screen. Only .app--tight changes. */
@container app (min-width: 900px) {
  /* Groups: compact rows like the feed's. Names at 17 in Geist, bundles at 48, still two columns; your turn stays the Tomato dot */
  .app--tight .g-item > .g-row { grid-template-columns: 52px minmax(0, 1fr) auto; column-gap: var(--kino-space-16); padding: var(--kino-space-16) var(--kino-space-12); }
  .app--tight .g-row::after { left: calc(var(--kino-space-12) + 52px + var(--kino-space-16)); right: var(--kino-space-12); }
  .app--tight .g-row .m-cluster { zoom: .8; }
  .app--tight .g-row__title { font: 600 17px/22px var(--kino-font-ui); letter-spacing: -.005em; }
  .app--tight .g-row__sub { font: 400 13px/18px var(--kino-font-ui); }
  .app--tight .g-new { width: 48px; height: 48px; --k-icon-size: 20px; }

  /* The vote: captions close to their posters, and a quieter tally (smaller faces, a 40px Lock the pick) */
  .app--tight .v-field--edge .v-film__title { margin-top: 22px; min-height: 20px; }
  .app--tight .v-voter .k-avatar { --k-av: 32px; font-size: 12px; }
  .app--tight .v-tally > .k-btn--block { height: 40px; min-width: 200px; font-size: 15px; }
  .app--tight .v-voter.pf-link { font: 400 13px/18px var(--kino-font-ui); color: var(--kino-text-secondary); }

  /* It's settled: the big header stays the one bold thing; the film's name steps down, the poster isn't zoomed, and the second
     row of actions takes the small size, like Follow and Compare */
  .app--tight .picked .p-stage { zoom: 1; }
  .app--tight .picked .p-stage .k-poster { --k-pw: 264px; }
  .app--tight .picked .picked__title { font: 700 22px/28px var(--kino-font-display); letter-spacing: -.01em; }
  .app--tight .picked__actions > .k-btn { height: 44px; font-size: 15px; }
  .app--tight .picked__row .k-btn { --k-icon-size: var(--kino-size-icon-sm); height: var(--kino-size-control-sm); padding: 0 var(--kino-space-16); gap: var(--kino-space-6); font: 500 13px/16px var(--kino-font-ui); }

  /* Profiles: the person on the left is the bold thing. The tabs' content is open canvas with hairlines, like Home's feed, not
     boxed cards; Taste and the match sit side by side with a hairline between them, and their big numbers step down a size */
  .app--tight .s-split[data-profile] .s-panel .m-card, .app--tight .s-split[data-profile] > div > .m-card { background: none; box-shadow: none; border-radius: 0; padding: 0; }
  .app--tight .s-split[data-profile] .s-panel--2 { gap: 0; }
  .app--tight .s-split[data-profile] .s-panel.s-panel--2 > .m-card { padding: var(--kino-space-8) var(--kino-space-24); }
  .app--tight .s-split[data-profile] .s-panel.s-panel--2 > .m-card:first-child { padding-left: 0; }
  .app--tight .s-split[data-profile] .s-panel.s-panel--2 > .m-card:last-child { padding-right: 0; border-left: 1px solid var(--kino-border-subtle); }
  .app--tight .s-split[data-profile] .o-top3__n { font-size: 36px; }
  .app--tight .s-split[data-profile] .o-top3__item--1 .o-top3__n { font-size: 56px; }
  .app--tight .s-split[data-profile] .o-taste__line { font-size: 20px; line-height: 26px; }
  .app--tight .s-split[data-profile] .o-match .o-match__pct { font-size: 64px; }
  .app--tight .s-split[data-profile] .o-mfilm { width: 96px; }
  .app--tight .s-split[data-profile] .o-mfilm__title { font: 600 13px/18px var(--kino-font-ui); }
  .app--tight .s-split[data-profile] .o-msplit .k-poster { --k-pw: 112px; }
  .app--tight .s-split[data-profile] .o-msplit .o-mfilm__title { font: 600 15px/20px var(--kino-font-ui); }
  .app--tight .s-split[data-profile] .o-msplit__side .k-score__num { font: 600 17px/22px var(--kino-font-ui); letter-spacing: 0; }
  .app--tight .s-split[data-profile] .o-msplit .o-mgap b { font-size: 40px; }
  .app--tight .s-split[data-profile] .o-rank__row--top .o-rank__num { font: 600 15px/20px var(--kino-font-ui); }

  /* The film page: a smaller poster (240) and less empty backdrop above it; friends and where to watch are open hairline lists,
     not boxes, with 32px faces and marks; the cast's faces at 56 */
  .app--tight .s-film { grid-template-columns: 240px minmax(0, 1fr) !important; }
  .app--tight .s-film--back { padding-top: 160px; }
  .app--tight .s-film--back > .s-film__main { padding-top: 124px; } /* the info starts where the backdrop fades out; the poster still rises into it */
  .app--tight .s-film__main .m-card--flush { background: none; box-shadow: none; border-radius: 0; padding: 0; }
  .app--tight .s-film__main .m-card--flush > .m-section-head { padding: 0 0 var(--kino-space-4); }
  .app--tight .s-film__main .m-person + .m-person { border-top: 1px solid var(--kino-border-subtle); }
  .app--tight .s-film__main .m-person .k-avatar { --k-av: 32px; font-size: 12px; }
  .app--tight .s-film__main .m-person .k-score__num { font: 600 15px/20px var(--kino-font-ui); }
  .app--tight .s-film__main .wtw__mark { width: 32px; height: 32px; font-size: 12px; }
  .app--tight .s-film__main .cast .k-avatar { --k-av: 56px; }
}
/* Laptops under 1200px (the compact rail): a friend's Taste and the match stack in one column, so neither gets squeezed */
@container app (min-width: 900px) and (max-width: 1199px) {
  .app--tight .s-split[data-profile] .s-panel.s-panel--2 { grid-template-columns: minmax(0, 1fr) !important; }
  .app--tight .s-split[data-profile] .s-panel.s-panel--2 > .m-card { padding: var(--kino-space-24) 0 0; }
  .app--tight .s-split[data-profile] .s-panel.s-panel--2 > .m-card:first-child { padding-top: var(--kino-space-8); }
  .app--tight .s-split[data-profile] .s-panel.s-panel--2 > .m-card:last-child { border-left: 0; border-top: 1px solid var(--kino-border-subtle); margin-top: var(--kino-space-24); }
}

/* ===== Interactions (round 1 passed, 2026-10-11; notes/interact-1.md): Noah's picks, which were mine =====
   1 Opening things: what you tapped travels to its place (a copy of it, .ot-ghost) while the old screen fades away on top (.ot-old),
     so the new screen is already there, whole: no cut to black, no words arriving before their pictures.
   2 Hovering a poster on the web: friends' scores in a card beside it, never on it (.hv); it flips to the other side near the edge.
   3 Back online: the offline line folds away so everything under it moves up in one piece, then your hollow dot fills.
   4 Lists: a pile deals out only the films on screen as it opens; Edit fans every pile open (and folds them when you're done).
   5 Fun: tap kino and the crowd gathers again; double-tap a take to like it; a friend's match counts up; It's settled. bursts. */
.ot-old { position: absolute; z-index: 4; overflow: hidden; box-sizing: border-box; pointer-events: none; background: var(--kino-bg-canvas); } /* under the tab bar (5) */
.ot-old * { animation: none !important; transition: none !important; }
.ot-ghost { position: absolute; z-index: 60; pointer-events: none; transform-origin: 0 0; }
.ot-ghost > .k-poster { --k-pw: 100% !important; width: 100% !important; height: 100%; box-shadow: var(--kino-elevation-2); }
.ot-ghost > .k-avatar { width: 100% !important; height: 100% !important; }
.ot-crowd { position: absolute; z-index: 60; pointer-events: none; width: 8px; height: 8px; }
.ot-heart { position: absolute; z-index: 60; pointer-events: none; line-height: 0; color: var(--kino-signal-you); --k-icon-size: 56px; }
/* 2 · The hover card (web only), drawn above the screen so a side column can't clip it */
.hv { position: absolute; z-index: 40; pointer-events: none; opacity: 0; transition: opacity .16s var(--kino-ease), transform .2s var(--kino-ease);
  width: 220px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: var(--kino-space-12) var(--kino-space-16);
  border-radius: var(--kino-radius-card); background: var(--kino-bg-surface); border: 1px solid var(--kino-border-subtle); box-shadow: var(--kino-elevation-2); }
.hv[data-side="right"] { transform: translateX(-6px); }
.hv[data-side="left"] { transform: translateX(6px); }
.hv.is-on { opacity: 1; transform: none; }
.hv__t { font: 600 15px/20px var(--kino-font-ui); color: var(--kino-text-primary); }
.hv__m { font: 400 13px/18px var(--kino-font-ui); color: var(--kino-text-secondary); }
.hv__rows { display: flex; flex-direction: column; gap: var(--kino-space-6); margin: var(--kino-space-10, 10px) 0 var(--kino-space-8); padding-top: var(--kino-space-10, 10px); border-top: 1px solid var(--kino-border-subtle); }
.hv__row { display: flex; align-items: center; gap: var(--kino-space-8); font: 400 13px/18px var(--kino-font-ui); color: var(--kino-text-secondary); }
.hv__row .k-score { min-width: 44px; }
.hv__avg { font: 400 12px/16px var(--kino-font-ui); color: var(--kino-text-secondary); }
/* 3 · Back online: Try again sits at the end of the offline line */
.st-off__go { flex: none; margin: -6px -8px -6px auto; }
/* 4 · Edit fans every pile open, and Done folds them */
@keyframes ls-fan { from { transform: translateX(calc(-50% + var(--x))) translateY(var(--y)) rotate(var(--r)); } }
@keyframes ls-fold { from { transform: translateX(calc(-50% + var(--hx))) translateY(var(--hy)) rotate(var(--hr)); } }
.ls-grid.is-editing .ls-pile > span:nth-child(n+2) { transform: translateX(calc(-50% + var(--hx))) translateY(var(--hy)) rotate(var(--hr)); }
.ls-grid.is-fanning .ls-pile > span:nth-child(n+2) { animation: ls-fan .44s cubic-bezier(.3, 1.35, .5, 1) both; animation-delay: calc(var(--i) * 30ms); }
.ls-grid.is-folding .ls-pile > span:nth-child(n+2) { animation: ls-fold .32s var(--kino-ease) both; }
/* 5 · The wordmark on Home is a button: tap it and the crowd gathers again */
button.s-wm { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.app--calm .ls-grid .ls-pile > span { animation: none !important; }
@media (prefers-reduced-motion: reduce) { .ls-grid .ls-pile > span { animation: none !important; } .hv { transition: none; } }

/* ---------- interactions, round 2 (passed 2026-10-11; notes/interact-3.md): a more menu on takes ----------
   The "…" sits at the end of a take's actions. iPhone: hold the take (it gives a little), then it lifts and the menu unfolds under it.
   The web: a menu by the "…" (or where you right-clicked), in the same card as your menu from the rail. */
.o-take__actions .t-more { margin-left: auto; }
@container app (max-width: 899px) {
  .app__page [data-take] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
}
@container app (min-width: 900px) {
  [data-take] .t-more { opacity: 0; transition: opacity var(--kino-motion-fast) var(--kino-ease); }
  [data-take]:hover .t-more, .t-more:focus-visible, .t-more[aria-expanded="true"] { opacity: 1; }
}
.app__page [data-take] { transition: transform .4s var(--kino-ease); }
.app__page [data-take].is-pressing { transform: scale(.98); }
.is-lifted-src { visibility: hidden; }
.tm { position: absolute; inset: 0; z-index: 25; background: color-mix(in srgb, var(--kino-bg-canvas) 62%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.tm.is-fresh { animation: k-fade .2s var(--kino-ease); }
.tm-lift { position: absolute; pointer-events: none; transform: scale(1.03); }
.tm-lift::before { content: ''; position: absolute; inset: 0 -14px; z-index: -1; border-radius: 18px; background: var(--kino-bg-surface); box-shadow: var(--kino-elevation-2); }
.tm-lift > * { border-top: 0 !important; }
.tm.is-fresh .tm-lift { animation: tm-lift .36s cubic-bezier(.3, 1.35, .5, 1) both; }
.tm.is-fresh .tm-lift::before { animation: k-fade .2s var(--kino-ease) both; }
@keyframes tm-lift { from { transform: scale(1); } to { transform: scale(1.03); } }
.tm-menu { position: absolute; width: 250px; padding: var(--kino-space-6); display: flex; flex-direction: column; gap: 2px; background: var(--kino-bg-surface);
  border: 1px solid var(--kino-border-subtle); border-radius: 14px; box-shadow: var(--kino-elevation-2); transform-origin: calc(100% - 20px) 0; }
.tm-menu[data-from="hold"] { transform-origin: 50% 0; }
.tm-menu[data-up] { transform-origin: calc(100% - 20px) 100%; }
.tm-menu[data-from="hold"][data-up] { transform-origin: 50% 100%; }
.tm-menu[data-from="right"] { transform-origin: 0 0; }
.tm-menu.is-fresh { animation: tm-menu .26s var(--kino-ease) both; }
.tm-menu.is-fresh .tm-row { animation: tm-row .3s var(--kino-ease) both; animation-delay: calc(50ms + var(--i) * 22ms); }
@keyframes tm-menu { from { opacity: 0; transform: scale(.9); } }
@keyframes tm-row { from { opacity: 0; transform: translateY(-4px); } }
.tm-row { display: flex; align-items: center; gap: var(--kino-space-12); height: 44px; flex: none; padding: 0 var(--kino-space-12); border: 0; border-radius: 10px; background: none;
  color: var(--kino-text-primary); font: 500 15px/20px var(--kino-font-ui); text-align: left; cursor: pointer; --k-icon-size: 20px; }
.tm-row .k-icon { color: var(--kino-icon-secondary); }
.tm-row:hover, .tm-row:active { background: var(--kino-bg-fill); }
.tm-row:focus-visible { outline: 2px solid var(--kino-border-focus); outline-offset: -2px; }
.tm-row--danger, .tm-row--danger .k-icon { color: var(--kino-text-danger); }
.tm-sep { height: 1px; flex: none; margin: var(--kino-space-4) var(--kino-space-8); background: var(--kino-border-subtle); }
.tm-pop { z-index: 25; width: 232px; border-radius: var(--kino-radius-card); }
.tm-pop .tm-row { height: 40px; }
.tm-pop.is-fresh { animation-duration: .2s; }
.tm-pop.is-fresh .tm-row { animation: none; }
.tm.is-closing { animation: tm-out .17s var(--kino-ease) forwards; }
.tm.is-closing .tm-lift { animation: none; transition: transform .17s var(--kino-ease); transform: scale(1); }
.tm-pop.is-closing { animation: tm-out .12s var(--kino-ease) forwards; }
@keyframes tm-out { to { opacity: 0; } }
.rpt-lede { margin: 0 var(--kino-space-4); }
.rpt-done { display: flex; flex-direction: column; align-items: center; gap: var(--kino-space-8); padding: var(--kino-space-12) var(--kino-space-16) var(--kino-space-20); text-align: center; }
.rpt-done b { font: 600 17px/22px var(--kino-font-ui); }
.rpt-check { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--kino-bg-fill); color: var(--kino-text-primary); --k-icon-size: 24px; margin-bottom: var(--kino-space-4); }
@media (prefers-reduced-motion: reduce) { .tm, .tm-lift, .tm-menu, .tm-row { animation: none !important; } .app__page [data-take] { transition: none; } }
.app--calm .tm, .app--calm .tm-lift, .app--calm .tm-menu, .app--calm .tm-row { animation: none !important; }

/* ===== Finalizing V.2.3 (2026-10-11): two fixes from Noah's look at the live link =====
   1 Your profile's Lists, on the web: the piles sat in a ~580px column split four ways and overlapped; two roomy columns there.
   2 Pages reached from a menu (Invites, Settings, Your stats, People, Notification settings) get a Back above the title on the web. */
@container app (min-width: 900px) { .mf--profile .ls-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--kino-space-40); row-gap: var(--kino-space-32); } }
/* 4 Profiles on the web: the profile column rested 32px down (the page's top padding) but stuck at 24, so it jumped 8px as you started
     scrolling the right side and back at the top (Noah, 2026-10-11). It sticks exactly where it rests now. */
@container app (min-width: 900px) { .app--tight .s-split[data-profile] > aside { top: var(--kino-space-32); } }
.s-back { margin: 0 0 var(--kino-space-12) calc(-1 * var(--kino-space-12)); padding: 0 var(--kino-space-12); }
/* 3 My films' podium, on the web: bolder, and it grows with the window (Noah, 2026-10-11: "could be bolder, very small currently.
     Responsive to window size too?"). It scales with the app's width (cqi): 460 wide at 900, 640 at 1280, 740 at 1480 and up. */
@container app (min-width: 900px) {
  .mf-podium { padding: var(--kino-space-16) 0 var(--kino-space-24); }

     from the main page"). The browser's own back leaves the prototype, so the page carries one: a film, a group, It's settled., a new group,
     a list and notifications get it at the top left; a friend's profile has it in the card's top row, across from share and more, so the card stays put. */
.s-pagenav { margin-bottom: calc(-1 * var(--kino-space-12)); }
.s-pagenav .s-back, .s-film__nav .s-back { margin-bottom: 0; }
.s-film__nav { position: absolute; top: 0; left: 0; z-index: 2; } /* in the empty band over the backdrop's canvas side; the film doesn't move */
.s-profile-back { position: absolute; top: var(--kino-space-12); left: var(--kino-space-12); z-index: 1; }
.s-profile-back .s-back { margin: 0; }
@container app (min-width: 900px) {
  .app--tight .s-profile-back { top: var(--kino-space-8); left: var(--kino-space-8); }
  .s-pagenav + .picked { margin-block: auto; } /* It's settled. stays centred under it */
}

          <div class="n-pop__body n-pop__set${dir}"><span class="sub">Tell me about</span>${NSET.map(x => nswitch(st, x)).join('')}</div>`

          <div class="n-pop__body${dir}">${noteList(st)}</div>
          <button class="k-btn k-btn--ghost k-btn--block n-pop__all" data-go="#/notifications">See all</button>`}</div>`;
  }

  /* ---------- screens ---------- */
  function home(st) {

    const g = GROUPS[0], waiting = !st.myVote;

      <div class="g-status__posters">${CANDS.map(c => `<button class="tile" data-go="#/group/thursday" aria-label="${F[c.k][0]}">${poster(c.k, 'm')}</button>`).join('')}</div>
      <button class="k-btn k-btn--accent k-btn--block" data-go="#/group/thursday">${ic('popcorn')}${waiting ? 'Vote for Friday' : 'See the pick'}</button></div>`;
    // Rank what you watched shows only when there's something to rank, and grows with it (V.2.1 crit): one to three films sit large
    // and centred; four or more become a row that scrolls sideways, so it never reads like the Recently released grid below it.
    const watched = (st.toRank || ['interstellar', 'odyssey', 'coyote', 'residentevil']).filter(k => st.ranked[k] == null);

    // One feed, no cut: it loads the next page as you near the end (see watchFeed)
    const feed = st.err === 'feed' ? `<div class="h-feed"><div class="m-section-head"><h3>Lately</h3></div>${errCard('your feed')}</div>`
      : `<div class="h-feed"><div class="m-section-head"><h3>Lately</h3></div>${Array.from({ length: st.feedPages }, (_, n) => feedHtml(st, n)).join('')}

    const top = `<div class="h-top narrow-only"><button class="s-wm" data-act="gather" aria-label="Kino">kino<i></i></button>${bellBtn(st, 'data-go="#/notifications"')}</div>`;
    const hero = `${st.pull ? pullZone(st) : ''}${offLine(st)}<div class="s-head h-hero"><h1 class="s-title">${greeting(st)}</h1><p class="s-sub">One group pick needs you, and four films are waiting for a score.</p></div>${catchUp(st)}`;
    // The web revisit (the nav choice sheet): the greeting heads the main column, and the side column runs from the top and
    // scrolls on its own, ending with people to follow. Coming soon waits for films whose dates are certain.
    if (st.webNav) {

  function explore(st) {
    // Your filters deal a pile of their own (the rest of the original, round 1). The chips under the search are its quickest
    // filters, the same ones that open the Filters sheet, so a chip you tap shows as picked inside it, and the sheet has more
    // (your note). Inside one of Kino's piles the chips change to suit it, and each pile remembers its own.
    const b = st.browse, mineP = b ? { id: 'mine', title: browseTitle(b), films: browseFilms(st) } : null, piles = mineP ? [mineP, ...PILES] : PILES;
    const ni = st.notInterested || {}, siftN = (films, on2, p) => sift(films, on2, p).filter(k => !ni[k]);
    const open = st.pile && piles.find(p => p.id === st.pile), quickRow = !open || open.id === 'mine';
    const set = quickRow ? {} : (st.pchips[open.id] = st.pchips[open.id] || {}), list = quickRow ? [] : (PILE_CHIPS[open.id] || []);
    const on = list.filter(c => set[c]), shift = on.length;
    const chip = c => `<button class="k-chip" aria-pressed="${!!set[c]}" data-act="chip" data-c="${c}">${P[c] ? `<span class="k-dot id-${P[c].h}"></span>${P[c].n}` : c}</button>`;
    const quick = ([id, label]) => `<button class="k-chip" aria-pressed="${quickOn(b, id)}" data-act="quick" data-q="${id}">${id === 'friends' ? dots(FRIENDS4.slice(0, 3)) : ''}${label}</button>`;
    const head = `${topbar('')}<div class="s-head"><h1 class="s-title">Explore</h1></div>
      <div class="s-sticky"><div class="x-searchrow"><label class="k-search">${ic('magnifying-glass')}<input type="search" placeholder="Search films, friends, lists" aria-label="Search"${st.blank === 'search' ? ' value="Paddingtn"' : ''}></label>
        <button class="k-iconbtn k-iconbtn--secondary x-filters${b ? ' is-on' : ''}" data-act="fopen" aria-label="Filters${b ? `, ${browseOn(b)} on` : ''}">${ic('sliders-horizontal')}${b && browseOn(b) ? `<span class="x-filters__n">${browseOn(b)}</span>` : ''}</button></div>
        <div class="chips x-chips">${quickRow ? QUICK.map(quick).join('') : list.map(chip).join('')}</div></div>`;
    const none = `<p class="sub x-none">Nothing matches. Try fewer filters.</p>`;
    // iPhone keeps shelves
    const shelfOf = p => { const films = siftN(p.films, on, p); return films.length ? shelf(films) : none; };
    const friends = siftN(PILES[0].films, on, PILES[0]);
    const mineFilms = mineP ? mineP.films.filter(k => on.every(c => fits(c, k, mineP))) : [];
    const mineSec = mineP ? `<div class="s-section x-mine"><div class="m-section-head"><h3>${mineP.title}</h3><button class="k-btn k-btn--ghost k-btn--sm" data-act="bclear">Clear</button></div>
        ${mineFilms.length ? `<div class="poster-grid">${mineFilms.slice(0, 9).map(k => tile(k, PILES[0].who[k])).join('')}</div>` : none}</div>` : '';
    const narrow = `<div class="narrow-only x-shelves">${mineSec}
      <div class="s-section"><div class="m-section-head"><h3>Friends are loving</h3><button class="k-btn k-btn--ghost k-btn--sm">See all</button></div>
        ${friends.length ? `<div class="poster-grid">${friends.slice(0, 6).map(k => st.err === 'poster' && k === 'budapest' ? `<button class="tile" data-go="#/film/${k}" aria-label="${F[k][0]}">${brokenPoster(k)}<span class="tile__who">${whodots(PILES[0].who[k])}</span></button>` : tile(k, PILES[0].who[k])).join('')}</div>` : none}</div>
      <div class="s-section"><div class="m-section-head"><h3>${PILES[1].title}</h3></div>${shelfOf(PILES[1])}</div>
      <div class="s-section"><div class="m-section-head"><h3>${PILES[2].title}</h3></div>${shelfOf(PILES[2])}</div></div>`;
    // Web adds friction on purpose: three piles to dig through. Filters re-deal them; picking one up spreads it into a grid.
    // Each pile is dealt its own way, seeded by the pile and the visit, so no two fan or burst alike (V.2.1 crit). The top card
    // stays put on hover; the ones beneath fly out on their own paths, a little further than before.
    const pileSeed = id => [...id].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, st.seed >>> 0);
    // Seven cards a pile (V.2.1 crit: fuller, less wild). The six beneath take one sixth of the circle each, in a shuffled order with a
    // little jitter, so every pile spreads evenly but none alike. Bursts travel less sideways than up and down, so a card never covers
    // the next pile. Each card fades towards the pile (--ga points away from it), so it looks like it's emerging from the stack.
    const card = (k, i, r, turn, slots) => { if (!i) return `<span class="x-pile__card" style="--i:0;--r:${((r() - .5) * 3).toFixed(1)}deg">${poster(k, 'l')}</span>`;
      const a = (turn + slots[(i - 1) % 6] * 60 + (r() - .5) * 24) * Math.PI / 180, d = 4 + i * (3 + r() * 2), rot = (r() < .5 ? -1 : 1) * (1.2 + r() * 2) * Math.sqrt(i);
      const dx = d * Math.cos(a), dy = d * Math.sin(a), ba = a + (r() - .5) * .3, bd = 38 + i * (15 + r() * 6);
      const ga = Math.atan2(dx, -dy) * 180 / Math.PI - rot;
      return `<span class="x-pile__card" style="--i:${i};--dx:${dx.toFixed(1)}px;--dy:${dy.toFixed(1)}px;--r:${rot.toFixed(1)}deg;--bx:${(bd * Math.cos(ba) * .72).toFixed(1)}px;--by:${(bd * Math.sin(ba)).toFixed(1)}px;--br:${(rot * (1.6 + r() * .8)).toFixed(1)}deg;--bt:${(r() * 80).toFixed(0)}ms;--ga:${ga.toFixed(0)}deg">${poster(k, 'l')}</span>`; };
    const pile = p => { const films = rotate(siftN(p.films, on, p), shift), r = rng(pileSeed(p.id)), turn = r() * 360, slots = [0, 1, 2, 3, 4, 5].map(q => [r(), q]).sort((x, y) => x[0] - y[0]).map(([, q]) => q);
      return `<button class="x-pile${st.hoverPile === p.id ? ' is-hover' : ''}" data-act="pile" data-p="${p.id}" aria-label="Open ${p.title}, ${nfilms(films.length)}" ${films.length ? '' : 'disabled'}>
        <span class="x-pile__stack">${films.length ? films.slice(0, 7).map((k, i) => card(k, i, r, turn, slots)).join('') : '<span class="x-pile__empty"></span>'}</span>
        <span class="x-pile__label"><b>${p.title}</b><span class="sub">${films.length ? nfilms(films.length) : 'Nothing matches'}</span></span></button>`; };
    const spread = p => { const films = rotate(siftN(p.films, on, p), shift);
      return `<div class="x-open">
        <div class="x-open__head"><button class="k-btn k-btn--ghost k-btn--sm" data-act="unpile">${ic('caret-left')}All piles</button><h2 class="kino-display-m">${p.title}</h2><span class="sub">${nfilms(films.length)}</span></div>
        ${films.length ? `<div class="x-grid">${films.map((k, i) => `<button class="x-card" data-go="#/film/${k}" style="--i:${i}">${poster(k, 'm')}<b>${F[k][0]}</b><span class="sub">${stats(k)}</span>${p.who && p.who[k] ? whodots(p.who[k]) : ''}</button>`).join('')}</div>` : none}</div>`; };
    const wide = `<div class="wide-only">${open ? spread(open) : `<div class="x-piles${mineP ? ' x-piles--four' : ''}">${piles.map(pile).join('')}</div><p class="sub x-hint">Pick a pile up to spread it out.${mineP ? '' : ' Your filters deal a pile of their own.'}</p>`}</div>`;
    if (st.blank === 'search') return `${head}<div class="x-zone"><div class="x-search-none">${emptySearch()}</div></div>`;
    return `${head}<div class="x-zone">${narrow}${wide}</div>`;
  }

  function film(st, k) {
    const x = X[k] || {}, mine = st.ranked[k] ?? MY[k];
    const back = backdropArt(k, 'f-back');
    const watch = `<button class="k-btn k-btn--secondary k-btn--sm f-watch" data-act="trailer" data-k="${k}">${ic('play-fill')}Watch trailer</button>`;
    const more = `<button class="k-iconbtn k-iconbtn--secondary f-more" data-act="fmenu" data-k="${k}" aria-label="More for ${F[k][0]}">${ic('dots-three')}</button>`;
    const friends = x.friends || [['maya', 8.8, ''], ['jo', 8.1, '']];
    const avg = friends.reduce((a, f) => a + f[1], 0) / friends.length;
    const pos = mine != null ? myListWith(st).findIndex(([kk]) => kk === k) + 1 : null;
    const you = mine != null
      ? `<div class="m-card you-box"><div class="you-box__row"><div><div class="label">Your score</div><div class="sub" style="margin-top:4px">#${pos} of your ${MY_TOTAL + Object.keys(st.ranked).length} films</div></div><span class="k-score k-score--hero"><span class="k-dot"></span><span class="k-score__num">${fmt(mine)}</span></span></div>
          <div class="you-box__actions"><button class="k-btn k-btn--secondary k-btn--sm" data-rank="${k}">Rank again</button><button class="k-btn k-btn--secondary k-btn--sm">${ic('pencil-simple')}Add a take</button>${more}</div></div>`
      : `<div class="m-card you-box"><div class="you-box__row"><div><div class="label">Your score</div><div class="sub" style="margin-top:4px">${x.predict ? `Kino thinks you'll land around ${fmt(x.predict)}` : 'Not ranked yet'}</div></div><span class="k-score k-score--hero k-score--unranked"><span class="k-dot k-dot--empty"></span><span class="k-score__num">–</span></span></div>
          <div class="you-box__actions"><button class="k-btn k-btn--accent" data-rank="${k}">${ic('film-slate')}Rank it</button><button class="k-iconbtn k-iconbtn--secondary${fx(st, 'save')}" aria-label="Save to watchlist" aria-pressed="${!!isSaved(st, k)}" data-act="save">${ic(isSaved(st, k) ? 'bookmark-simple-fill' : 'bookmark-simple')}</button>${more}</div></div>`;
    const where = `<div class="s-section wtw"><div class="m-section-head"><h3>Where to watch</h3><span class="sub">Sample data</span></div>
      <div class="m-card m-card--flush">${wtwFor(k).map(([n, type, detail]) => `<div class="wtw__row"><span class="wtw__mark" aria-hidden="true">${n.split(' ').map(w => w[0]).join('').slice(0, 2)}</span><div class="wtw__body"><b>${n}</b><span class="sub">${type} · ${detail}</span></div>${iconbtn('arrow-up-right', 'Open ' + n)}</div>`).join('')}</div></div>`;
    return `${back}${topbar('', { back: true, end: iconbtn('share-network', 'Share') })}
      <div class="s-film s-film--back"><div class="wide-only s-film__nav">${webBack}</div>
