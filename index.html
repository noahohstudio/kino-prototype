  }
  function myFilms(st) {
    const total = MY_TOTAL + Object.keys(st.ranked).length, watch = watchlist(st);
    return `${topbar('', { back: true })}
      <div class="mf">
        <div class="s-head"><h1 class="s-title">My films</h1><p class="s-sub">${total} ranked · ${watch.length} on your watchlist</p></div>
        ${filmsBody(st, true)}
      </div>`;
  }

  // Your stats (the six you ticked). Group stats need a group, so stats grow as you use Kino. Numbers are sample data.
  const YEAR = [['Nov', 4], ['Dec', 7], ['Jan', 3], ['Feb', 5], ['Mar', 6], ['Apr', 4], ['May', 8], ['Jun', 5], ['Jul', 9], ['Aug', 6], ['Sep', 7], ['Oct', 10]];
  const DECADES = [['2020s', 27], ['2010s', 41], ['2000s', 18], ['1990s', 9], ['Older', 5]];
  const DIRECTORS = [['Hayao Miyazaki', 7, 9.1], ['Denis Villeneuve', 6, 9.0], ['Christopher Nolan', 5, 8.6]];
  function statsPage(st) {
    const total = MY_TOTAL + Object.keys(st.ranked).length, max = Math.max(...YEAR.map(y => y[1])), year = YEAR.reduce((a, y) => a + y[1], 0) + Object.keys(st.ranked).length;
    const card = (title, sub, body, cls = '') => `<section class="m-card st-card ${cls}"><div class="st-card__head"><h3>${title}</h3><span class="sub">${sub}</span></div>${body}</section>`;
    const split = [['loved', 'loved it'], ['fine', 'it was fine'], ['no', 'not for me']];
    return `${topbar('Your stats', { back: true })}
      <div class="st">
        <div class="s-head"><div class="wide-only">${webBack}</div><h1 class="s-title wide-only">Your stats</h1><p class="s-sub">From your ${total} rankings</p></div>
        <div class="st-grid">
          ${card('Your year in films', `${year} films ranked in the last 12 months`, `<div class="st-bars" role="img" aria-label="Films ranked each month, most in October">${YEAR.map(([m, v], i) => `<span class="st-bar${i === YEAR.length - 1 ? ' is-now' : ''}"><i style="height:${Math.round((v + (i === YEAR.length - 1 ? Object.keys(st.ranked).length : 0)) / max * 100)}%"></i><span>${m}</span></span>`).join('')}</div>`, 'st-card--wide')}
          ${card('How you score', 'Your average is 8.1', `<div class="st-split">${split.map(([id]) => `<i class="st-split__${id}" style="flex:${feelCount(st, id)}"></i>`).join('')}</div>
            <div class="st-key">${split.map(([id, l]) => `<span><i class="st-split__${id}"></i><b>${feelCount(st, id)}</b>${l}</span>`).join('')}</div>`)}
          ${card('Your groups', `Across your ${GROUPS.length} groups`, `<div class="st-pair"><div><span class="st-big">3<small>of 7</small></span><span class="sub">films you suggested got picked</span></div><div><span class="st-big">8.4</span><span class="sub">your average for what got picked</span></div></div>`)}
          ${card('Your directors', 'Who you rank most, and how they do with you', DIRECTORS.map(([d, c, v]) => `<div class="st-row"><span class="st-row__name">${d}</span><span class="sub">${c} films</span>${score('you', v)}</div>`).join(''))}
          ${card('Who you match', 'Your friends, closest taste first', Object.entries(MATCH).sort((x, y) => y[1].pct - x[1].pct).slice(0, 5).map(([p, m]) =>
            `<button class="st-row" data-go="${pf(p)}">${avatar(p, 'sm')}<span class="st-row__name">${P[p].full || P[p].n}</span><span class="sub">${m.n} in common</span><b class="st-row__pct">${m.pct}%</b></button>`).join('') + `<button class="k-btn k-btn--ghost k-btn--sm st-all" data-go="#/people">All ${Object.keys(MATCH).length} friends</button>`)}
          ${card('What you rank most', 'Genres, then decades', `<div class="chips">${GENRES.slice(0, 5).map(([g, v]) => `<span class="k-chip">${g} <b>${v}%</b></span>`).join('')}</div><div class="chips">${DECADES.map(([d, v]) => `<span class="k-chip">${d} <b>${v}%</b></span>`).join('')}</div>`, 'st-card--wide')}
        </div>
        <p class="sub st-more">More shows up here as you rank and pick with friends.</p>${memberEnd()}
      </div>`;
  }

  // Settings (everything you ticked, in Kino's words). Notification settings stay with the bell, where they are now.
  const PRIV = { everyone: ['Everyone', 'Anyone on Kino can see them'], friends: ['Friends', 'People you follow who follow you back'], me: ['Only you', 'Hidden from everyone. Your groups still see your picks'] };
  const HUES = ['rose', 'amber', 'citron', 'fern', 'mint', 'lagoon', 'sky', 'periwinkle', 'lilac', 'orchid'];
  function settings(st) {
    const row = (lead, label, sub, attrs, end = ic('caret-right'), cls = '') => `<button class="e-row e-row--go${cls}" ${attrs}>${lead}<span class="e-row__body"><b>${label}</b>${sub ? `<span class="sub">${sub}</span>` : ''}</span>${end}</button>`;
    const theme = st.theme || 'device';
    return `${topbar('Settings', { back: true })}
      <div class="s-narrow e-form set">
        <div class="wide-only">${webBack}<h1 class="s-title">Settings</h1></div>
        <button class="set-me" data-go="#/me">${avatar('you', 'lg')}<span class="e-row__body"><b>Dani Cho</b><span class="sub">@dani.watches</span><span class="sub">dani@example.com</span></span>${ic('caret-right')}</button>
        <div class="e-group"><span class="m-label">You</span>
          ${row(ic('pencil-simple'), 'Edit profile', 'Photo, name, username and bio', 'data-go="#/me/edit"')}
          ${row(`<span class="k-dot k-dot--lg id-${P.you.h}"></span>`, 'Your colour', `${cap(P.you.h)}. How friends see your dot`, 'data-act="setsheet" data-s="colour"')}
          ${row(ic('lock-simple'), 'Privacy', `Your rankings and takes: ${PRIV[st.priv || 'everyone'][0].toLowerCase()}`, 'data-act="setsheet" data-s="privacy"')}</div>
        <div class="e-group"><span class="m-label">App</span>
          <div class="e-row">${ic('circle-half')}<span class="e-row__body"><b>Appearance</b><span class="sub">Saved on this device</span></span>
            <span class="m-seg set-seg" role="radiogroup" aria-label="Appearance">${[['device', 'Device'], ['dark', 'Dark'], ['light', 'Light']].map(([id, l]) => `<button role="radio" aria-checked="${theme === id}" data-act="theme" data-t="${id}">${l}</button>`).join('')}</span></div>
          ${row(ic('download-simple'), 'Import from Letterboxd', 'Bring your films, ratings and watchlist over', 'data-act="setsheet" data-s="import"')}</div>
        <div class="e-group"><span class="m-label">Account</span>
          <div class="e-row">${ic('google-logo')}<span class="e-row__body"><b>Google</b><span class="sub">Signed in as dani@example.com</span></span><span class="sub">Connected</span></div>
          ${row(ic('ticket'), 'Invites', '3 left. See who joined', 'data-go="#/invites"')}
          ${row(ic('crown-simple'), 'Membership', 'Premium. Your subscription and billing', 'data-act="setsheet" data-s="member"')}</div>
        <div class="e-group">
          ${row(ic('sign-out'), 'Sign out', '', 'data-act="signout"', '')}
          ${row(ic('trash'), 'Delete account', '', 'data-act="setsheet" data-s="delete"', '', ' e-row--danger')}</div>
      </div>`;
  }
  function setSheet(st) {
    const s = st.setsheet, f = s.fresh, done = '<button class="k-btn k-btn--primary k-btn--block" data-act="setclose">Done</button>';
    const body = s.id === 'colour' ? `<div class="gs-confirm"><h2 class="kino-display-m">Your colour</h2><p class="s-sub">Friends see your dot in it: on votes, scores and in groups. On your own screens you're always Tomato.</p></div>
        ${colourPick('How others see you')}${done}`
      : s.id === 'privacy' ? `<div class="gs-confirm"><h2 class="kino-display-m">Who sees your rankings</h2><p class="s-sub">Your rankings, takes and taste. People in your groups always see the picks you make together.</p></div>
        <div class="gs-list" role="radiogroup" aria-label="Who sees your rankings">${Object.entries(PRIV).map(([id, [l, sub]]) => `<button class="gs-row set-opt" role="radio" aria-checked="${(st.priv || 'everyone') === id}" data-act="priv" data-p="${id}"><span><b>${l}</b><span class="sub">${sub}</span></span>${ic('check')}</button>`).join('')}</div>${done}`
      : s.id === 'import' ? (s.done ? `<div class="gs-confirm"><span class="set-mark">${ic('check')}</span><h2 class="kino-display-m">Your films are in</h2><p class="s-sub">248 films, and 31 on your watchlist. Your Letterboxd stars are a starting point: rank them head to head whenever you like.</p></div>${done}`
        : `<div class="gs-confirm"><span class="set-mark">${ic('download-simple')}</span><h2 class="kino-display-m">Import from Letterboxd</h2><p class="s-sub">Export your data from your Letterboxd settings, then choose the file here. Your films, ratings and watchlist come over.</p></div>
          <button class="k-btn k-btn--primary k-btn--block" data-act="import">Choose your Letterboxd export</button><button class="k-btn k-btn--ghost k-btn--block" data-act="setclose">Not now</button>`)
      : s.id === 'member' ? `<div class="gs-confirm"><span class="set-mark">${ic('crown-simple')}</span><h2 class="kino-display-m">Premium</h2><p class="s-sub">Your subscription and billing.</p></div>
        <div class="gs-list"><button class="gs-row"><b>Manage billing</b><span class="sub">Payment method and receipts</span></button><button class="gs-row"><b>Change plan</b><span class="sub">Switch or cancel any time</span></button></div>${done}`
      : `<div class="gs-confirm">${avatar('you', 'lg')}<h2 class="kino-display-m">Delete your account?</h2><p class="s-sub">Your rankings, takes and the groups you started go for good. Friends keep the picks you made together.</p></div>
        <button class="k-btn k-btn--danger k-btn--block" data-act="delete">Delete account</button><button class="k-btn k-btn--ghost k-btn--block" data-act="setclose">Keep my account</button>`;
    return `<div class="app__overlay${f ? '' : ' app__overlay--still'}" data-act="soverlay"><div class="app__sheet app__sheet--fit gs set-sheet${f ? '' : ' app__sheet--still'}" role="dialog" aria-label="Settings">${body}</div></div>`;
  }
  const applyTheme = t => { const th = t === 'device' ? (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : t;
    document.documentElement.dataset.theme = th; try { if (t === 'device') localStorage.removeItem('kino-ds-theme'); else localStorage.setItem('kino-ds-theme', th); } catch (e) { /* private mode */ } };

  // Invites: your link, what's left, and who joined through you
  const INVITED = [['lena', 'Joined in August', 'Ranked 12 films'], ['rui', 'Joined last week', 'Ranked 3 films'], ['mo', 'Invited 2 days ago', '']];
  function invites(st) {
    return `${topbar('Invites', { back: true })}
      <div class="s-narrow e-form inv">
        <div class="wide-only">${webBack}<h1 class="s-title">Invites</h1></div>
        <div class="m-card inv-card">${cluster(['maya', 'jo', 'ari', 'sam'], 56)}<h2 class="kino-display-m">Bring your people</h2><p class="s-sub">Kino gets better with the friends you watch with. You have 3 invites left.</p>
          <div class="inv-link"><span>kino.app/i/dani</span><button class="k-btn k-btn--ghost k-btn--sm" data-act="copy">${ic(st.copied ? 'check' : 'copy')}${st.copied ? 'Copied' : 'Copy'}</button></div>
          <button class="k-btn k-btn--accent k-btn--block">${ic('share-network')}Share your invite</button></div>
        <div class="e-group"><span class="m-label">Who you've invited</span>
          ${INVITED.map(([p, when, what]) => what ? `<div class="e-row"><button class="pp-row__main" data-go="${pf(p)}">${avatar(p)}<span class="e-row__body"><b>${P[p].full || P[p].n}</b><span class="sub">${when} · ${what}</span></span></button></div>`
            : `<div class="e-row">${avatar(p)}<span class="e-row__body"><b>${P[p].full || P[p].n}</b><span class="sub">${when}</span></span><button class="k-btn k-btn--secondary k-btn--sm">Remind</button></div>`).join('')}</div>
      </div>`;
  }

  // Signing in (picked A): a friend's favourite film behind you, credited. The onboarding workshop takes it further.
  // The still is a trailer thumbnail standing in for a real still; on the web it's cropped to the scene.
  const FAV = ['noor', 'hailmary'];
  function signin(st) {
    const v = st.si || 'back', other = v === 'other' || v === 'email', field = v === 'password' || v === 'email', [fp, fk] = FAV;
    return `<div class="si si--${st.siPlace || 'center'}" data-theme="dark">
      <img class="si__bg" src="stills/${STILLS[fk]}" alt="" decoding="async"><div class="si__shade"></div>${drift(st, other ? 'new' : 'back')}
      <button class="si__wm" data-act="si" data-v="back" aria-label="Kino">kino<i></i></button>
      <div class="si__body"><div class="si__who">
        ${other ? '<h1 class="si__title">Welcome to Kino</h1><p class="si__sub">Rank what you watch, and pick films with your people.</p>'
          : `${avatar('you', 'lg')}<h1 class="si__title">Welcome back, Dani</h1><p class="si__sub">@dani.watches</p>`}</div><div class="si__acts">
        ${field ? `<label class="k-field si__field"><span class="k-field__label">${other ? 'Email' : 'Password'}</span><span class="k-field__control"><input type="${other ? 'email' : 'password'}" placeholder="${other ? 'you@example.com' : 'Your password'}" autocomplete="off"></span></label>
            <button class="k-btn k-btn--primary k-btn--block" data-act="signin">${other ? 'Continue' : 'Sign in'}</button><button class="si__link" data-act="si" data-v="${other ? 'other' : 'back'}">Back</button>`
          : `<button class="k-btn k-btn--primary k-btn--block" data-act="signin">${ic('google-logo')}Continue with Google</button>
            <button class="k-btn k-btn--secondary k-btn--block" data-act="si" data-v="${other ? 'email' : 'password'}">${ic(other ? 'envelope-simple' : 'key')}${other ? 'Use email instead' : 'Use a password instead'}</button>
            ${other ? '<button class="si__link" data-act="ob-start">New here? <b>Join Kino</b></button>' : '<button class="si__link" data-act="si" data-v="other">Not Dani? Use another account</button>'}`}
      </div></div>
      <span class="si__cap">${P[fp].n}'s favourite: ${F[fk][0]}, ${F[fk][1]}</span></div>`;
  }

  /* ---------- onboarding (round 1 picked and critted 2026-10-10; notes in notes/onboarding-1.md) ----------
     Taste first for everyone; someone arriving through a friend's invite starts with that friend (the invite door).
     What drifts over the welcome's still (st.drift 'mix'): your friends when you're coming back; when you're new, colour dots carrying
     Kino's icons, with a few plain dots between (your note: "the color dots, with the icons on top"). 'faces', 'icons' or 'none' also work.
     On the web the words sit centred over one clean fade (st.siPlace 'center'). */
  const hash32 = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const DRIFT = { faces: ['maya', 'jo', 'ari', 'sam', 'noor', 'theo', 'lena', 'kai', 'rui'], icons: ['popcorn', 'heart', 'film-slate', 'ticket', 'star', 'users-three', 'smiley', 'bookmark-simple', 'chat-circle'] };
  const DRIFT_HUES = ['rose', 'amber', 'lagoon', 'citron', 'lilac', 'fern', 'orchid', 'sky', 'mint', 'periwinkle'];
  function drift(st, who) {
    const kind = st.drift === 'mix' ? (who === 'back' ? 'faces' : 'icons') : st.drift;
    if (!kind || kind === 'none') return '';
    const items = kind === 'icons' ? DRIFT.icons.flatMap((x, i) => (i % 3 === 1 ? [x, null] : [x])) : DRIFT.faces, n = items.length;
    return `<div class="drift drift--${kind}" aria-hidden="true">${items.map((x, i) => { const h = hash32((x || 'dot') + i), hue = DRIFT_HUES[i % DRIFT_HUES.length];
      const body = kind === 'faces' ? avatar(x) : x ? `<span class="drift__dot id-${hue}">${ic(x)}</span>` : `<span class="drift__dot drift__dot--plain id-${hue}"></span>`;
      return `<span class="drift__i" style="--x:${((i + .5) / n * 100).toFixed(1)}%;--y:${10 + (h >> 2) % 30}%;--dur:${20 + h % 12}s;--delay:-${(h >> 3) % 20}s;--sway:${(h % 2 ? 1 : -1) * (6 + (h >> 5) % 12)}px;--sc:${(.78 + ((h >> 7) % 5) / 10).toFixed(2)}"><span class="drift__in">${body}</span></span>`; }).join('')}</div>`;
  }
  // A new person's first screen: the same still and drift, Kino in a line, and two ways in
  function welcome(st) {
    const fk = FAV[1];
    return `<div class="si si--${st.siPlace || 'center'}" data-theme="dark">
      <img class="si__bg" src="stills/${STILLS[fk]}" alt="" decoding="async"><div class="si__shade"></div>${drift(st, 'new')}
      <span class="si__wm">kino<i></i></span>
      <div class="si__body"><div class="si__who"><h1 class="si__title">Rank what you watch. Pick films together.</h1>
        <p class="si__sub">Kino learns your taste from a few quick choices, then helps your people agree on a film.</p></div>
        <div class="si__acts"><button class="k-btn k-btn--primary k-btn--block" data-act="ob-start">Get started</button>
        <button class="k-btn k-btn--secondary k-btn--block" data-act="ob-exit">I have an account</button></div></div>
      <span class="si__cap">${F[fk][0]}, ${F[fk][1]}</span></div>`;
  }

  // The join flow (st.ob). Taste first: tap what you've seen, three head-to-heads, your top 3, then save it, your name, your colour,
  // your people. The invite door: Maya's favourites, your match (the wow moment), keep it, your colour, your people, her group.
  const OB_FILMS = ['interstellar', 'spirited', 'parasite', 'darkknight', 'arrival', 'inception', 'budapest', 'dune', 'endgame', 'avengers', 'infinitywar', 'deadpool', 'toystory5', 'avatar3', 'spiderman', 'raccoon', 'odyssey', 'hailmary'];
  const OB_FLOWS = { taste: ['seen', 'vs', 'taste', 'account', 'name', 'colour', 'people'], friend: ['invite', 'vs', 'match', 'account', 'colour', 'people'] };
  const MAYA3 = ['spirited', 'budapest', 'parasite']; // Maya's top 3
  const obFresh = (o = {}) => Object.assign({ flow: 'taste', i: 0, seen: {}, vs: 0, wins: {}, fol: {} }, o);
  const obSteps = ob => OB_FLOWS[ob.flow] || OB_FLOWS.taste;
  const obSeen = ob => OB_FILMS.filter(k => ob.seen[k]);
  function obPairs(st) {
    const ob = st.ob, seen = obSeen(ob);
    if (ob.flow === 'friend') return [[MAYA3[0], 'interstellar'], [MAYA3[1], 'inception'], [MAYA3[2], 'arrival']];
    return seen.length >= 4 ? [[seen[0], seen[1]], [seen[2], seen[3]], [seen[0], seen[2]]] : [['arrival', 'interstellar'], ['parasite', 'inception'], ['spirited', 'dune']];
  }
  // Your first top 3: what you picked most in the head-to-heads, then your seen films in Kino's sample order
  function obTop(st) {
    const ob = st.ob, pool = [...new Set(obPairs(st).flat().concat(obSeen(ob)))];
    const sc = k => (ob.wins[k] || 0) * 10 + (MY[k] || 0);
    const top = pool.sort((a, b) => sc(b) - sc(a)).slice(0, 3);
    return top.length === 3 ? top : ['arrival', 'parasite', 'spirited'];
  }
  // A first line about your taste, from the genres you picked (sample wording)
  function obLine(st) {
    const g = {}; obTop(st).forEach(k => ((X[k] || {}).g || []).forEach(x => { g[x] = (g[x] || 0) + 1; }));
    const lead = Object.keys(g).sort((a, b) => g[b] - g[a])[0] || 'Drama';
    return { 'Science fiction': 'Drawn to big ideas and quiet science fiction', Animation: 'A soft spot for animation and big hearts', Action: 'Here for the spectacle, and for the people you watch it with',
      Comedy: 'Here for a laugh and a good night in', Thriller: 'Likes a film that keeps you guessing', Fantasy: 'Happiest somewhere else entirely' }[lead] || 'Patient with slow, human stories';
  }
  const tens = (n, g) => `<span class="ob-tens" role="img" aria-label="${Math.min(n, g)} of ${g}">${Array.from({ length: g }, (_, i) => `<span class="k-dot${i < n ? '' : ' k-dot--empty'}"></span>`).join('')}</span>`;
  const fan = ks => `<div class="ob-fan">${[ks[1], ks[0], ks[2]].map((k, i) => `<span style="--i:${i - 1}">${poster(k, 'm')}</span>`).join('')}</div>`; // #1 in the middle, like the podium
  // Your match with Maya: the pair a little smaller, the percentage the wow moment, counting up as the two dots meet
  const matchHero = small => `<div class="ob-match${small ? ' ob-match--sm' : ''}"><div class="ob-pair">${avatar('maya', small ? '' : 'lg')}${avatar('you', small ? '' : 'lg')}</div>
      <span class="ob-pct" aria-label="${MATCH.maya.pct}% taste match"><span data-count="${MATCH.maya.pct}" data-unit="%">${MATCH.maya.pct}%</span></span></div>`;
  const OB_STEP = {
    invite: () => `<div class="ob-hero ob-hero--center">${avatar('maya', 'xxl')}<h1 class="ob-title">Maya invited you to Kino</h1><p class="ob-sub">She runs Thursday film club. Pick between a few of her favourites and see how your taste matches hers.</p></div>
      ${fan(MAYA3)}<div class="ob-actions"><button class="k-btn k-btn--primary k-btn--block" data-act="ob-next">See how we match</button><button class="si__link ob-link" data-act="ob-exit">I have an account</button></div>`,
    account: st => { const friend = st.ob.flow === 'friend';
      return `<div class="ob-hero ob-hero--center">${friend ? matchHero(true) : fan(obTop(st))}
        <h1 class="ob-title">${friend ? 'Keep your match' : 'Save your taste'}</h1>
        <p class="ob-sub">${friend ? 'Save your match with Maya and join Thursday film club.' : 'Your top 3 and everything you rank stay yours, on every device.'}</p></div>
        <div class="ob-actions"><button class="k-btn k-btn--primary k-btn--block" data-act="ob-next">${ic('google-logo')}Continue with Google</button>
          <button class="k-btn k-btn--secondary k-btn--block" data-act="ob-next">${ic('envelope-simple')}Use email instead</button><p class="ob-fine">Kino never posts anything for you.</p></div>`; },
    name: () => `<div class="ob-hero"><h1 class="ob-title">What should we call you?</h1><p class="ob-sub">From your Google account. Change anything you like.</p></div>
      <div class="ob-fields"><label class="k-field"><span class="k-field__label">Name</span><span class="k-field__control"><input value="Dani Cho" autocomplete="off"></span></label>
        <label class="k-field"><span class="k-field__label">Username</span><span class="k-field__control"><span class="e-at">@</span><input value="dani.watches" autocomplete="off"></span><span class="k-field__help"><span>Your profile is kino.app/dani.watches</span></span></label></div>
      <div class="ob-actions"><button class="k-btn k-btn--primary k-btn--block" data-act="ob-next">Next</button></div>`,
    // The wall (picked): tap what you've seen and your dot drops onto the poster's bottom edge, like a vote. Swiping belongs to ranking later.
    seen: st => { const ob = st.ob, n = obSeen(ob).length, goal = 10;
      return `<div class="ob-hero"><h1 class="ob-title">Tap what you've seen</h1><p class="ob-sub">${n >= goal ? 'That\'s plenty to start your taste.' : `${goal - n} more and Kino can start to see your taste.`}</p></div>
        <div class="ob-wall">${OB_FILMS.map(k => `<button class="ob-film${ob.seen[k] ? ' is-seen' : ''}${fx(st, 'seen-' + k, ' is-new')}" data-act="ob-seen" data-k="${k}" aria-pressed="${!!ob.seen[k]}" aria-label="${F[k][0]}">${poster(k, 's')}<span class="ob-film__dot"></span></button>`).join('')}</div>
        <div class="ob-actions ob-actions--dock">${tens(n, goal)}<button class="k-btn k-btn--primary k-btn--block" data-act="ob-next"${n >= 3 ? '' : ' disabled'}>${n >= goal ? 'Next' : n >= 3 ? 'That\'s all I\'ve seen' : 'Pick at least three'}</button></div>`; },
    vs: st => { const ob = st.ob, pairs = obPairs(st), pair = pairs[Math.min(ob.vs, pairs.length - 1)];
      return `<div class="ob-hero ob-hero--center"><span class="sub">${ob.flow === 'friend' ? 'Maya\'s favourites' : 'Quick ones'} · ${Math.min(ob.vs + 1, pairs.length)} of ${pairs.length}</span><h1 class="ob-title">Which did you like more?</h1></div>
        <div class="r-versus ob-versus">${pair.map(k => `<button class="r-option" data-act="ob-vs" data-k="${k}">${poster(k, 'l')}<b>${F[k][0]}</b><span class="r-option__meta">${F[k][1]}</span></button>`).join('')}</div>
        <div class="ob-actions ob-actions--row"><button class="k-btn k-btn--ghost k-btn--sm" data-act="ob-vs" data-k="">Too close to call</button><button class="k-btn k-btn--ghost k-btn--sm" data-act="ob-vs" data-k="">Haven't seen one</button></div>`; },
    taste: st => { const n = obSeen(st.ob).length;
      return `<div class="ob-hero ob-hero--center"><span class="sub">${n ? `From ${n} films` : 'From your first choices'}</span><h1 class="ob-title">Your taste is starting to show</h1></div>
        <div class="ob-podium">${top3('you', { top: obTop(st), tap: false })}</div>
        <div class="ob-line"><span class="sub">Kino wrote this from your choices</span><p>${obLine(st)}</p></div>
        <div class="ob-actions"><button class="k-btn k-btn--primary k-btn--block" data-act="ob-next">Save my taste</button><p class="ob-fine">It sharpens with every film you rank. Your scores show up after 10.</p></div>`; },
    match: () => `<div class="ob-hero ob-hero--center">${matchHero(false)}<h1 class="ob-title">You and Maya think alike</h1><p class="ob-sub">${matchLine(MATCH.maya.pct)}.</p></div>
      ${fan(MAYA3)}<div class="ob-actions"><button class="k-btn k-btn--primary k-btn--block" data-act="ob-next">Save it and join her group</button></div>`,
    // Your colour, during sign-up (picked), with a word that it can change later. A name only appears when someone invited you.
    colour: st => `<div class="ob-hero"><h1 class="ob-title">Pick your colour</h1><p class="ob-sub">It's how friends see you: your dot on their votes, scores and groups. On your own screens you're always Tomato.</p></div>
      ${colourPick(st.ob.flow === 'friend' ? 'How Maya sees you' : 'How others see you')}
      <div class="ob-actions"><button class="k-btn k-btn--primary k-btn--block" data-act="ob-next">Next</button><p class="ob-fine">You can change it any time in Settings.</p></div>`,
    people: st => `<div class="ob-hero"><h1 class="ob-title">Find your people</h1><p class="ob-sub">${st.ob.flow === 'friend' ? 'You\'re in Thursday film club with Maya, Jo and Ari.' : 'A few friends are already here. Follow them to see what they watch.'}</p></div>
      <div class="ob-people">${['maya', 'jo', 'ari', 'sam'].map(p => { const on = !!st.ob.fol[p] || (st.ob.flow === 'friend' && p === 'maya' && st.ob.fol[p] !== false);
        return `<div class="e-row">${avatar(p)}<span class="e-row__body"><b>${P[p].full}</b><span class="sub">${p === 'maya' && st.ob.flow === 'friend' ? 'Invited you' : MATCH[p] ? `${MATCH[p].pct}% taste match` : 'On Kino'}</span></span><button class="k-btn ${on ? 'k-btn--secondary' : 'k-btn--primary'} k-btn--sm" data-act="ob-follow" data-p="${p}" aria-pressed="${on}">${on ? 'Following' : 'Follow'}</button></div>`; }).join('')}</div>
      <button class="k-btn k-btn--secondary k-btn--block">${ic('link-simple')}Invite friends with a link</button>
      <div class="ob-actions"><button class="k-btn k-btn--accent k-btn--block" data-act="ob-done">${st.ob.flow === 'friend' ? 'Go to Thursday film club' : 'Start watching'}</button></div>`,
  };
  // The colour swatches and "how others see you", shared by sign-up and Settings
  const colourPick = label => `<div class="set-hues" role="radiogroup" aria-label="Your colour">${HUES.map(h => `<button class="set-hue id-${h}" role="radio" aria-checked="${P.you.h === h}" aria-label="${cap(h)}" data-act="hue" data-h="${h}"><span class="k-dot"></span></button>`).join('')}</div>
      <div class="set-preview"><span class="sub">${label}</span><div class="set-preview__row">${avatar('you')}<span class="e-row__body"><b>Dani Cho</b><span class="sub">Ranked Arrival</span></span><span class="k-score id-${P.you.h}"><span class="k-dot"></span><span class="k-score__num">9.6</span></span></div></div>`;
  function join(st) {
    st.ob = obFresh(st.ob || {}); // fills in anything a board's state leaves out
    const ob = st.ob, steps = obSteps(ob), step = steps[Math.min(ob.i, steps.length - 1)];
    return `<div class="ob ob--${step}">
      <div class="ob-head"><button class="k-iconbtn k-iconbtn--ghost k-iconbtn--sm" data-act="ob-back" aria-label="Back">${ic('caret-left')}</button><span class="r-steps" aria-label="Step ${ob.i + 1} of ${steps.length}">${steps.map((x, i) => `<span class="k-dot${i <= ob.i ? '' : ' k-dot--empty'}"></span>`).join('')}</span><span style="width:36px"></span></div>
      <div class="ob-body">${OB_STEP[step](st)}</div></div>`;
  }

  /* ---------- the missing pieces, round 1 (2026-10-10): from the V0 inventory, built live for the workshop ----------
     Each piece has my pick and an alternative, switched by a flag so the sheet can show both:
     st.pickStyle 'shelves' | 'wall' · st.afterRank 'stay' | 'two' · st.gnewStyle 'who' | 'name' · st.diaryStyle 'list' | 'calendar'
     st.listStyle 'pile' | 'mosaic' · st.peopleStyle 'page' | 'sheet' · st.threadStyle 'sheet' | 'inline' */
  const sheetWrap = (o, close, label, body, cls = '') => `<div class="app__overlay${o.fresh ? '' : ' app__overlay--still'}" data-act="${close}"><div class="app__sheet app__sheet--fit gs ${cls}${o.fresh ? '' : ' app__sheet--still'}" role="dialog" aria-label="${label}">${body}</div></div>`;
  const sheetHead = (title, close) => `<div class="sh-head"><button class="k-iconbtn k-iconbtn--ghost k-iconbtn--sm" data-act="${close}" aria-label="Close">${ic('x')}</button><span>${title}</span><span style="width:36px"></span></div>`;

  // 1 · Rank a film: which one? (V0's "Choose a film you've seen", search, "Seen one of these?"). Also used to log a watch or fill a list.
  const unrankedFilms = st => Object.keys(F).filter(k => MY[k] == null && st.ranked[k] == null);
  const pickVerb = r => (r.mode === 'log' ? 'Log' : r.mode === 'list' ? 'Add' : 'Rank');
  function pickResults(st) {
    const r = st.rpick, q = (r.q || '').trim().toLowerCase(); if (!q) return '';
    const hits = Object.keys(F).filter(k => (F[k][0] + ' ' + F[k][2]).toLowerCase().includes(q)).slice(0, 8);
    return hits.length ? hits.map(k => { const mine = st.ranked[k] ?? MY[k];
      return `<button class="rp-row" data-act="rp-pick" data-k="${k}">${poster(k, 'xs')}<span class="rp-row__t"><b>${F[k][0]}</b><span>${F[k][1]} · ${F[k][2]}</span></span>${mine != null && r.mode !== 'list' ? `<span class="rp-row__end">${score('you', mine)}</span>` : `<span class="rp-row__go">${pickVerb(r)}</span>`}</button>`; }).join('')
      : `<p class="sub rp-none">Nothing called "${r.q.trim()}" yet.</p>`;
  }
  function rankPick(st) {
    const r = st.rpick, un = unrankedFilms(st), wall = st.pickStyle === 'wall', lst = r.mode === 'list' ? allLists(st).find(l => l.id === r.list) : null;
    const pool = r.mode === 'rank' ? un : Object.keys(F), title = r.mode === 'log' ? 'Log a watch' : lst ? `Add to ${lst.name}` : 'Rank a film';
    const watched = (st.toRank || ['interstellar', 'odyssey', 'coyote', 'residentevil']).filter(k => pool.includes(k));
    const tileP = k => `<button class="rp-film" data-act="rp-pick" data-k="${k}">${poster(k, 'm')}<b>${F[k][0]}</b><span>${F[k][1]}</span></button>`;
    const shelf = (label, ks) => (ks.length ? `<div class="rp-shelf"><span class="m-label">${label}</span><div class="rp-shelf__row">${ks.map(tileP).join('')}</div></div>` : '');
    const browse = wall ? `<span class="m-label">Seen one of these?</span><div class="ob-wall rp-wall">${pool.filter(k => !['pastlives', 'perfectdays', 'aftersun', 'mood', 'shoplifters', 'paddington', 'holdovers', 'portrait', 'columbus', 'challengers', 'eeaao', 'onebattle', 'sinners', 'anora', 'brutalist', 'conclave', 'flow'].includes(k)).slice(0, 12).map(k => `<button class="ob-film" data-act="rp-pick" data-k="${k}" aria-label="${F[k][0]}">${poster(k, 's')}</button>`).join('')}</div>`
      : (() => { const seen = new Set(), fresh = ks => ks.filter(k => pool.includes(k) && !seen.has(k) && seen.add(k)); // each film shows once, on its first shelf
          return shelf('You watched these lately', fresh(watched)) + shelf('On your watchlist', fresh(watchlist(st))) + shelf('Out recently', fresh(RECENT)) + shelf('Your friends love', fresh(['spirited', 'budapest', 'parasite', 'arrival', 'dune', 'pastlives', 'aftersun', 'perfectdays'])); })();
    return sheetWrap(r, 'rpoverlay', title, `${sheetHead(title, 'rpclose')}
      <label class="k-search">${ic('magnifying-glass')}<input type="search" placeholder="Search films and directors" aria-label="Search films" data-input="rpq" value="${r.q || ''}"></label>
      <div class="rp-results">${pickResults(st)}</div><div class="rp-browse"${(r.q || '').trim() ? ' hidden' : ''}>${browse}</div>`, 'rp');
  }

  // 3 · Making a group: pick friends first and watch the bundle form, then name it (st.gnewStyle 'who', mine), or name it first ('name').
  // Joining with a code: find the group, see who's in it, join.
  const GFRIENDS = ['maya', 'jo', 'ari', 'sam', 'noor', 'theo', 'lena', 'kai', 'rui'];
  const gnPeople = st => { const g = st.gnew, q = (g.q || '').trim().toLowerCase(), shown = GFRIENDS.filter(p => !q || (P[p].full || P[p].n).toLowerCase().includes(q));
    return shown.length ? shown.map(p => `<button class="gn-p${g.who[p] ? ' is-on' : ''}" data-act="gn-who" data-p="${p}" aria-pressed="${!!g.who[p]}">${avatar(p, 'lg')}<span>${P[p].n}</span></button>`).join('') : `<p class="sub gn-none">No friends called "${g.q.trim()}"</p>`; };
  const allGroups = st => [...(st.newGroups || []), ...GROUPS];
  const gSuggest = picked => { const n = picked.map(p => P[p].n); return !n.length ? 'Friday film club' : n.length <= 2 ? `${n.join(', ')} and you` : `${n.slice(0, 2).join(', ')} and ${n.length - 2} more`; };
  function groupNew(st) {
    const g = st.gnew, order = st.gnewStyle === 'name' ? ['name', 'who', 'share'] : ['who', 'name', 'share'], step = order[g.i || 0];
    const picked = GFRIENDS.filter(p => g.who[p]), bundle = `<span class="gn-bundle">${cluster(['you', ...picked], 80)}</span>`;
    const suggest = gSuggest(picked);
    const name = g.name ?? suggest, last = order[(g.i || 0) + 1] === 'share';
    const body = step === 'who' ? `<div class="gs-confirm">${bundle}<h2 class="kino-display-m">Who's in?</h2><p class="s-sub">${picked.length ? `${picked.length + 1} of you so far. Anyone else can join with a link.` : 'Tap your friends. Anyone else can join with a link.'}</p></div>
        ${GFRIENDS.length > 8 ? `<label class="k-search gn-search">${ic('magnifying-glass')}<input type="search" placeholder="Search your friends" aria-label="Search your friends" data-input="gq" value="${g.q || ''}"></label>` : ''}
        <div class="gn-people">${gnPeople(st)}</div>
        <button class="k-btn k-btn--primary k-btn--block" data-act="gn-next"${picked.length ? '' : ' disabled'}>${last ? 'Create group' : 'Next'}</button>`
      : step === 'name' ? `<div class="gs-confirm">${bundle}<h2 class="kino-display-m">Name it</h2><p class="s-sub">Anyone in the group can change it later.</p></div>
        <label class="k-field"><span class="k-field__label">Group name</span><span class="k-field__control"><input data-input="gname" value="${name}" autocomplete="off"></span></label>
        <button class="k-btn k-btn--primary k-btn--block" data-act="gn-next">${last ? 'Create group' : 'Next'}</button>`
      : `<div class="gs-confirm">${bundle}<h2 class="kino-display-m">${name} is ready</h2><p class="s-sub">${names(picked)} will get an invite. Anyone else can join with the code.</p></div>
        <div class="gn-code"><span class="sub">Group code</span><b>KINO 7Q4F</b><button class="k-btn k-btn--ghost k-btn--sm">${ic('copy')}Copy</button></div>
        <button class="k-btn k-btn--secondary k-btn--block">${ic('share-network')}Share an invite link</button><button class="k-btn k-btn--accent k-btn--block" data-act="gn-done">Go to the group</button>`;
    return sheetWrap(g, 'gnoverlay', 'New group', `${sheetHead('New group', 'gnclose')}${body}`, 'gn');
  }
  function groupJoin(st) {
    const j = st.gjoin;
    return sheetWrap(j, 'gjoverlay', 'Join with a code', `${sheetHead('Join a group', 'gjclose')}<div class="gs-confirm"><span class="set-mark">${ic('ticket')}</span><h2 class="kino-display-m">Got a code?</h2><p class="s-sub">Ask anyone in the group for its code.</p></div>
      <label class="k-field${j.bad ? ' k-field--error' : ''}"><span class="k-field__label">Group code</span><span class="k-field__control"><input data-input="gcode" placeholder="KINO 7Q4F" value="${j.code || ''}" autocomplete="off"></span>${j.bad ? '<span class="k-field__help">That code doesn\'t open a group. Check it with whoever sent it.</span>' : ''}</label>
      ${j.found ? `<div class="gj-found">${cluster(['theo', 'lena', 'kai'], 56)}<span class="e-row__body"><b>Sunday matinee</b><span class="sub">Theo, Lena and Kai · started by Theo</span></span></div>` : ''}
      <button class="k-btn k-btn--primary k-btn--block" data-act="gj-go"${j.found || (j.code || '').trim().length >= 4 ? '' : ' disabled'}>${j.found ? 'Join Sunday matinee' : 'Find the group'}</button>`, 'gj');
  }
  // A group you just made or joined, before its first pick
  function groupStart(st, g) {
    const mine = g.by === 'you', waiting = mine ? g.who.filter(p => p !== 'you') : [];
    return `${topbar(g.name, { back: true, end: iconbtn('dots-three', 'Group options') })}<div class="wide-only s-pagenav">${webBack}</div>
      <div class="s-narrow gst"><div class="gs-confirm">${cluster(g.who, 104)}<h1 class="s-title">${g.name}</h1>
        <p class="s-sub">${mine ? `You started it just now. Waiting for ${names(waiting)} to join.` : `${P[g.by].n} started it. You're in, with ${names(g.who.filter(p => p !== 'you' && p !== g.by))}.`}</p></div>
        <div class="m-card gst-next"><h3>No pick yet</h3><p class="s-sub">Suggest a film and everyone votes. Kino adds a few the whole group is likely to love.</p><button class="k-btn k-btn--accent k-btn--block">${ic('popcorn')}Suggest the first film</button></div>
        ${mine ? `<div class="gn-code"><span class="sub">Group code</span><b>KINO 7Q4F</b><button class="k-btn k-btn--ghost k-btn--sm">${ic('copy')}Copy</button></div>` : ''}</div>`;
  }

  // 4 · Diary: every watch, newest first, with the day as a big quiet number (st.diaryStyle 'list', mine), or a month calendar of posters
  const DIARY = [['2026-10-09', 'interstellar', { where: 'At home' }], ['2026-10-08', 'odyssey', { with: ['maya', 'jo'] }], ['2026-10-03', 'coyote', { where: 'At the cinema' }],
    ['2026-09-30', 'residentevil', {}], ['2026-09-27', 'arrival', { rewatch: true }], ['2026-09-20', 'inception', { group: 'Sci-fi Saturdays' }], ['2026-09-12', 'budapest', { with: ['maya'] }],
    ['2026-08-30', 'dune', { group: 'Film school reunion' }], ['2026-08-22', 'parasite', {}], ['2026-08-09', 'spirited', { rewatch: true, with: ['maya'] }]];
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const dParts = d => { const [y, m, dd] = d.split('-').map(Number), dt = new Date(y, m - 1, dd); return { y, m: m - 1, d: dd, wd: DAYS[dt.getDay()], first: new Date(y, m - 1, 1).getDay(), len: new Date(y, m, 0).getDate() }; };
  const diaryAll = st => [...(st.logged || []), ...DIARY];
  function diaryMeta(o) { const bits = []; if (o.rewatch) bits.push('Rewatch'); if (o.with && o.with.length) bits.push(`With ${names(o.with)}`); if (o.group) bits.push(o.group); if (o.where && !bits.length) bits.push(o.where); return bits.join(' · '); }
  function diary(st) {
    const all = diaryAll(st), byMonth = []; all.forEach(e => { const m = dParts(e[0]).m; let g = byMonth.find(x => x.m === m); if (!g) byMonth.push(g = { m, es: [] }); g.es.push(e); });
    const head = `<div class="dy-head"><span class="sub">${all.length} watches since August</span><button class="k-btn k-btn--secondary k-btn--sm" data-act="logopen">${ic('plus')}Log a watch</button></div>`;
    const end = k => { const s = st.ranked[k] ?? MY[k]; return s != null ? score('you', s) : `<button class="k-btn k-btn--ghost k-btn--sm" data-rank="${k}">${ic('plus')}Rank it</button>`; };
    if (st.diaryStyle === 'calendar') return head + byMonth.map(({ m, es }) => { const p0 = dParts(es[0][0]), on = {}; es.forEach(e => { on[dParts(e[0]).d] = e[1]; });
      return `<section class="mf-feel"><p class="mf-cap">${MONTHS[m]}<span>${es.length}</span></p><div class="dy-cal">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(x => `<span class="dy-cal__h">${x}</span>`).join('')}${Array.from({ length: (p0.first + 6) % 7 }, () => '<span></span>').join('')}${Array.from({ length: p0.len }, (_, i) => on[i + 1] ? `<button class="dy-cal__d is-on" data-go="#/film/${on[i + 1]}" aria-label="${F[on[i + 1]][0]}, ${MONTHS[m]} ${i + 1}">${poster(on[i + 1], 'xs')}<span>${i + 1}</span></button>` : `<span class="dy-cal__d">${i + 1}</span>`).join('')}</div></section>`; }).join('');
    return head + byMonth.map(({ m, es }) => `<section class="mf-feel"><p class="mf-cap">${MONTHS[m]}<span>${es.length}</span></p><div class="dy-list">${es.map(([d, k, o]) => { const p0 = dParts(d);
      return `<div class="dy-row"><span class="dy-day"><b>${p0.d}</b><span>${p0.wd}</span></span><button class="dy-row__main" data-go="#/film/${k}">${poster(k, 'xs')}<span class="dy-row__t"><b>${F[k][0]}</b><span>${diaryMeta(o) || `${F[k][1]} · ${F[k][2]}`}</span></span></button><span class="dy-row__end">${end(k)}</span></div>`; }).join('')}</div></section>`).join('');
  }
  function logSheet(st) {
    const l = st.logsheet, k = l.k, ranked = (st.ranked[k] ?? MY[k]) != null;
    return sheetWrap(l, 'lgoverlay', 'Log a watch', `${sheetHead('Log a watch', 'lgclose')}
      <div class="lg-film">${poster(k, 'm')}<div><b>${F[k][0]}</b><span class="sub">${F[k][1]} · ${F[k][2]}</span></div></div>
      <div class="lg-field"><span class="m-label">When</span><div class="chips">${['Today', 'Yesterday', 'Earlier'].map(w => `<button class="k-chip" aria-pressed="${l.when === w}" data-act="lg-when" data-w="${w}">${w}</button>`).join('')}</div></div>
      <div class="lg-field"><span class="m-label">Who with</span><div class="lg-who">${['maya', 'jo', 'ari', 'sam'].map(p => `<button class="gn-p${l.who[p] ? ' is-on' : ''}" data-act="lg-who" data-p="${p}" aria-pressed="${!!l.who[p]}">${avatar(p)}<span>${P[p].n}</span></button>`).join('')}</div></div>
      <div class="e-row lg-re"><span class="e-row__body"><b>A rewatch</b><span class="sub">${ranked ? 'You\'ve ranked it before' : 'You\'ve seen it before'}</span></span><button class="k-switch" role="switch" aria-checked="${!!l.rewatch}" aria-label="A rewatch" data-act="lg-rewatch"><span></span></button></div>
      <button class="k-btn k-btn--primary k-btn--block" data-act="lg-save">Log it</button>${ranked ? '' : '<button class="k-btn k-btn--secondary k-btn--block" data-act="lg-save" data-then="rank">Log it and rank it</button>'}`, 'lg');
  }

  // 5 · Lists: covers as little piles of posters, like Explore's (st.listStyle 'pile', mine), or a two-by-two mosaic
  const LISTS = [{ id: 'comfort', name: 'Comfort rewatches', films: ['spirited', 'budapest', 'arrival', 'inception', 'toystory5'], note: 'Only you' },
    { id: 'maya', name: 'To watch with Maya', films: ['hailmary', 'odyssey', 'avatar3', 'coyote'], note: 'Shared with Maya' },
    { id: 'big', name: 'Big screen only', films: ['interstellar', 'dune', 'odyssey', 'avatar3', 'darkknight', 'endgame'], note: 'Anyone can see it' }];
  const allLists = st => (st.lists = st.lists || LISTS.map(l => Object.assign({}, l, { films: l.films.slice() })));
  // Each pile is dealt its own way from its name: a little rotation and offset per card, and its own fan on hover or press
  function pileCards(l) {
    return l.films.slice(0, 5).map((k, i) => { const h = hash32(l.id + i), side = i === 0 ? 0 : (i % 2 ? -1 : 1) * Math.ceil(i / 2);
      const r = (side * 6 + ((h % 7) - 3) * .9).toFixed(1), x = (side * 20 + ((h >> 3) % 9 - 4)).toFixed(0), y = (Math.abs(side) * 4 + (h >> 5) % 4).toFixed(0);
      const hr = (side * 10 + ((h >> 7) % 9 - 4) * 1.2).toFixed(1), hx = (side * 34 + ((h >> 9) % 13 - 6)).toFixed(0), hy = (Math.abs(side) * 2 - 6 - (h >> 11) % 6).toFixed(0);
      return `<span style="--i:${i};--r:${r}deg;--x:${x}px;--y:${y}px;--hr:${hr}deg;--hx:${hx}px;--hy:${hy}px">${poster(k, 's')}</span>`; }).join('');
  }
  function listsView(st) {
    const all = allLists(st), edit = !!st.lsEdit;
    const cover = l => (st.listStyle === 'mosaic' ? `<span class="ls-mosaic">${[0, 1, 2, 3].map(i => l.films[i] ? poster(l.films[i], 's') : '<span class="ls-mosaic__empty"></span>').join('')}</span>`
      : `<span class="ls-pile">${l.films.length ? pileCards(l) : '<span class="ls-pile__empty">' + ic('plus') + '</span>'}</span>`);
    return `<div class="dy-head"><span class="sub">${all.length} lists${edit ? ' · tap one to change it' : ''}</span><span class="ls-tools">
        <button class="k-btn k-btn--${edit ? 'primary' : 'ghost'} k-btn--sm" data-act="lsedit" aria-pressed="${edit}">${edit ? 'Done' : `${ic('pencil-simple')}Edit`}</button>
        <button class="k-btn k-btn--secondary k-btn--sm" data-act="lsnew">${ic('plus')}New list</button></span></div>
      <div class="ls-grid${edit ? ' is-editing' : ''}${st.fx === 'ls-fan' ? ' is-fanning' : st.fx === 'ls-fold' ? ' is-folding' : ''}">${all.map(l => `<div class="ls-item"><button class="ls-card" ${edit ? `data-act="lsopt" data-l="${l.id}"` : `data-go="#/list/${l.id}"`} data-list="${l.id}">${cover(l)}<b>${l.name}</b><span>${nfilms(l.films.length)} · ${l.note}</span></button>
        ${edit ? `<button class="ls-opt" data-act="lsopt" data-l="${l.id}" aria-label="Change ${l.name}">${ic('dots-three')}</button>` : ''}</div>`).join('')}</div>`;
  }
  function listPage(st, id) {
    const l = allLists(st).find(x => x.id === id) || allLists(st)[0];
    if (!l) return `${topbar('', { back: true })}<div class="mf"><div class="wide-only">${webBack}</div><p class="sub mf-none">This list is gone.</p></div>`;
    const more = `<button class="k-iconbtn k-iconbtn--ghost k-iconbtn--sm" data-act="lsopt" data-l="${l.id}" aria-label="Change this list">${ic('dots-three')}</button>`;
    return `${topbar('', { back: true, end: iconbtn('share-network', 'Share list') + more })}
      <div class="mf"><div><div class="wide-only">${webBack}</div><div class="s-head ls-head"><div><h1 class="s-title">${l.name}</h1><p class="s-sub">${nfilms(l.films.length)} · ${l.note}</p></div><span class="wide-only">${more}</span></div></div>
        <div><button class="k-btn k-btn--secondary k-btn--sm" data-act="lsadd" data-l="${l.id}">${ic('plus')}Add films</button></div>
        ${l.films.length ? `<div class="mf-grid">${l.films.map((k, i) => filmTile(k, `<span>${F[k][1]}</span>`, i)).join('')}</div>` : '<p class="sub mf-none">Nothing here yet. Add a few films.</p>'}</div>`;
  }
  // A list's options: rename it, choose who sees it, or delete it (asks once, with Undo after)
  function listOpt(st) {
    const o = st.lsopt, l = allLists(st).find(x => x.id === o.id); if (!l) return '';
    const body = o.step === 'delete' ? `<div class="gs-confirm"><span class="ls-pile ls-pile--sm">${pileCards(l)}</span><h2 class="kino-display-m">Delete ${l.name}?</h2><p class="s-sub">The films stay in your rankings and your watchlist.</p></div>
        <button class="k-btn k-btn--danger k-btn--block" data-act="lso-delete">Delete list</button><button class="k-btn k-btn--ghost k-btn--block" data-act="lso-edit">Keep it</button>`
      : `${sheetHead('Change list', 'lsoclose')}<span class="ls-pile ls-pile--sm">${l.films.length ? pileCards(l) : ''}</span>
        <label class="k-field"><span class="k-field__label">Name</span><span class="k-field__control"><input data-input="lsoname" value="${o.name ?? l.name}" autocomplete="off"></span></label>
        <div class="lg-field"><span class="m-label">Who can see it</span><div class="chips">${['Only you', 'Friends', 'Anyone'].map(w => `<button class="k-chip" aria-pressed="${(o.vis ?? l.note) === w}" data-act="lso-vis" data-w="${w}">${w}</button>`).join('')}</div></div>
        <button class="k-btn k-btn--primary k-btn--block" data-act="lso-save">Save</button><button class="k-btn k-btn--ghost k-btn--block ls-del" data-act="lso-ask">${ic('trash')}Delete list</button>`;
    return sheetWrap(o, 'lsooverlay', `Change ${l.name}`, body, 'lso');
  }
  function listNew(st) {
    const n = st.lsnew;
    return sheetWrap(n, 'lsoverlay', 'New list', `${sheetHead('New list', 'lsclose')}
      <label class="k-field"><span class="k-field__label">Name</span><span class="k-field__control"><input data-input="lsname" placeholder="Films for a rainy Sunday" value="${n.name || ''}" autocomplete="off"></span></label>
      <div class="lg-field"><span class="m-label">Who can see it</span><div class="chips">${['Only you', 'Friends', 'Anyone'].map(w => `<button class="k-chip" aria-pressed="${(n.vis || 'Only you') === w}" data-act="ls-vis" data-w="${w}">${w}</button>`).join('')}</div></div>
      <button class="k-btn k-btn--primary k-btn--block" data-act="ls-create"${(n.name || '').trim() ? '' : ' disabled'}>Create list</button>`, 'ls');
  }

  // 6 · People: your friends, followers and following, and finding people (st.peopleStyle 'page', mine, or 'sheet' from your profile)
  const FRIENDS = ['maya', 'jo', 'ari', 'sam', 'noor', 'theo', 'lena', 'kai', 'rui'];
  const PTABS = [['friends', 'Friends', 41], ['followers', 'Followers', 52], ['following', 'Following', 47]];
  function peopleRows(st) {
    const tab = st.pplTab || 'friends', q = (st.pq || '').trim().toLowerCase();
    const list = tab === 'friends' ? FRIENDS : tab === 'followers' ? [...FRIENDS, 'ines', 'wren'] : [...FRIENDS, 'jules', 'omar'];
    const rows = list.filter(p => !q || (P[p].full || P[p].n).toLowerCase().includes(q));
    return rows.length ? rows.map(p => `<div class="e-row pp-row"><button class="pp-row__main" data-go="${pf(p)}">${avatar(p)}<span class="e-row__body"><b>${P[p].full || P[p].n}</b><span class="sub">${MATCH[p] ? MATCH[p].pct + '% taste match' : P[p].followers ? P[p].followers + ' followers' : 'Friends since spring'}</span></span></button>${followBtn(st, p)}</div>`).join('')
      : `<p class="sub rp-none">No one called "${st.pq.trim()}".</p>`;
  }
  const peopleTabs = st => `<div class="m-seg" role="tablist">${PTABS.map(([id, l, n]) => `<button role="tab" aria-selected="${(st.pplTab || 'friends') === id}" data-act="pptab" data-t="${id}">${l} ${n}</button>`).join('')}</div>`;
  function people(st) {
    return `${topbar('People', { back: true })}
      <div class="s-narrow pp"><div class="wide-only">${webBack}<h1 class="s-title">People</h1></div>${peopleTabs(st)}
        <label class="k-search">${ic('magnifying-glass')}<input type="search" placeholder="Search people" aria-label="Search people" data-input="pq" value="${st.pq || ''}"></label>
        <div class="pp-list">${peopleRows(st)}</div>
        <section class="m-card pp-find"><div class="m-section-head"><h3>Find your people</h3><button class="k-btn k-btn--ghost k-btn--sm" data-go="#/invites">${ic('link-simple')}Invite</button></div>
          <span class="sub">People you might know, from your contacts and friends of friends</span>
          ${['ines', 'kofi', 'wren'].map(p => `<div class="e-row pp-row"><button class="pp-row__main" data-go="${pf(p)}">${avatar(p)}<span class="e-row__body"><b>${P[p].full}</b><span class="sub">${p === 'ines' ? 'Followed by Jo' : p === 'wren' ? 'Followed by Ari' : 'In your contacts'}</span></span></button>${followBtn(st, p)}</div>`).join('')}</section></div>`;
  }
  const peopleSheet = st => sheetWrap(st.ppsheet, 'ppoverlay', 'People', `${sheetHead('People', 'ppclose')}${peopleTabs(st)}<div class="pp-list">${peopleRows(st)}</div><button class="k-btn k-btn--ghost k-btn--block" data-go="#/people">Find your people</button>`, 'pps');

  // 7 · Replies on takes: a thread in a sheet (st.threadStyle 'sheet', mine) or opened in place under the take ('inline')
  const REPLIES = { mayainterstellar: [['jo', 'The docking scene is the whole film for me too.', '1h'], ['ari', 'IMAX or nothing.', '40m'], ['sam', 'Seen it four times. Still sweating.', '20m']], jobudapest: [['maya', 'Same. The cake boxes!', '3h']] };
  const closest = p => (p === 'you' ? 101 : (MATCH[p] || {}).pct || 0);
  function replyPeek(st, key) {
    const all = repliesFor(st, key); if (!all.length) return '';
    const peek = all.slice().sort((x, y) => closest(y[0]) - closest(x[0])).slice(0, 2);
    return `<div class="th-peek">${peek.map(([q, txt]) => `<div class="th-peek__row">${pfLink(q, `${avatar(q, 'sm')}<b>${q === 'you' ? 'You' : P[q].n}</b>`)}<span>${txt}</span></div>`).join('')}
      ${all.length > 2 ? `<button class="th-peek__more" data-act="thread" data-key="${key}">See all ${all.length} replies</button>` : ''}</div>`;
  }
  const repliesFor = (st, key) => [...(REPLIES[key] || []), ...((st.myReplies || {})[key] || [])];
  const replyRows = (st, key) => repliesFor(st, key).map(([p, txt, t]) => `<div class="th-reply">${pfLink(p, avatar(p, 'sm'))}<div><span class="th-reply__who">${pfLink(p, `<b>${p === 'you' ? 'You' : P[p].n}</b>`)} · ${t}</span><p>${txt}</p></div></div>`).join('');
  const composer = (st, key, p) => `<div class="th-compose">${avatar('you', 'sm')}<input data-input="reply" data-key="${key}" placeholder="Reply to ${P[p].n}" value="${((st.drafts || {})[key]) || ''}" aria-label="Reply to ${P[p].n}"><button class="k-btn k-btn--primary k-btn--sm" data-act="th-send" data-key="${key}">Send</button></div>`;
  function threadSheet(st) {
    const th = st.thread, [p, k, s, t, txt] = th.take, key = p + k;
    return sheetWrap(th, 'thoverlay', 'Replies', `${sheetHead('Replies', 'thclose')}
      <div class="th-take"><div class="feed-item__who">${avatar(p, 'sm')}<span><b>${P[p].n}</b> · ${t}</span></div><div class="th-take__film tap" data-go="#/film/${k}">${poster(k, 'xs')}<span class="th-take__t"><b>${F[k][0]}</b><span class="sub">${F[k][1]}</span></span>${bigScore(p, s)}</div>${txt ? `<p>${txt}</p>` : ''}</div>
      <div class="th-list">${replyRows(st, key) || '<p class="sub">No replies yet. Say something nice.</p>'}</div>${composer(st, key, p)}`, 'th');
  }

  /* ---------- the rest of the original (round 1 picked 2026-10-10, applied 2026-10-11) ----------
     You picked my option every time, so only those are left: the stub at the end of Your stats, a backdrop on every film page,
     your filters as a pile of their own (the chips under the search are its quickest filters), the rank-10 card for someone new,
     talk in a sheet, and text that follows the device (st.textSize 'large' | 'xl' stands in for the device's setting on boards). */

  // 1 · Your member number, an Easter egg: a ticket stub at the very end of Your stats. Tomato: it's yours. "Admit one" didn't make
  // sense on a membership (your note), so the stub says what it's good for instead.
  const memberStub = () => `<div class="mb-stub" role="img" aria-label="Kino member number 4,211, since January 2024. Good for every movie night">
      <div class="mb-stub__main"><span class="mb-stub__admit">Good for every movie night</span><b class="mb-stub__n">Nº 4,211</b><span class="mb-stub__sub">Dani Cho · since January 2024</span></div>
      <div class="mb-stub__tear"><span class="mb-stub__wm">kino<i></i></span><span class="mb-stub__films"><b>186</b>films</span></div></div>`;
  const memberEnd = () => `<div class="mb-end"><span class="sub">You made it to the end. This one's yours.</span>${memberStub()}</div>`;

  // 2 · The film page: a trailer, a backdrop still (when there is one), and a more menu with Not interested
  const trailerOverlay = st => { const k = st.trailer, on = st.playing === k;
    return `<div class="app__overlay tr" data-act="troverlay"><div class="tr__box" role="dialog" aria-label="Trailer for ${F[k][0]}">
      <div class="tr__head"><span class="tr__t"><b>${F[k][0]}</b><span>Trailer · ${F[k][1]}</span></span><button class="k-iconbtn k-iconbtn--ghost k-iconbtn--sm" data-act="trclose" aria-label="Close">${ic('x')}</button></div>
      <button class="feed-trailer__still${on ? ' is-playing' : ''}" data-act="play" data-k="${k}" aria-label="${on ? 'Pause' : 'Play'} the trailer">${BACKDROPS[k] ? `<img src="stills/${BACKDROPS[k]}" alt="" decoding="async">` : `<span class="tr-ph" style="--tint:${TINTS[k] || (KINO.ART[k] || [])[0] || 'var(--kino-bg-fill)'}"></span>`}<span class="feed-trailer__play">${ic(on ? 'pause-fill' : 'play-fill')}</span>${on ? '<span class="feed-trailer__bar"></span>' : ''}</button></div></div>`; };
  function filmMenu(st) {
    const m = st.fmenu, k = m.k, inLists = allLists(st).filter(l => l.films.includes(k));
    const body = m.step === 'lists' ? `${sheetHead('Add to a list', 'fmclose')}<div class="gs-list">${allLists(st).map(l => { const on = l.films.includes(k);
        return `<button class="gs-row set-opt" role="checkbox" aria-checked="${on}" data-act="fm-list" data-l="${l.id}"><span><b>${l.name}</b><span class="sub">${nfilms(l.films.length)}</span></span>${ic('check')}</button>`; }).join('')}</div>
        <button class="k-btn k-btn--ghost k-btn--block" data-act="fm-newlist">${ic('plus')}New list</button><button class="k-btn k-btn--primary k-btn--block" data-act="fmclose">Done</button>`
      : `<div class="gs-head fm-head">${poster(k, 's')}<div class="gs-head__text"><b>${F[k][0]}</b><span class="sub">${F[k][1]} · ${F[k][2]}</span></div></div>
        <div class="gs-list"><button class="gs-row y-row" data-act="fm-lists">${ic('list-plus')}<span class="y-row__text"><b>Add to a list</b><span class="sub">${inLists.length ? `In ${inLists.map(l => l.name).join(', ')}` : 'Comfort rewatches, Big screen only…'}</span></span>${ic('caret-right')}</button>
          <button class="gs-row y-row" data-act="fm-log">${ic('calendar-blank')}<span class="y-row__text"><b>Log a watch</b><span class="sub">When, and who with</span></span>${ic('caret-right')}</button>
          <button class="gs-row y-row" data-act="fm-share">${ic('share-network')}<span class="y-row__text"><b>Share</b><span class="sub">With a friend or a group</span></span></button>
          <button class="gs-row y-row" data-act="fm-no">${ic('eye-slash')}<span class="y-row__text"><b>Not interested</b><span class="sub">Kino won't suggest it again</span></span></button></div>`;
    return sheetWrap(m, 'fmoverlay', F[k][0], body, 'fm');
  }
  // Interactions, round 2 (passed 2026-10-11; notes/interact-3.md): a more menu on takes, the last piece from the original.
  // What's in it, in order: what you'd do with the film, then about the take. Rank it only when you haven't ranked the film.
  const TM_ITEMS = ['rank', 'save', 'list', 'share', 'hide', 'report'];
  function tmItems(st, m) { const k = m.k, saved = isSaved(st, k), who = P[m.p].n;
    const it = { rank: MY[k] == null && st.ranked[k] == null && ['tm-rank', 'plus', 'Rank it', 'You haven\'t yet'],
      save: ['tm-save', saved ? 'bookmark-simple-fill' : 'bookmark-simple', saved ? 'Saved' : 'Save', saved ? 'On your watchlist' : 'To your watchlist'],
      list: ['tm-list', 'list-plus', 'Add to a list', 'Comfort rewatches, Big screen only…'],
      share: ['tm-share', 'share-network', 'Share', 'With a friend or a group'],
      hide: ['tm-hide', 'eye-slash', 'Hide this take', `You'll still see ${who}'s others`],
      report: ['tm-report', 'flag', 'Report', `${who} won't know it was you`] };
    return TM_ITEMS.filter(id => it[id]).map(id => [id, ...it[id]]); }
  function takeMenu(st) {
    const m = st.tmore, rows = tmItems(st, m), who = P[m.p].n;
    const list = rows.map(([id, act, icon, label], i) => `${id === 'hide' && i ? '<span class="tm-sep" role="separator"></span>' : ''}<button class="tm-row${id === 'report' ? ' tm-row--danger' : ''}" role="menuitem" data-act="${act}" style="--i:${i}">${ic(icon)}<span>${label}</span></button>`).join('');
    const menu = `<div class="tm-menu${m.kind === 'pop' ? ' tm-pop' : ''}${m.fresh ? ' is-fresh' : ''}" role="menu" aria-label="${who}'s take on ${F[m.k][0]}" data-from="${m.from}"${m.up ? ' data-up' : ''} style="left:${m.mx}px;top:${m.my}px">${list}</div>`;
    if (m.kind === 'pop') return menu;
    return `<div class="tm${m.fresh ? ' is-fresh' : ''}" data-act="tmclose"><div class="tm-lift" style="left:${m.r.x}px;top:${m.r.y}px;width:${m.r.w}px" aria-hidden="true">${m.html}</div>${menu}</div>`;
  }
  // Reporting: a reason, then thanks. The take goes away the same way Hide does.
  const REASONS = [['spoils', 'It gives the ending away'], ['mean', 'It\'s mean or hateful'], ['spam', 'It\'s spam, or selling something'], ['off', 'It isn\'t about the film'], ['else', 'Something else']];
  function reportSheet(st) {
    const r = st.report, who = P[r.p].n;
    const body = r.step === 'sent' ? `${sheetHead('Report', 'rpclose')}<div class="rpt-done"><span class="rpt-check">${ic('check')}</span><b>Thanks for telling us</b><p class="sub">We'll take a look. You won't see this take again, and ${who} won't know it was you.</p></div>
        <button class="k-btn k-btn--primary k-btn--block" data-act="rp-done">Done</button>`
      : `${sheetHead(`Report ${who}'s take`, 'rpclose')}<p class="sub rpt-lede">What's wrong with it? ${who} won't know it was you.</p>
        <div class="gs-list">${REASONS.map(([id, l]) => `<button class="gs-row set-opt" role="radio" aria-checked="${r.reason === id}" data-act="rp-why" data-r="${id}"><span><b>${l}</b></span>${ic('check')}</button>`).join('')}</div>
        <button class="k-btn k-btn--primary k-btn--block" data-act="rp-send"${r.reason ? '' : ' disabled'}>Send</button>`;
    return sheetWrap(r, 'rpoverlay', `Report ${who}'s take`, body, 'rpt');
  }

  // 3 · Browsing the whole catalogue, inside Explore: your filters make a pile of their own
  const CATALOG = ['interstellar', 'darkknight', 'dune', 'inception', 'spirited', 'parasite', 'arrival', 'budapest', 'endgame', 'infinitywar', 'avengers', 'deadpool',
    'avatar3', 'hailmary', 'spiderman', 'odyssey', 'toystory5', 'coyote', 'residentevil', 'raccoon']; // the films with real posters
  const BROWSE0 = { sort: 'friends', genres: [], decade: '', runtime: 0, director: '', friends: [] };
  // The chips under the search: the sheet's quickest filters. "Loved by friends" picks all four of your friends inside the sheet.
  const FRIENDS4 = ['maya', 'jo', 'ari', 'sam'];
  const QUICK = [['friends', 'Loved by friends'], ['runtime', 'Under 2 hours'], ['decade', '2020s']];
  const quickOn = (b, id) => !!b && (id === 'friends' ? b.friends.length > 0 : id === 'runtime' ? b.runtime === 120 : b.decade === '2020s');
  const SORTS = [['friends', 'Popular with friends'], ['new', 'Newest'], ['old', 'Oldest'], ['az', 'A to Z']];
  const GENRES_ALL = [...new Set(CATALOG.flatMap(k => (X[k] || {}).g || []))];
  const DIRECTORS2 = Object.entries(CATALOG.reduce((acc, k) => (acc[F[k][2]] = (acc[F[k][2]] || 0) + 1, acc), {})).filter(([, n]) => n > 1).map(([d]) => d);
  const decadeOf = k => Math.floor(F[k][1] / 10) * 10 + 's';
  const browseFits = (b, k) => (!b.genres.length || b.genres.some(g => ((X[k] || {}).g || []).includes(g))) && (!b.decade || decadeOf(k) === b.decade)
    && (!b.runtime || (mins(k) != null && mins(k) < b.runtime)) && (!b.director || F[k][2] === b.director) && (!b.friends.length || b.friends.some(p => (PILES[0].who[k] || []).includes(p)));
  const browseOn = b => b.genres.length + (b.decade ? 1 : 0) + (b.runtime ? 1 : 0) + (b.director ? 1 : 0) + (b.friends.length ? 1 : 0); // friends count once, like their chip
  const browseBlank = b => !browseOn(b) && b.sort === 'friends';
  function browseFilms(st, b = st.browse) {
    const ni = st.notInterested || {}, pop = k => (PILES[0].who[k] || []).length;
    const by = { friends: (x, y) => pop(y) - pop(x) || F[y][1] - F[x][1], new: (x, y) => F[y][1] - F[x][1], old: (x, y) => F[x][1] - F[y][1], az: (x, y) => F[x][0].localeCompare(F[y][0]) }[b.sort || 'friends'];
    return CATALOG.filter(k => !ni[k] && browseFits(b, k)).sort(by);
  }
  function browseTitle(b) {
    const bits = [...b.genres.slice(0, 2), b.decade, b.runtime ? (b.runtime === 120 ? 'under 2 hours' : 'under 2½ hours') : '', b.director, b.friends.length ? `loved by ${b.friends.length === FRIENDS4.length ? 'friends' : names(b.friends)}` : ''].filter(Boolean);
    const t = bits.join(', ') || (SORTS.find(x => x[0] === b.sort) || SORTS[0])[1]; return t[0].toUpperCase() + t.slice(1);
  }
  function filterSheet(st) {
    const d = st.fdraft, n = browseFilms(st, d).length;
    const opt = (key, v, label, multi, lead = '') => { const on = multi ? d[key].includes(v) : d[key] === v;
      return `<button class="k-chip" aria-pressed="${on}" data-act="fset" data-key="${key}" data-v="${v}"${typeof v === 'number' ? ' data-num="1"' : ''}${multi ? ' data-multi="1"' : ''}>${lead}${label}</button>`; };
    const group = (label, html) => `<div class="lg-field"><span class="m-label">${label}</span><div class="chips">${html}</div></div>`;
    return sheetWrap(st.fsheet, 'foverlay', 'Filters', `${sheetHead('Filters', 'fclose')}<div class="fs-body">
      ${group('Loved by friends', FRIENDS4.map(q => opt('friends', q, P[q].n, true, `<span class="k-dot id-${P[q].h}"></span>`)).join(''))}
      ${group('Length', [[120, 'Under 2 hours'], [150, 'Under 2½ hours']].map(([v, l]) => opt('runtime', v, l)).join(''))}
      ${group('Decade', ['2020s', '2010s', '2000s'].map(x => opt('decade', x, x)).join(''))}
      ${group('Genre', GENRES_ALL.map(g => opt('genres', g, g, true)).join(''))}
      ${group('Director', DIRECTORS2.map(x => opt('director', x, x)).join(''))}
      ${group('Sort', SORTS.map(([v, l]) => opt('sort', v, l)).join(''))}
      <p class="sub fs-note">Streaming services join the filters once Where to watch is real data.</p></div>
      <div class="fs-foot"><button class="k-btn k-btn--ghost" data-act="freset">Clear all</button><button class="k-btn k-btn--primary" data-act="fapply"${n ? '' : ' disabled'}>${n ? `Show ${nfilms(n)}` : 'Nothing matches'}</button></div>`, 'fs');
  }

  // 4 · First use: Home before you've ranked ten (st.newUser = { n: films ranked so far })
  function homeNew(st) {
    const n = Math.min(10, (st.newUser.n || 0) + Object.keys(st.ranked).length), done = n >= 10;
    const toRankNew = (st.toRank || ['interstellar', 'odyssey', 'coyote', 'residentevil']).filter(k => st.ranked[k] == null);
    const card = `<section class="m-card fu-card"><div class="fu-card__head"><h3>${done ? 'Your scores are on' : 'Rank 10 films to see your scores'}</h3>${tens(n, 10)}</div>
          <p class="s-sub">${done ? 'Every film you\'ve ranked now carries your score, and Kino can match you with friends.' : `${n} of 10 so far. Your scores show on films and on your profile once you've ranked ten.`}</p>
          ${done ? '<button class="k-btn k-btn--secondary k-btn--block" data-go="#/me">See your top 3</button>'

    const group = `<section class="m-card fu-group">${cluster(['maya', 'jo', 'you'], 56)}<div class="fu-group__t"><h3>Start your first group</h3><p class="s-sub">Pick a few friends. Kino finds films you'll all love.</p></div><button class="k-btn k-btn--secondary k-btn--sm k-btn--block" data-act="gnew">${ic('plus')}New group</button></section>`;
