<style>
/* Kino v3 tokens
   Names mirror the Figma variables (collections "Kino v3 / Primitives | Color | Size").
   Figma variable  color/bg/canvas  →  CSS  --kino-bg-canvas
   Dark is the default. Light applies with [data-theme="light"] on <html>. */

:root {
  /* ---------- primitives ---------- */
  --kino-neutral-1000: #1B1916;
  --kino-neutral-950: #121110;
  --kino-neutral-900: #1B1A17;
  --kino-neutral-850: #24221F;
  --kino-neutral-800: #302E2A;
  --kino-neutral-700: #45423C;
  --kino-neutral-500: #A19B92;
  --kino-neutral-400: #655D51;
  --kino-neutral-300: #D3C8B6;
  --kino-linen-300: #E1D6C4;
  --kino-linen-200: #EDE5D7;
  --kino-linen-100: #F4EEE3;
  --kino-linen-50: #FBF8F2;
  --kino-cream-50: #F3EEE6;
  --kino-white: #FFFFFF;

  --kino-tomato-300: #FF6A3D;
  --kino-tomato-600: #CF421D;
  --kino-tomato-650: #B8371A;
  --kino-tomato-700: #B53816;
  --kino-crimson-300: #FF5C7A;
  --kino-crimson-600: #C21F45;
  --kino-green-300: #6ED39A;
  --kino-green-600: #1A7346;
  --kino-blue-300: #8EBAFF;
  --kino-blue-600: #2F5FD0;

  --kino-identity-rose-dark: #FF93CB;        --kino-identity-rose-light: #A44B79;
  --kino-identity-amber-dark: #F5AE39;       --kino-identity-amber-light: #9A6100;
  --kino-identity-citron-dark: #D5BF36;      --kino-identity-citron-light: #816F00;
  --kino-identity-fern-dark: #87D576;        --kino-identity-fern-light: #418032;
  --kino-identity-mint-dark: #2CDCAF;        --kino-identity-mint-light: #008663;
  --kino-identity-lagoon-dark: #00DAE4;      --kino-identity-lagoon-light: #00818A;
  --kino-identity-sky-dark: #41CCFF;         --kino-identity-sky-light: #0078AF;
  --kino-identity-periwinkle-dark: #8EBAFF;  --kino-identity-periwinkle-light: #496BBA;
  --kino-identity-lilac-dark: #C5A9FF;       --kino-identity-lilac-light: #755DB1;
  --kino-identity-orchid-dark: #E89CF9;      --kino-identity-orchid-light: #8F539D;

  /* ---------- size ---------- */
  --kino-space-0: 0px;  --kino-space-2: 2px;  --kino-space-4: 4px;  --kino-space-6: 6px;
  --kino-space-8: 8px;  --kino-space-12: 12px; --kino-space-16: 16px; --kino-space-20: 20px;
  --kino-space-24: 24px; --kino-space-32: 32px; --kino-space-40: 40px; --kino-space-48: 48px; --kino-space-64: 64px;

  --kino-radius-poster: 4px;   /* every poster size; never scales up */
  --kino-radius-input: 8px;    /* text fields, composers */
  --kino-radius-card: 12px;    /* cards, lists */
  --kino-radius-sheet: 20px;   /* sheets, modals */
  --kino-radius-pill: 999px;   /* buttons, chips, search, tabs */

  --kino-size-icon-sm: 16px;
  --kino-size-icon-md: 20px;
  --kino-size-icon-lg: 24px;
  --kino-size-control-sm: 36px;
  --kino-size-control-lg: 48px;

  /* ---------- type ---------- */
  --kino-font-display: "Bricolage Grotesque", "Geist", system-ui, sans-serif;
  --kino-font-ui: "Geist", system-ui, -apple-system, sans-serif;

  --kino-motion-fast: 120ms;
  --kino-motion-base: 200ms;
  --kino-ease: cubic-bezier(.2, .7, .2, 1);
}

/* ---------- semantic: Dark (default) ---------- */
:root,
[data-theme="dark"] {
  color-scheme: dark;
  --kino-bg-canvas: var(--kino-neutral-950);
  --kino-bg-surface: var(--kino-neutral-900);
  --kino-bg-fill: var(--kino-neutral-850);
  --kino-bg-inverse: var(--kino-cream-50);
  --kino-bg-accent: var(--kino-tomato-600);
  --kino-bg-accent-pressed: var(--kino-tomato-700);
  --kino-bg-disabled: var(--kino-neutral-850);

  --kino-text-primary: var(--kino-cream-50);
  --kino-text-secondary: var(--kino-neutral-500);
  --kino-text-disabled: var(--kino-neutral-700);
  --kino-text-on-inverse: var(--kino-neutral-950);
  --kino-text-on-accent: var(--kino-white);
  --kino-text-on-identity: var(--kino-neutral-950);
  --kino-text-accent: var(--kino-tomato-300);
  --kino-text-danger: var(--kino-crimson-300);
  --kino-text-success: var(--kino-green-300);

  --kino-icon-primary: var(--kino-cream-50);
  --kino-icon-secondary: var(--kino-neutral-500);
  --kino-icon-on-inverse: var(--kino-neutral-950);
  --kino-icon-on-accent: var(--kino-white);

  --kino-border-subtle: var(--kino-neutral-800);
  --kino-border-strong: var(--kino-neutral-700);
  --kino-border-focus: var(--kino-neutral-500); /* focus is a calm grey, never a blue glow (2026-10-08) */
  --kino-border-danger: var(--kino-crimson-300);

  --kino-signal-you: var(--kino-tomato-300);
  --kino-signal-unread: var(--kino-cream-50); /* unread is cream, never Tomato: Tomato means you */

  --kino-effect-shadow-key: rgb(5 4 3 / .45);
  --kino-effect-shadow-ambient: rgb(5 4 3 / .60);
  --kino-effect-highlight: rgb(255 255 255 / .045);

  --kino-identity-rose: var(--kino-identity-rose-dark);
  --kino-identity-amber: var(--kino-identity-amber-dark);
  --kino-identity-citron: var(--kino-identity-citron-dark);
  --kino-identity-fern: var(--kino-identity-fern-dark);
  --kino-identity-mint: var(--kino-identity-mint-dark);
  --kino-identity-lagoon: var(--kino-identity-lagoon-dark);
  --kino-identity-sky: var(--kino-identity-sky-dark);
  --kino-identity-periwinkle: var(--kino-identity-periwinkle-dark);
  --kino-identity-lilac: var(--kino-identity-lilac-dark);
  --kino-identity-orchid: var(--kino-identity-orchid-dark);
}

/* ---------- semantic: Light ---------- */
[data-theme="light"] {
  color-scheme: light;
  --kino-bg-canvas: var(--kino-linen-100);
  --kino-bg-surface: var(--kino-linen-50);
  --kino-bg-fill: var(--kino-linen-200);
  --kino-bg-inverse: var(--kino-neutral-1000);
  --kino-bg-accent: var(--kino-tomato-600);
  --kino-bg-accent-pressed: var(--kino-tomato-700);
  --kino-bg-disabled: var(--kino-linen-200);

  --kino-text-primary: var(--kino-neutral-1000);
  --kino-text-secondary: var(--kino-neutral-400);
  --kino-text-disabled: var(--kino-neutral-300);
  --kino-text-on-inverse: var(--kino-linen-50);
  --kino-text-on-accent: var(--kino-white);
  --kino-text-on-identity: var(--kino-white);
  --kino-text-accent: var(--kino-tomato-650);
  --kino-text-danger: var(--kino-crimson-600);
  --kino-text-success: var(--kino-green-600);

  --kino-icon-primary: var(--kino-neutral-1000);
  --kino-icon-secondary: var(--kino-neutral-400);
  --kino-icon-on-inverse: var(--kino-linen-50);
  --kino-icon-on-accent: var(--kino-white);

  --kino-border-subtle: var(--kino-linen-300);
  --kino-border-strong: var(--kino-neutral-300);
  --kino-border-focus: var(--kino-neutral-400);
  --kino-border-danger: var(--kino-crimson-600);

  --kino-signal-you: var(--kino-tomato-650);
  --kino-signal-unread: var(--kino-neutral-1000);

  --kino-effect-shadow-key: rgb(42 30 15 / .06);
  --kino-effect-shadow-ambient: rgb(42 30 15 / .09);
  --kino-effect-highlight: rgb(255 255 255 / .7);

  --kino-identity-rose: var(--kino-identity-rose-light);
  --kino-identity-amber: var(--kino-identity-amber-light);
  --kino-identity-citron: var(--kino-identity-citron-light);
  --kino-identity-fern: var(--kino-identity-fern-light);
  --kino-identity-mint: var(--kino-identity-mint-light);
  --kino-identity-lagoon: var(--kino-identity-lagoon-light);
  --kino-identity-sky: var(--kino-identity-sky-light);
  --kino-identity-periwinkle: var(--kino-identity-periwinkle-light);
  --kino-identity-lilac: var(--kino-identity-lilac-light);
  --kino-identity-orchid: var(--kino-identity-orchid-light);
}

/* ---------- elevation (Figma: Kino v3/Elevation/1|2) ---------- */
/* declared on every themed element so nested themes recompute their shadow colours */
:root, [data-theme] {
  --kino-elevation-1: inset 0 1px 0 var(--kino-effect-highlight), 0 1px 2px var(--kino-effect-shadow-key), 0 8px 24px var(--kino-effect-shadow-ambient);
  --kino-elevation-2: inset 0 1px 0 var(--kino-effect-highlight), 0 2px 6px var(--kino-effect-shadow-key), 0 16px 40px var(--kino-effect-shadow-ambient);
}

/* ---------- identity helpers: set --kino-id on any element ---------- */
.id-rose { --kino-id: var(--kino-identity-rose); }
.id-amber { --kino-id: var(--kino-identity-amber); }
.id-citron { --kino-id: var(--kino-identity-citron); }
.id-fern { --kino-id: var(--kino-identity-fern); }
.id-mint { --kino-id: var(--kino-identity-mint); }
.id-lagoon { --kino-id: var(--kino-identity-lagoon); }
.id-sky { --kino-id: var(--kino-identity-sky); }
.id-periwinkle { --kino-id: var(--kino-identity-periwinkle); }
.id-lilac { --kino-id: var(--kino-identity-lilac); }
.id-orchid { --kino-id: var(--kino-identity-orchid); }
.id-you { --kino-id: var(--kino-signal-you); }

/* ---------- text styles (Figma: Kino v3/…) — sentence case, never mono ---------- */
.kino-display-hero { font: 800 48px/48px var(--kino-font-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.kino-display-xl   { font: 800 34px/40px var(--kino-font-display); letter-spacing: -.02em; }
.kino-display-l    { font: 700 28px/34px var(--kino-font-display); letter-spacing: -.015em; }
.kino-display-m    { font: 700 22px/28px var(--kino-font-display); letter-spacing: -.01em; }
.kino-title-l      { font: 600 17px/22px var(--kino-font-ui); letter-spacing: -.005em; }
.kino-title-m      { font: 600 15px/20px var(--kino-font-ui); letter-spacing: -.0025em; }
.kino-body-l       { font: 400 17px/24px var(--kino-font-ui); }
.kino-body-m       { font: 400 15px/22px var(--kino-font-ui); }
.kino-body-s       { font: 400 13px/18px var(--kino-font-ui); }
.kino-label-l      { font: 600 15px/20px var(--kino-font-ui); }
.kino-label-m      { font: 500 13px/16px var(--kino-font-ui); }
.kino-label-s      { font: 500 11px/14px var(--kino-font-ui); letter-spacing: .002em; }
.kino-score-list   { font: 600 17px/20px var(--kino-font-ui); letter-spacing: -.005em; font-variant-numeric: tabular-nums; }
</style>
<style>
/* Kino v3 atoms. Every value comes from tokens.css. */

/* ---------- Icon ---------- */
.k-icon { width: var(--k-icon-size, var(--kino-size-icon-lg)); height: var(--k-icon-size, var(--kino-size-icon-lg)); flex: none; fill: currentColor; color: inherit; }
.k-icon--sm { --k-icon-size: var(--kino-size-icon-sm); }
.k-icon--md { --k-icon-size: var(--kino-size-icon-md); }

/* ---------- Dot ---------- */
.k-dot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: var(--kino-radius-pill); background: var(--kino-id, var(--kino-signal-you)); }
.k-dot--lg { width: 12px; height: 12px; }
.k-dot--empty { background: transparent; border: 1.5px solid var(--kino-border-strong); box-sizing: border-box; } /* a border, not an inset shadow: survives Figma captures */

/* ---------- Avatar ---------- */
.k-avatar { --k-av: 40px; position: relative; flex: none; width: var(--k-av); height: var(--k-av); border-radius: var(--kino-radius-pill);
  display: inline-grid; place-items: center; background: var(--kino-id, var(--kino-identity-periwinkle)); color: var(--kino-text-on-identity);
  font: 600 15px/1 var(--kino-font-ui); letter-spacing: -.01em; user-select: none; }
.k-avatar--sm { --k-av: 24px; font: 500 10px/1 var(--kino-font-ui); }
.k-avatar--lg { --k-av: 72px; font: 700 24px/1 var(--kino-font-display); letter-spacing: -.02em; }
.k-avatar--xl { --k-av: 144px; font: 800 52px/1 var(--kino-font-display); letter-spacing: -.03em; }
.k-avatar--hero { --k-av: 200px; font: 800 72px/1 var(--kino-font-display); letter-spacing: -.035em; }
.k-avatar--xxl { --k-av: 176px; font: 800 64px/1 var(--kino-font-display); letter-spacing: -.035em; }
.k-avatar--more { --kino-id: var(--kino-bg-fill); color: var(--kino-text-secondary); font-weight: 600; letter-spacing: -.02em; }
.k-avatar__photo { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; background: var(--kino-bg-fill); display: grid; place-items: center; color: var(--kino-icon-secondary); }
.k-avatar__photo img { width: 100%; height: 100%; object-fit: cover; }
.k-avatar__photo .k-icon { --k-icon-size: 50%; }
.k-avatar__photo::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 2px var(--kino-id, var(--kino-identity-periwinkle)); }
.k-avatar--sm .k-avatar__photo::after { box-shadow: inset 0 0 0 1.5px var(--kino-id, var(--kino-identity-periwinkle)); }
/* The camera dot sits OUTSIDE the avatar, top right, like the wordmark's dot beside the "o". It never overlaps. */
.k-avatar { --k-you: max(7px, calc(var(--k-av) * .15)); --k-you-gap: max(2px, calc(var(--k-av) * .04)); }
/* Your dot sits just off the avatar's top right, at 45°, like the wordmark's dot beside the "o". Never on the avatar. */
.k-avatar__you { position: absolute; left: calc(85.36% + var(--k-you-gap)); top: calc(14.64% - var(--k-you-gap)); transform: translateY(-100%); width: var(--k-you); height: var(--k-you); border-radius: var(--kino-radius-pill); background: var(--kino-signal-you); }
.k-avatar:has(> .k-avatar__you) { margin-right: calc(var(--k-you) + var(--k-you-gap)); }

.k-avatar-stack { display: inline-flex; }
.k-avatar-stack > .k-avatar { box-shadow: 0 0 0 2px var(--k-stack-bg, var(--kino-bg-surface)); }
.k-avatar-stack > .k-avatar + .k-avatar { margin-left: calc(var(--k-av) * -.28); }

/* ---------- Button ---------- */
.k-btn { --k-icon-size: var(--kino-size-icon-md); display: inline-flex; align-items: center; justify-content: center; gap: var(--kino-space-8);
  height: var(--kino-size-control-lg); padding: 0 var(--kino-space-20); border-radius: var(--kino-radius-pill); border: 1.5px solid transparent;
  font: 600 15px/20px var(--kino-font-ui); white-space: nowrap; cursor: pointer; text-decoration: none; -webkit-tap-highlight-color: transparent;
  transition: background-color var(--kino-motion-fast) var(--kino-ease), border-color var(--kino-motion-fast) var(--kino-ease), transform var(--kino-motion-fast) var(--kino-ease), color var(--kino-motion-fast); }
.k-btn:active:not(:disabled) { transform: scale(.97); }
.k-btn:focus-visible, .k-iconbtn:focus-visible, .k-chip:focus-visible, .k-tab:focus-visible { outline: 2px solid var(--kino-border-focus); outline-offset: 2px; }
.k-btn--sm { --k-icon-size: var(--kino-size-icon-sm); height: var(--kino-size-control-sm); padding: 0 var(--kino-space-16); gap: var(--kino-space-6); font: 500 13px/16px var(--kino-font-ui); }
.k-btn--block { width: 100%; }

.k-btn--primary, .k-iconbtn--primary { background: var(--kino-bg-inverse); color: var(--kino-text-on-inverse); }
.k-btn--primary:hover:not(:disabled), .k-iconbtn--primary:hover:not(:disabled) { background: color-mix(in srgb, var(--kino-bg-inverse) 90%, var(--kino-bg-canvas)); }
.k-btn--primary:active:not(:disabled), .k-iconbtn--primary:active:not(:disabled), .k-btn--primary.is-pressed { background: color-mix(in srgb, var(--kino-bg-inverse) 84%, var(--kino-bg-canvas)); }

.k-btn--secondary, .k-iconbtn--secondary { background: transparent; border-color: var(--kino-border-strong); color: var(--kino-text-primary); }
.k-btn--secondary:hover:not(:disabled), .k-iconbtn--secondary:hover:not(:disabled) { background: var(--kino-bg-fill); }
.k-btn--secondary:active:not(:disabled), .k-btn--secondary.is-pressed { background: var(--kino-bg-fill); border-color: var(--kino-text-secondary); }

.k-btn--accent { background: var(--kino-bg-accent); color: var(--kino-text-on-accent); }
.k-btn--accent:hover:not(:disabled) { background: color-mix(in srgb, var(--kino-bg-accent) 88%, var(--kino-bg-accent-pressed)); }
.k-btn--accent:active:not(:disabled), .k-btn--accent.is-pressed { background: var(--kino-bg-accent-pressed); }

.k-btn--ghost, .k-iconbtn--ghost { background: transparent; color: var(--kino-text-primary); }
/* Danger: only the last step of something hard to take back (leave, delete) */
.k-btn--danger { background: var(--kino-text-danger); color: var(--kino-bg-canvas); }
.k-btn--danger:hover:not(:disabled) { background: color-mix(in srgb, var(--kino-text-danger) 88%, var(--kino-bg-canvas)); }
.k-btn--ghost:hover:not(:disabled), .k-iconbtn--ghost:hover:not(:disabled), .k-btn--ghost.is-pressed { background: var(--kino-bg-fill); }

.k-btn:disabled, .k-iconbtn:disabled { background: var(--kino-bg-disabled); color: var(--kino-text-disabled); border-color: transparent; cursor: not-allowed; }
.k-btn--secondary:disabled, .k-iconbtn--secondary:disabled { background: transparent; border-color: var(--kino-border-subtle); }
.k-btn--ghost:disabled, .k-iconbtn--ghost:disabled { background: transparent; }

/* ---------- Icon button ---------- */
.k-iconbtn { --k-icon-size: var(--kino-size-icon-md); display: inline-grid; place-items: center; flex: none; width: var(--kino-size-control-lg); height: var(--kino-size-control-lg);
  border-radius: var(--kino-radius-pill); border: 1.5px solid transparent; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background-color var(--kino-motion-fast) var(--kino-ease), transform var(--kino-motion-fast) var(--kino-ease); }
.k-iconbtn:active:not(:disabled) { transform: scale(.94); }
.k-iconbtn--sm { --k-icon-size: var(--kino-size-icon-sm); width: var(--kino-size-control-sm); height: var(--kino-size-control-sm); }

/* ---------- Chip ---------- */
.k-chip { --k-icon-size: var(--kino-size-icon-sm); display: inline-flex; align-items: center; gap: var(--kino-space-6); height: 32px; padding: 0 var(--kino-space-12);
  border-radius: var(--kino-radius-pill); border: 1px solid var(--kino-border-subtle); background: var(--kino-bg-surface); color: var(--kino-text-primary);
  font: 500 13px/16px var(--kino-font-ui); white-space: nowrap; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background-color var(--kino-motion-fast) var(--kino-ease), border-color var(--kino-motion-fast) var(--kino-ease), color var(--kino-motion-fast); }
.k-chip:hover { border-color: var(--kino-border-strong); }
.k-chip[aria-pressed="true"], .k-chip.is-selected { background: var(--kino-bg-inverse); border-color: var(--kino-bg-inverse); color: var(--kino-text-on-inverse); }
.k-chip .k-icon { color: var(--kino-icon-secondary); }
.k-chip[aria-pressed="true"] .k-icon, .k-chip.is-selected .k-icon { color: var(--kino-icon-on-inverse); }
.k-chip__remove { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-right: -4px; border-radius: var(--kino-radius-pill); color: inherit; opacity: .7; }
.k-chip__remove:hover { opacity: 1; }
.k-chip:disabled { color: var(--kino-text-disabled); border-color: var(--kino-border-subtle); background: transparent; cursor: not-allowed; }

/* ---------- Score ---------- */

/* ===== Motion, first pass (2026-10-08): every action answers with movement ===== */
/* Screens: forward pushes in from the right, back slides in from the left, tabs fade */
.app__page--fwd { animation: k-push .32s var(--kino-ease); }
.app__page--back { animation: k-pop .32s var(--kino-ease); }
@keyframes k-push { from { opacity: 0; transform: translateX(28px); } }
@keyframes k-pop { from { opacity: 0; transform: translateX(-28px); } }
/* Sheets: the backdrop fades in once; steps slide inside the sheet instead of the whole sheet re-rising */
.app__overlay { animation: k-fade .2s var(--kino-ease); }
.app__overlay--still, .app__sheet--still { animation: none; }
@keyframes k-fade { from { opacity: 0; } }
.r-body--fwd { animation: k-push .3s var(--kino-ease); }

.r-result .k-score--hero .k-dot { animation: k-beat .5s .1s cubic-bezier(.3, 1.35, .5, 1) backwards; }
@keyframes r-slot { from { opacity: 0; transform: translateY(-12px); } }
/* Small things answer back: a like, a follow, a save, a nudge */

@keyframes k-beat { 0% { transform: scale(.5); } 60% { transform: scale(1.25); } 100% { transform: none; } }

.g-item > .g-row:active { background: var(--kino-bg-fill); }
/* Profile tabs slide in from the side you picked */
.s-panel--fwd { animation: k-push .3s var(--kino-ease); }
.s-panel--back { animation: k-pop .3s var(--kino-ease); }

  .is-fx .k-icon, .is-ring .k-icon, .s-panel--fwd, .s-panel--back, .picked .picked__hero, .picked .p-stage .k-poster, .picked__info { animation: none; }

/* ===== On a real phone (2026-10-08): the published prototype ===== */

/* iPhone zooms into any field under 16px when you tap it; on touch screens the fields are 16px */
@media (pointer: coarse) { .app input, .app textarea { font-size: 16px; } }

@media (hover: none) { .tile:hover .k-poster, .x-card:hover .k-poster, .v-film__poster:hover { transform: none; } .g-item > .g-row:hover { background: var(--kino-bg-canvas); } }

/* ===== V.2 crit (2026-10-08): small fixes on mobile, shared with web ===== */

@media (hover: hover) { .g-row:hover .m-cluster__dot { transform: translate(calc(var(--ox) * 3px), calc(var(--oy) * 3px)); } }
.g-row.is-hover .m-cluster__dot { transform: translate(calc(var(--ox) * 3px), calc(var(--oy) * 3px)); } /* the motion board's scripted hover */

.x-pile__card { transform: translate(var(--dx, 0px), var(--dy, 0px)) rotate(var(--r, 0deg)); transition: transform .5s cubic-bezier(.3, 1.35, .5, 1) var(--bt, 0ms); }

  background: color-mix(in srgb, var(--kino-neutral-950) 55%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: var(--kino-cream-50); --k-icon-size: 20px;
  transition: transform var(--kino-motion-fast) var(--kino-ease), opacity var(--kino-motion-base) var(--kino-ease); }

.feed-person b { font: 600 15px/20px var(--kino-font-ui); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-person .sub { display: inline-flex; align-items: center; gap: 5px; font: 400 12px/16px var(--kino-font-ui); }

.feed-more { display: flex; justify-content: center; gap: 7px; padding: var(--kino-space-24) 0 var(--kino-space-8); }
.feed-more span { width: 7px; height: 7px; border-radius: 50%; background: var(--kino-text-secondary); animation: f-wait 1.1s ease-in-out infinite; }

/* A swiped group row keeps its rounded soft card while its actions are showing */

/* ===== The web revisit (2026-10-08), on the nav choice sheet: apps mounted with webNav 'top' or 'rail' ===== */
/* Learned from the original: a small, steady type scale (13 / 15 / 17), hierarchy from weight and grey rather than size,

<script>
/* Kino v3 organisms (profile set, draft 5: third-pass crit applied, 2026-10-08).
   Shared by organisms.html, profile-web.html, app.js and the screens boards. */
const KINO = (() => {
  const ic = (n, cls = '') => `<svg class="k-icon ${cls}" aria-hidden="true"><use href="#${n}"/></svg>`;

  // Real films; the people are invented. [title, year, director]
  const F = {

    onebattle: ['One Battle After Another', 2025, 'Paul Thomas Anderson'], sinners: ['Sinners', 2025, 'Ryan Coogler'], anora: ['Anora', 2024, 'Sean Baker'],
    brutalist: ['The Brutalist', 2024, 'Brady Corbet'], conclave: ['Conclave', 2024, 'Edward Berger'], flow: ['Flow', 2024, 'Gints Zilbalodis'],
    // Real posters from the original Kino file
    interstellar: ['Interstellar', 2014, 'Christopher Nolan'], darkknight: ['The Dark Knight', 2008, 'Christopher Nolan'], dune: ['Dune', 2021, 'Denis Villeneuve'],
    inception: ['Inception', 2010, 'Christopher Nolan'], spirited: ['Spirited Away', 2001, 'Hayao Miyazaki'], parasite: ['Parasite', 2019, 'Bong Joon Ho'],
    arrival: ['Arrival', 2016, 'Denis Villeneuve'], budapest: ['The Grand Budapest Hotel', 2014, 'Wes Anderson'], endgame: ['Avengers: Endgame', 2019, 'Anthony and Joe Russo'],
    infinitywar: ['Avengers: Infinity War', 2018, 'Anthony and Joe Russo'], avengers: ['The Avengers', 2012, 'Joss Whedon'], deadpool: ['Deadpool & Wolverine', 2024, 'Shawn Levy'],
    avatar3: ['Avatar: Fire and Ash', 2025, 'James Cameron'], hailmary: ['Project Hail Mary', 2026, 'Phil Lord and Christopher Miller'],
    spiderman: ['Spider-Man: Brand New Day', 2026, 'Destin Daniel Cretton'], odyssey: ['The Odyssey', 2026, 'Christopher Nolan'], toystory5: ['Toy Story 5', 2026, 'Andrew Stanton'],
    coyote: ['Coyote vs. Acme', 2026, 'Dave Green'], residentevil: ['Resident Evil', 2026, 'Zach Cregger'], raccoon: ['Resident Evil: Welcome to Raccoon City', 2021, 'Johannes Roberts'],
  };
  // Stand-in art palettes [base, light pool, second pool]. Colourful on purpose; swapped for real artwork later.
  const ART = {
    pastlives: ['#1F3A5F', '#E9A86B', '#6FA3C7'], perfectdays: ['#23402F', '#E8C66A', '#9FC2A8'], aftersun: ['#0F4C75', '#F2A65A', '#4FB0C6'],
    mood: ['#4A0D12', '#D9483B', '#F2C14E'], shoplifters: ['#36452A', '#E07A5F', '#F2D0A4'], paddington: ['#1D3557', '#E63946', '#F4A261'],
    spirited: ['#174542', '#F28482', '#84DCC6'], holdovers: ['#3A2618', '#C9A227', '#E3D5B8'], portrait: ['#22243A', '#EF8354', '#F7C59F'],
    columbus: ['#2F4858', '#F6AE2D', '#86BBD8'], dune: ['#4A2C0F', '#F4A259', '#E8D5B5'], challengers: ['#0B3D2E', '#C7F464', '#4ECDC4'],
    eeaao: ['#2D1B4E', '#FF5DA2', '#47E5BC'],
    onebattle: ['#102A43', '#F0B429', '#D64545'], sinners: ['#2A1A12', '#F2994A', '#B23A48'], anora: ['#3D0C45', '#FF7AB6', '#FFD166'],
    brutalist: ['#2B2B2B', '#D4A373', '#8D99AE'], conclave: ['#3A0D0D', '#C1121F', '#F4E3B1'], flow: ['#0B3954', '#7BDFF2', '#B2F7EF'],
  };
  // Stand-in portrait palettes for cast (picked by name), so faces read as photos, not initials
  const FACE = [['#3A2A4A', '#F2A65A', '#E9C46A'], ['#1F3A5F', '#F28482', '#84DCC6'], ['#23402F', '#F4A261', '#E76F51'], ['#2D1B4E', '#FFB4A2', '#B5838D'], ['#0B3954', '#FFD6A5', '#9BF6FF']];
  // Colours never shift: two people can share a hue (Jules and Theo are both Mint); names and initials tell them apart.
  const P = { you: { n: 'You', full: 'Dani Cho', i: 'DC', h: 'periwinkle' }, maya: { n: 'Maya', full: 'Maya Kim', i: 'MK', h: 'rose' }, jo: { n: 'Jo', full: 'Jo Okafor', i: 'JO', h: 'sky' },
    ari: { n: 'Ari', full: 'Ari Levin', i: 'AL', h: 'fern' }, sam: { n: 'Sam', full: 'Sam Rivera', i: 'SR', h: 'lilac' }, noor: { n: 'Noor', i: 'NA', h: 'amber' },
    theo: { n: 'Theo', i: 'TB', h: 'mint' }, lena: { n: 'Lena', i: 'LH', h: 'orchid' }, kai: { n: 'Kai', i: 'KW', h: 'citron' }, rui: { n: 'Rui', i: 'RS', h: 'lagoon' },
    jules: { n: 'Jules', full: 'Jules Park', i: 'JP', h: 'mint', followers: '12.4k' }, omar: { n: 'Omar', full: 'Omar Haddad', i: 'OH', h: 'amber', followers: '8.1k' },
    // More people you don't follow yet, for the feed that doesn't end and People to follow
    ines: { n: 'Inès', full: 'Inès Moreau', i: 'IM', h: 'orchid', followers: '5.3k' }, kofi: { n: 'Kofi', full: 'Kofi Mensah', i: 'KM', h: 'sky', followers: '21k' },
    wren: { n: 'Wren', full: 'Wren Ellis', i: 'WE', h: 'citron', followers: '3.9k' } };

  const fmt = v => (v >= 10 ? '10.0' : v.toFixed(1));
  const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const artStyle = k => { const [a1, a2, a3] = ART[k] || ['#2b3a4a', '#e9a86b', '#6fa3c7'], h = hash(k);
    return `--a1:${a1};--a2:${a2};--a3:${a3};--x1:${15 + h % 50}%;--y1:${10 + (h >> 3) % 35}%;--x2:${45 + (h >> 5) % 45}%;--y2:${55 + (h >> 7) % 35}%;--ang:${140 + (h >> 9) % 60}deg`; };
  // Real poster art from the original Kino file, saved in design-system/posters/. Films without one keep the stand-in art.
  const IMG = Object.fromEntries(['interstellar', 'darkknight', 'dune', 'inception', 'spirited', 'parasite', 'arrival', 'budapest', 'endgame', 'infinitywar', 'avengers', 'deadpool',
    'avatar3', 'hailmary', 'spiderman', 'odyssey', 'toystory5', 'coyote', 'residentevil', 'raccoon'].map(k => [k, k + '.jpg']));
  const poster = (k, size = 's', extra = '') => IMG[k]
    ? `<div class="k-poster k-poster--${size} ${extra}" role="img" aria-label="${F[k][0]}"><img src="posters/${IMG[k]}" alt="" decoding="async"></div>`
    : `<div class="k-poster k-poster--${size} m-art ${extra}" style="${artStyle(k)}" role="img" aria-label="${F[k][0]}"></div>`;
  const score = (who, v, o = {}) => v == null
    ? `<span class="k-score k-score--unranked"><span class="k-dot k-dot--empty"></span><span class="k-score__num">–</span></span>`
    : `<span class="k-score ${who === 'you' ? '' : 'id-' + P[who].h}"><span class="k-dot"></span><span class="k-score__num">${fmt(v)}</span>${o.name ? `<span class="k-score__who">${P[who].n}</span>` : ''}</span>`;
  const avatar = (who, size = '', you = false) => `<span class="k-avatar ${size ? 'k-avatar--' + size : ''} id-${P[who].h}">${P[who].i}${you ? '<span class="k-avatar__you"></span>' : ''}</span>`;
  // Avatar stack with a "+N" overflow after `max` people
  const stack = (people, size = 'sm', max = 4) => { const shown = people.length > max + 1 ? people.slice(0, max) : people, more = people.length - shown.length;
    return `<span class="k-avatar-stack">${shown.map(p => `<span class="k-avatar ${size ? 'k-avatar--' + size : ''} id-${P[p].h}">${P[p].i}</span>`).join('')}${more ? `<span class="k-avatar ${size ? 'k-avatar--' + size : ''} k-avatar--more">+${more}</span>` : ''}</span>`; };
  const names = people => { const n = people.map(p => P[p].n); return n.length > 1 ? n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1] : n[0]; };
  // "Maya, Jo, Ari and you" / "Maya, Jo, Ari, you and 5 more"
  const members = people => { const o = people.filter(p => p !== 'you').map(p => P[p].n);
    return o.length <= 3 ? (o.length ? o.join(', ') + ' and you' : 'Just you') : `${o.slice(0, 3).join(', ')}, you and ${o.length - 3} more`; };
  const whodots = people => `<span class="m-whodots" title="${names(people)}" aria-label="Seen by ${names(people)}"><span>${people.map(p => `<span class="k-dot id-${P[p].h}"></span>`).join('')}</span>${people.length}</span>`;
  // Bundled member dots, iMessage-style. Two to four faces overlap slightly, like a pair, and keep their initials clear.
  // Five or more become one ring of small dots with an empty centre; the dots get smaller as the group grows.
  const cluster = (people, d = 56) => {
    const n = people.length, c = d / 2;
    let dots;
    if (n === 1) dots = [[c, c, d * .7]];
    else if (n === 2) dots = [[d * .33, d * .33, d * .52], [d * .67, d * .67, d * .52]];
    else if (n === 3) dots = [[c, d * .26, d * .5], [d * .27, d * .66, d * .5], [d * .73, d * .66, d * .5]];
    else if (n === 4) dots = [[d * .28, d * .28, d * .5], [d * .72, d * .28, d * .5], [d * .28, d * .72, d * .5], [d * .72, d * .72, d * .5]];
    else { const k = .78 * Math.PI / n, s = d * k / (1 + k), R = (d - s) / 2;
      dots = Array.from({ length: n }, (_, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [c + R * Math.cos(a), c + R * Math.sin(a), s]; }); }
    return `<span class="m-cluster" style="--d:${d}px" role="img" aria-label="${names(people)}">${people.map((p, i) => { const [x, y, s] = dots[i];
      return `<span class="m-cluster__dot id-${P[p].h}" style="left:${(x - s / 2).toFixed(1)}px;top:${(y - s / 2).toFixed(1)}px;width:${s.toFixed(1)}px;height:${s.toFixed(1)}px;font-size:${Math.max(8, s * .36).toFixed(1)}px;--ox:${((x - c) / c).toFixed(2)};--oy:${((y - c) / c).toFixed(2)}">${s >= 24 ? P[p].i : ''}</span>`; }).join('')}</span>`;
  };
  const face = (name, size = 'lg') => { const [a1, a2, a3] = FACE[hash(name) % FACE.length], h = hash(name + 'x');
    return `<span class="k-avatar k-avatar--${size} m-art m-face" role="img" aria-label="${name}" style="--a1:${a1};--a2:${a2};--a3:${a3};--x1:${30 + h % 40}%;--y1:${20 + (h >> 3) % 25}%;--x2:${40 + (h >> 5) % 40}%;--y2:${70 + (h >> 7) % 25}%;--ang:${150 + (h >> 9) % 50}deg"></span>`; };
  const head = (title, action) => `<div class="m-section-head"><h3>${title}</h3>${action ? `<button class="k-btn k-btn--ghost k-btn--sm">${action}</button>` : ''}</div>`;
  // Column heads are just names (V.2.1 crit): the scores under them already carry each person's dot
  const colsHead = (...whos) => `<div class="o-cols o-cols--head">${whos.map(w => `<span class="o-col">${w === 'group' ? 'Group' : P[w].n}</span>`).join('')}</div>`;

  /* 1 · Profile header: centred, the avatar is the hero. On a friend's profile, your match with them sits just off the avatar's
     top right, in Tomato because it's yours. Your own profile needs no marker. Long names step down a size; nothing else ever shrinks. */
  const nameSize = n => (n.length > 20 ? ' o-profile__name--longer' : n.length > 13 ? ' o-profile__name--long' : '');
  function header(view = 'friend', o = {}) {
    const size = o.web ? 'hero' : 'xxl', web = o.web ? ' o-profile--web' : '';
    if (view === 'own') return `<div class="o-profile${web}">
      ${avatar('you', size)}
      <div class="o-profile__name${nameSize('Dani Cho')}"><h2>Dani Cho</h2><div class="o-profile__handle">@dani.watches</div></div>
      <p class="o-profile__bio">Ranking everything Denis Villeneuve ever made. Ask me about Arrival.</p>
      <div class="m-meta"><span>${ic('calendar-blank')}Joined January 2024</span><span>${ic('map-pin')}Toronto</span><span class="is-hidden">${ic('eye-slash')}Usually watches on Fridays · only you</span></div>
      <div class="m-stats"><div class="m-stat"><b>186</b><span>Ranked</span></div><div class="m-stat"><b>22</b><span>Takes</span></div><div class="m-stat"><b>41</b><span>Friends</span></div></div>
      <div class="o-profile__actions"><button class="k-btn k-btn--secondary k-btn--sm" data-go="#/me/edit">${ic('pencil-simple')}Edit profile</button></div>
    </div>`;
    const name = o.name || 'Maya Kim';
    return `<div class="o-profile${web}">
      <span class="o-avatar">${avatar('maya', size)}<span class="o-matchtag" title="86% taste match with you">86%</span></span>
      <div class="o-profile__name${nameSize(name)}"><h2>${name}</h2><div class="o-profile__handle">@maya.films</div></div>
      <p class="o-profile__bio">Will cry at anything by Miyazaki. Runs Thursday film club.</p>
      <div class="m-meta"><span>${ic('calendar-blank')}Joined March 2024</span><span>${ic('map-pin')}Toronto</span><span>${ic('clock')}Usually watches on Thursdays</span></div>
      <div class="m-stats"><div class="m-stat"><b>214</b><span>Ranked</span></div><div class="m-stat"><b>63</b><span>Takes</span></div><div class="m-stat"><b>38</b><span>Friends</span></div></div>
      <div class="o-profile__actions"><button class="k-btn k-btn--primary k-btn--sm">${ic('user-plus')}Follow</button><button class="k-btn k-btn--secondary k-btn--sm">${ic('arrows-left-right')}Compare</button></div>
    </div>`;
  }

  /* 2 · Taste identity. Top 3 on one aligned baseline, #1 in the middle and biggest, so the row reads as a pyramid. */
  const TOP3 = { maya: ['spirited', 'budapest', 'parasite'], you: ['arrival', 'parasite', 'spirited'] };
  const top3 = (who = 'maya', o = {}) => `<ol class="o-top3" aria-label="Top 3">${(o.top || TOP3[who]).map((k, i) => `
      <li class="o-top3__item o-top3__item--${i + 1}"><span class="o-top3__n" aria-hidden="true">${i + 1}</span>${poster(k, 'm', 'o-top3__poster')}<span class="o-top3__title">${F[k][0]}</span></li>`).join('')}</ol>`;

  // Your rankings, filtered by the same feelings the rank flow starts with
  const FEEL = [['all', 'All'], ['loved', 'Loved it'], ['fine', 'It was fine'], ['no', 'Not for me']];
  const feels = (f, s) => f === 'all' || (f === 'loved' ? s >= 8.5 : f === 'fine' ? s >= 6 && s < 8.5 : s < 6);

  /* ---------- helpers ---------- */
  const fmt = v => (v >= 10 ? '10.0' : v.toFixed(1));
  const meta = k => `${F[k][1]} · ${F[k][2]} · ${(X[k] || {}).rt || ''}`;
  const stats = k => [(X[k] || {}).rt, ((X[k] || {}).g || []).join(', ')].filter(Boolean).join(' · ');
  // No captions under posters: the card identifies the film. Friends who've seen it show as identity dots.
  const tile = (k, who = []) => `<button class="tile" data-go="#/film/${k}" aria-label="${F[k][0]}">${poster(k, 'm')}${who.length ? `<span class="tile__who">${whodots(who)}</span>` : ''}</button>`;
  // In "Rank what you watched", the poster itself starts the ranking
  const rankTile = k => `<button class="tile" data-rank="${k}" aria-label="Rank ${F[k][0]}">${poster(k, 'm')}</button>`;
  const topbar = (title = '', o = {}) => `<div class="m-topbar narrow-only">${o.back ? `<button class="k-iconbtn k-iconbtn--ghost k-iconbtn--sm" data-act="back" aria-label="Back">${ic('caret-left')}</button>` : '<span style="width:36px"></span>'}<span class="m-topbar__title">${title}</span><div class="m-topbar__end">${o.end || '<span style="width:36px"></span>'}</div></div>`;
  const iconbtn = (icon, label, extra = '') => `<button class="k-iconbtn k-iconbtn--ghost k-iconbtn--sm" aria-label="${label}" ${extra}>${ic(icon)}</button>`;
  const shelf = keys => `<div class="m-shelf">${keys.map(k => `<div>${tile(k)}</div>`).join('')}</div>`;
  const rotate = (arr, n) => arr.slice(n % arr.length).concat(arr.slice(0, n % arr.length));

  // The published prototype's credit. The feed never ends, so it sits where it can be reached: the end of the web side column, and your profile.
  const credit = st => (st.credit ? '<p class="sub s-credit">Kino is a design prototype. Film posters and trailer stills belong to their studios and appear here for a non-commercial design study.</p>' : '');

  /* ---------- the feed that doesn't end ---------- */
  const dots = people => `<span class="feed-dots">${people.map(p => `<span class="k-dot ${p === 'you' ? '' : 'id-' + P[p].h}"></span>`).join('')}</span>`;
  // Friends start out followed; people you don't know yet start with Follow
  const following = (st, p) => st.followed[p] ?? !P[p].followers;
  const followBtn = (st, p, cls = 'k-btn--ghost', off = 'Follow') => { const on = following(st, p);
    return `<button class="k-btn ${on ? 'k-btn--ghost' : cls} k-btn--sm feed-follow${on ? ' is-on' : ''}${fx(st, 'follow-' + p)}" data-act="follow" data-p="${p}">${ic(on ? 'check' : 'user-plus')}${on ? 'Following' : off}</button>`; };
  // A take: who, then the film and their score, then what they said. On web the poster grows and the take reads like a quote.
  // Someone you don't follow yet comes with Follow, and with a friend who follows them when there is one.
  function takeItem(st, [p, k, s, t, txt, via], stranger) {
    const who = stranger ? `<span><b>${P[p].n}</b> · ${via ? `Followed by ${P[via].n}` : `${P[p].followers} followers`} · ${t}</span>${followBtn(st, p)}` : `<span><b>${P[p].n}</b> · ${t}</span>`;
    return `<div class="feed-item${stranger ? ' feed-stranger' : ''}"><div class="feed-item__who">${avatar(p, 'sm')}${who}</div>
        <div class="feed-item__body"><button class="feed-item__poster" data-go="#/film/${k}" aria-label="${F[k][0]}">${poster(k, 's')}</button>
          <div class="feed-item__film" data-go="#/film/${k}"><span class="feed-item__title">${F[k][0]}</span><span class="sub">${F[k][1]} · ${F[k][2]}</span>${score(p, s)}</div>
          ${txt ? `<p class="o-take__text feed-item__quote">${txt}</p>` : ''}
          <div class="o-take__actions"><button class="k-btn k-btn--ghost k-btn--sm${st.liked[p + k] ? ' is-on' : ''}${fx(st, 'like-' + p + k)}" data-act="like" data-key="${p + k}">${ic(st.liked[p + k] ? 'heart-fill' : 'heart')}${st.liked[p + k] ? 'Liked' : 'Like'}</button><button class="k-btn k-btn--ghost k-btn--sm">${ic('chat-circle')}Reply</button>${MY[k] == null && st.ranked[k] == null ? `<button class="k-btn k-btn--ghost k-btn--sm" data-rank="${k}">${ic('plus')}Rank it</button>` : ''}</div></div></div>`;
  }
  // A trailer: the still, a play button and nothing else on it. Above, the friends who want to see it, as their dots.
  function trailerItem(st, { k, who, why }) {
    const on = st.playing === k;
    return `<div class="feed-item feed-trailer"><div class="feed-item__who">${dots(who)}<span><b>${names(who)}</b> ${why}</span></div>
        <button class="feed-trailer__still${on ? ' is-playing' : ''}" data-act="play" data-k="${k}" aria-label="${on ? 'Pause' : 'Play'} the trailer for ${F[k][0]}">
          <img src="stills/${STILLS[k]}" alt="" decoding="async"><span class="feed-trailer__play">${ic(on ? 'pause-fill' : 'play-fill')}</span>${on ? '<span class="feed-trailer__bar"></span>' : ''}</button>
        <div class="feed-trailer__meta"><div class="feed-trailer__text" data-go="#/film/${k}"><span class="feed-item__title">${F[k][0]}</span><span class="sub">Trailer · ${F[k][1]} · ${F[k][2]}</span></div>
          <button class="k-btn k-btn--ghost k-btn--sm feed-save${st.saved[k] ? ' is-on' : ''}${fx(st, 'save-' + k)}" data-act="fsave" data-k="${k}">${ic(st.saved[k] ? 'bookmark-simple-fill' : 'bookmark-simple')}${st.saved[k] ? 'Saved' : 'Save'}</button></div></div>`;
  }
  // A film Kino hasn't shown you yet, with its guess at your score
  const pickItem = (st, { k, why, guess }) => `<div class="feed-item feed-pick"><div class="feed-item__who"><span class="feed-src" aria-hidden="true">${ic('ticket')}</span><span><b>Kino's pick</b> · ${why}</span></div>
      <div class="feed-item__body"><button class="feed-item__poster" data-go="#/film/${k}" aria-label="${F[k][0]}">${poster(k, 's')}</button>
        <div class="feed-item__film" data-go="#/film/${k}"><span class="feed-item__title">${F[k][0]}</span><span class="sub">${F[k][1]} · ${F[k][2]}</span><span class="sub feed-pick__guess">Kino thinks you'll land around ${fmt(guess)}</span></div>
        <div class="o-take__actions"><button class="k-btn k-btn--ghost k-btn--sm${st.saved[k] ? ' is-on' : ''}${fx(st, 'save-' + k)}" data-act="fsave" data-k="${k}">${ic(st.saved[k] ? 'bookmark-simple-fill' : 'bookmark-simple')}${st.saved[k] ? 'Saved' : 'Save'}</button>${st.ranked[k] == null ? `<button class="k-btn k-btn--ghost k-btn--sm" data-rank="${k}">${ic('plus')}Rank it</button>` : ''}</div></div></div>`;
  // iPhone: one row of people to follow where friends run out. On web they'll live in the side column.
  const peopleItem = st => `<div class="feed-item feed-people narrow-only"><div class="m-section-head"><h3>People to follow</h3></div>
      <div class="hscroll feed-people__row" data-keep="people">${TO_FOLLOW.map(([p, via]) => `<div class="feed-person">${avatar(p, 'lg')}<b>${P[p].full}</b><span class="sub">${via ? `${dots([via])}Followed by ${P[via].n}` : `${P[p].followers} followers`}</span>${followBtn(st, p, 'k-btn--secondary')}</div>`).join('')}</div></div>`;
  // Page 0 is friends, newest first, with two trailers dealt in. Every page after it is people you don't follow yet, a film Kino
  // hasn't shown you and, every other page, a trailer, never doubling a film within a page. Past the written takes, the same films
  // come back as plain rankings from other people, so the feed never runs dry.
  function feedPage(n) {
    if (n === 0) { const f = FRIEND_TAKES.map(x => ({ t: 'take', x })); f.splice(1, 0, { t: 'trailer', x: TRAILERS[0] }); f.splice(5, 0, { t: 'trailer', x: TRAILERS[1] }); return f; }
    const L = STRANGER_TAKES.length, out = [];
    for (let j = 0; j < 4; j++) { const i = (n - 1) * 4 + j, x = STRANGER_TAKES[i % L], lap = Math.floor(i / L);
      out.push({ t: 'stranger', x: lap ? [TO_FOLLOW[(i + lap) % TO_FOLLOW.length][0], x[1], Math.round(Math.min(9.8, Math.max(4.5, x[2] + ((i * 7) % 9 - 4) / 10)) * 10) / 10, `${lap * 4 + 3}d`, ''] : x }); }
    const on = new Set(out.map(o => o.x[1])), pick = KINO_PICKS.map((_, j) => KINO_PICKS[(n - 1 + j) % KINO_PICKS.length]).find(r => !on.has(r.k));
    if (pick) { out.splice(2, 0, { t: 'pick', x: pick }); on.add(pick.k); }
    const tr = TRAILERS.map((_, j) => TRAILERS[(n + 1 + j) % TRAILERS.length]).find(x => !on.has(x.k));
    if (tr && n % 2) out.splice(4, 0, { t: 'trailer', x: tr });
    if (n === 1) out.unshift({ t: 'people' });
    return out;
  }
  const feedHtml = (st, n, fresh) => feedPage(n).map((it, j) => {
    const html = it.t === 'take' ? takeItem(st, it.x) : it.t === 'stranger' ? takeItem(st, it.x, true) : it.t === 'trailer' ? trailerItem(st, it.x) : it.t === 'pick' ? pickItem(st, it.x) : peopleItem(st);
    return fresh ? html.replace('<div class="feed-item', `<div style="--n:${j}" class="feed-item is-new`) : html; }).join('');

  /* ---------- the bell ---------- */
  const unreadNotes = st => NOTES.filter(n => n.fresh && !st.read[n.id]).length;
  const bellBtn = (st, attrs) => `<button class="k-iconbtn k-iconbtn--ghost k-iconbtn--sm n-bell" ${attrs} aria-label="Notifications${st.notesSeen ? '' : `, ${unreadNotes(st)} new`}">${ic('bell')}${st.notesSeen ? '' : '<span class="n-bell__dot"></span>'}</button>`;
  function noteRow(st, n) {
    const g = n.group && GROUPS.find(x => x.id === n.group), unread = n.fresh && !st.read[n.id];
    const lead = g ? cluster(g.who, 40) : n.ps ? cluster(n.ps, 40) : avatar(n.p);
    const end = n.btn ? `<button class="k-btn k-btn--secondary k-btn--sm" data-go="${n.go}" data-note="${n.id}">${n.btn}</button>`
      : n.follow ? followBtn(st, n.p, 'k-btn--secondary', 'Follow back')
      : n.k ? `<span class="n-thumb">${poster(n.k, 'xs')}${n.on ? `<span class="n-thumb__dots">${n.on.map(p => `<span class="k-dot ${p === 'you' ? '' : 'id-' + P[p].h}"></span>`).join('')}</span>` : ''}</span>` : '';
    // What's new carries a cream dot just off the avatar's top right, where the dot language puts markers (V.2.1 crit)
    return `<div class="n-row${unread ? ' is-new' : ''}${n.go ? ' tap' : ''}" ${n.go ? `data-go="${n.go}" data-note="${n.id}"` : ''}>
        <span class="n-row__lead">${lead}${unread ? '<span class="n-row__new" role="img" aria-label="New"></span>' : ''}</span>
        <span class="n-row__body"><span class="n-row__text">${n.text}</span>${n.quote ? `<span class="n-row__quote">\u201C${n.quote}\u201D</span>` : ''}
          <span class="n-row__sub">${n.s != null ? score(n.p, n.s) + '<span aria-hidden="true">·</span>' : ''}<span>${[n.sub, n.when].filter(Boolean).join(' · ')}</span></span></span>
        <span class="n-row__end">${end}</span></div>`;
  }
  const noteList = st => `<div class="n-sec">${NOTES.filter(n => n.fresh).map(n => noteRow(st, n)).join('')}</div>
      <div class="n-sec"><div class="m-section-head"><h3>Earlier</h3></div>${NOTES.filter(n => !n.fresh).map(n => noteRow(st, n)).join('')}</div>`;
  const nswitch = (st, [id, icon, label, sub]) => `<div class="e-row">${ic(icon)}<span class="e-row__body"><b>${label}</b><span class="sub">${sub}</span></span>
      <button class="k-switch" role="switch" aria-checked="${!!st.nprefs[id]}" aria-label="${label}" data-act="nset" data-t="${id}"><span></span></button></div>`;
  // Web: the bell drops a panel from the bar; the gear slides its settings in, in the same panel
  function bellPop(st) {
    const set = st.bell === 'settings', dir = st.bellFx === 'fwd' || st.bellFx === 'back' ? ' s-panel--' + st.bellFx : '';
    return `<div class="n-pop${st.bellFx === 'open' ? ' is-fresh' : ''}" role="dialog" aria-label="${set ? 'Notification settings' : 'Notifications'}">
      ${set ? `<div class="n-pop__head"><button class="k-iconbtn k-iconbtn--ghost k-iconbtn--sm" data-act="bell-list" aria-label="Back to notifications">${ic('caret-left')}</button><b>Notification settings</b></div>
          <div class="n-pop__body n-pop__set${dir}"><span class="sub">Tell me about</span>${NSET.map(x => nswitch(st, x)).join('')}</div>`
        : `<div class="n-pop__head"><b>Notifications</b>${iconbtn('gear-six', 'Notification settings', 'data-act="bell-set"')}</div>
          <div class="n-pop__body${dir}">${noteList(st)}</div>
          <button class="k-btn k-btn--ghost k-btn--block n-pop__all" data-go="#/notifications">See all</button>`}</div>`;
  }

  /* ---------- screens ---------- */
  function home(st) {
    const g = GROUPS[0], waiting = !st.myVote;
    const status = `<div class="m-card g-status">
      <div class="g-status__top"><div><div class="kino-title-l">${g.name}</div><div class="sub">${g.when}</div><div class="sub">${waiting ? '3 of 4 voted. Waiting on you' : 'Everyone\'s in'}</div></div>${stack(g.who, 'sm', 4)}</div>
      <div class="g-status__posters">${CANDS.map(c => `<button class="tile" data-go="#/group/thursday" aria-label="${F[c.k][0]}">${poster(c.k, 'm')}</button>`).join('')}</div>
      <button class="k-btn k-btn--accent k-btn--block" data-go="#/group/thursday">${ic('popcorn')}${waiting ? 'Vote for Friday' : 'See the pick'}</button></div>`;
    // Rank what you watched shows only when there's something to rank, and grows with it (V.2.1 crit): one to three films sit large
    // and centred; four or more become a row that scrolls sideways, so it never reads like the Recently released grid below it.
    const watched = (st.toRank || ['interstellar', 'odyssey', 'coyote', 'residentevil']).filter(k => st.ranked[k] == null);
    const rankHead = `<div class="m-section-head"><h3>Rank what you watched</h3>${watched.length > 3 ? `<span class="sub">${watched.length} films</span>` : ''}</div>`;
    const toRank = !watched.length ? '' : watched.length <= 3
      ? `<div class="s-section h-rank h-rank--few">${rankHead}<div class="h-rank__few" data-n="${watched.length}">${watched.map(k => rankTile(k)).join('')}</div></div>`
      : `<div class="s-section h-rank">${rankHead}<div class="m-shelf h-grid h-rank__row">${watched.map(k => `<div>${rankTile(k)}</div>`).join('')}</div></div>`;
    const recent = `<div class="s-section h-recent"><div class="m-section-head"><h3>Recently released</h3><button class="k-btn k-btn--ghost k-btn--sm">See all</button></div><div class="m-shelf h-grid">${RECENT.map(k => `<div>${tile(k)}</div>`).join('')}</div></div>`;
    // One feed, no cut: it loads the next page as you near the end (see watchFeed)
    const feed = `<div class="h-feed"><div class="m-section-head"><h3>Lately</h3></div>${Array.from({ length: st.feedPages }, (_, n) => feedHtml(st, n)).join('')}
      <div class="feed-more" role="status" aria-label="Loading more"><span></span><span></span><span></span></div></div>`;
    const top = `<div class="h-top narrow-only"><span class="s-wm">kino<i></i></span>${bellBtn(st, 'data-go="#/notifications"')}</div>`;
    const hero = `<div class="s-head h-hero"><h1 class="s-title">${greeting(st)}</h1><p class="s-sub">One group pick needs you, and four films are waiting for a score.</p></div>`;
    // The web revisit (the nav choice sheet): the greeting heads the main column, and the side column runs from the top and
    // scrolls on its own, ending with people to follow. Coming soon waits for films whose dates are certain.
    if (st.webNav) {
      const people = `<div class="wide-only"><div class="s-section h-people"><div class="m-section-head"><h3>People to follow</h3></div>
        ${TO_FOLLOW.map(([p, via]) => `<div class="h-person">${avatar(p)}<span class="h-person__body"><b>${P[p].full}</b><span class="sub">${via ? `${dots([via])}Followed by ${P[via].n}` : `${P[p].followers} followers`}</span></span>${followBtn(st, p, 'k-btn--secondary')}</div>`).join('')}</div></div>`;
      return `${top}<div class="s-split h-split h-split--two"><div class="h-main">${hero}${feed}</div>
        <aside class="h-side" data-keep="side">${st.removed.thursday ? '' : status}${toRank}${recent}${people}<div class="wide-only">${credit(st)}</div></aside></div>`;
    }
    return `${top}${hero}
      <div class="s-split h-split"><div>${feed}</div><aside>${st.removed.thursday ? '' : status}${toRank}${recent}</aside></div>
      ${credit(st)}`;
  }

  function explore(st) {
    // Inside a pile the filters change to suit it; each pile remembers its own
    const open = st.pile && PILES.find(p => p.id === st.pile);
    const set = open ? (st.pchips[open.id] = st.pchips[open.id] || {}) : st.chips, list = open ? PILE_CHIPS[open.id] : CHIPS;
    const on = list.filter(c => set[c]), shift = on.length;
    const chip = c => `<button class="k-chip" aria-pressed="${!!set[c]}" data-act="chip" data-c="${c}">${P[c] ? `<span class="k-dot id-${P[c].h}"></span>${P[c].n}` : c}</button>`;
    const head = `${topbar('')}<div class="s-head"><h1 class="s-title">Explore</h1></div>
      <div class="s-sticky"><label class="k-search">${ic('magnifying-glass')}<input type="search" placeholder="Search films, friends, lists" aria-label="Search"></label>
        <div class="chips x-chips">${list.map(chip).join('')}</div></div>`;
    const none = `<p class="sub x-none">Nothing matches. Try fewer filters.</p>`;
    // iPhone keeps shelves
    const shelfOf = p => { const films = sift(p.films, on, p); return films.length ? shelf(films) : none; };
    const friends = sift(PILES[0].films, on, PILES[0]);
    const narrow = `<div class="narrow-only x-shelves">
      <div class="s-section"><div class="m-section-head"><h3>Friends are loving</h3><button class="k-btn k-btn--ghost k-btn--sm">See all</button></div>
        ${friends.length ? `<div class="poster-grid">${friends.slice(0, 6).map(k => tile(k, PILES[0].who[k])).join('')}</div>` : none}</div>
      <div class="s-section"><div class="m-section-head"><h3>${PILES[1].title}</h3></div>${shelfOf(PILES[1])}</div>
      <div class="s-section"><div class="m-section-head"><h3>${PILES[2].title}</h3></div>${shelfOf(PILES[2])}</div></div>`;
    // Web adds friction on purpose: three piles to dig through. Filters re-deal them; picking one up spreads it into a grid.
    // Each pile is dealt its own way, seeded by the pile and the visit, so no two fan or burst alike (V.2.1 crit). The top card
    // stays put on hover; the ones beneath fly out on their own paths, a little further than before.
    const pileSeed = id => [...id].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, st.seed >>> 0);
    // Seven cards a pile (V.2.1 crit: fuller, less wild). The six beneath take one sixth of the circle each, in a shuffled order with a
    // little jitter, so every pile spreads evenly but none alike. Bursts travel less sideways than up and down, so a card never covers
    // the next pile. Each card fades towards the pile (--ga points away from it), so it looks like it's emerging from the stack.
    const card = (k, i, r, turn, slots) => { if (!i) return `<span class="x-pile__card" style="--i:0;--r:${((r() - .5) * 3).toFixed(1)}deg">${poster(k, 'l')}</span>`;
      const a = (turn + slots[(i - 1) % 6] * 60 + (r() - .5) * 24) * Math.PI / 180, d = 4 + i * (3 + r() * 2), rot = (r() < .5 ? -1 : 1) * (1.2 + r() * 2) * Math.sqrt(i);
      const dx = d * Math.cos(a), dy = d * Math.sin(a), ba = a + (r() - .5) * .3, bd = 38 + i * (15 + r() * 6);
      const ga = Math.atan2(dx, -dy) * 180 / Math.PI - rot;
      return `<span class="x-pile__card" style="--i:${i};--dx:${dx.toFixed(1)}px;--dy:${dy.toFixed(1)}px;--r:${rot.toFixed(1)}deg;--bx:${(bd * Math.cos(ba) * .72).toFixed(1)}px;--by:${(bd * Math.sin(ba)).toFixed(1)}px;--br:${(rot * (1.6 + r() * .8)).toFixed(1)}deg;--bt:${(r() * 80).toFixed(0)}ms;--ga:${ga.toFixed(0)}deg">${poster(k, 'l')}</span>`; };
    const pile = p => { const films = rotate(sift(p.films, on, p), shift), r = rng(pileSeed(p.id)), turn = r() * 360, slots = [0, 1, 2, 3, 4, 5].map(q => [r(), q]).sort((x, y) => x[0] - y[0]).map(([, q]) => q);
      return `<button class="x-pile${st.hoverPile === p.id ? ' is-hover' : ''}" data-act="pile" data-p="${p.id}" aria-label="Open ${p.title}, ${nfilms(films.length)}" ${films.length ? '' : 'disabled'}>
        <span class="x-pile__stack">${films.length ? films.slice(0, 7).map((k, i) => card(k, i, r, turn, slots)).join('') : '<span class="x-pile__empty"></span>'}</span>
        <span class="x-pile__label"><b>${p.title}</b><span class="sub">${films.length ? nfilms(films.length) : 'Nothing matches'}</span></span></button>`; };
    const spread = p => { const films = rotate(sift(p.films, on, p), shift);
      return `<div class="x-open">
        <div class="x-open__head"><button class="k-btn k-btn--ghost k-btn--sm" data-act="unpile">${ic('caret-left')}All piles</button><h2 class="kino-display-m">${p.title}</h2><span class="sub">${nfilms(films.length)}</span></div>
        ${films.length ? `<div class="x-grid">${films.map((k, i) => `<button class="x-card" data-go="#/film/${k}" style="--i:${i}">${poster(k, 'm')}<b>${F[k][0]}</b><span class="sub">${stats(k)}</span>${p.who && p.who[k] ? whodots(p.who[k]) : ''}</button>`).join('')}</div>` : none}</div>`; };
    const wide = `<div class="wide-only">${open ? spread(open) : `<div class="x-piles">${PILES.map(pile).join('')}</div><p class="sub x-hint">Pick a pile up to spread it out. Filters re-deal them.</p>`}</div>`;
    return `${head}<div class="x-zone">${narrow}${wide}</div>`;
  }

  function film(st, k) {
    const x = X[k] || {}, mine = st.ranked[k] ?? MY[k];
    const friends = x.friends || [['maya', 8.8, ''], ['jo', 8.1, '']];
    const avg = friends.reduce((a, f) => a + f[1], 0) / friends.length;
    const pos = mine != null ? myListWith(st).findIndex(([kk]) => kk === k) + 1 : null;
    const you = mine != null
      ? `<div class="m-card you-box"><div class="you-box__row"><div><div class="label">Your score</div><div class="sub" style="margin-top:4px">#${pos} of your ${MY_TOTAL + Object.keys(st.ranked).length} films</div></div><span class="k-score k-score--hero"><span class="k-dot"></span><span class="k-score__num">${fmt(mine)}</span></span></div>
          <div class="you-box__actions"><button class="k-btn k-btn--secondary k-btn--sm" data-rank="${k}">Rank again</button><button class="k-btn k-btn--secondary k-btn--sm">${ic('pencil-simple')}Add a take</button></div></div>`
      : `<div class="m-card you-box"><div class="you-box__row"><div><div class="label">Your score</div><div class="sub" style="margin-top:4px">${x.predict ? `Kino thinks you'll land around ${fmt(x.predict)}` : 'Not ranked yet'}</div></div><span class="k-score k-score--hero k-score--unranked"><span class="k-dot k-dot--empty"></span><span class="k-score__num">–</span></span></div>
          <div class="you-box__actions"><button class="k-btn k-btn--accent" data-rank="${k}">${ic('film-slate')}Rank it</button><button class="k-iconbtn k-iconbtn--secondary${fx(st, 'save')}" aria-label="Save to watchlist" aria-pressed="${!!st.saved[k]}" data-act="save">${ic(st.saved[k] ? 'bookmark-simple-fill' : 'bookmark-simple')}</button></div></div>`;
    const where = `<div class="s-section wtw"><div class="m-section-head"><h3>Where to watch</h3><span class="sub">Sample data</span></div>
      <div class="m-card m-card--flush">${wtwFor(k).map(([n, type, detail]) => `<div class="wtw__row"><span class="wtw__mark" aria-hidden="true">${n.split(' ').map(w => w[0]).join('').slice(0, 2)}</span><div class="wtw__body"><b>${n}</b><span class="sub">${type} · ${detail}</span></div>${iconbtn('arrow-up-right', 'Open ' + n)}</div>`).join('')}</div></div>`;
    return `${topbar('', { back: true, end: iconbtn('share-network', 'Share') })}
      <div class="s-film">
        <div class="s-film__side"><div class="s-film__hero">${poster(k, 'xl')}<h1>${F[k][0]}</h1><div class="m-meta"><span>${meta(k)}</span></div><div class="chips">${(x.g || []).map(g => `<span class="k-chip">${g}</span>`).join('')}</div></div>${you}</div>
        <div class="s-film__main">
          <div class="m-card m-card--flush"><div class="m-section-head"><h3>Friends · average ${fmt(avg)}</h3></div>
            ${friends.map(([p, s, t]) => `<div class="m-person" data-go="#/profile/${p}" style="cursor:pointer">${avatar(p)}<div class="m-person__body"><div class="m-person__name">${P[p].n === 'Maya' ? 'Maya Kim' : P[p].n}</div><div class="m-person__sub">${t || 'Ranked this week'}</div></div>${score(p, s)}</div>`).join('')}
          </div>
          <div class="s-section"><div class="m-section-head"><h3>About</h3></div><p class="s-sub" style="color:var(--kino-text-primary)">${x.about || 'A film your friends keep bringing up.'}</p>
            <div class="facts"><div><span>Director</span>${F[k][2]}</div><div><span>Released</span>${F[k][1]}</div><div><span>Runtime</span>${x.rt || '–'}</div><div><span>Genre</span>${(x.g || []).join(', ')}</div></div></div>
          ${where}
          ${x.cast ? `<div class="s-section"><div class="m-section-head"><h3>Cast</h3></div><div class="cast">${x.cast.map(([n, r]) => `<div>${face(n)}<b>${n}</b>${r}</div>`).join('')}</div></div>` : ''}
        </div>
      </div>`;
  }

  // No groups yet: friends and films take turns around the "+" in one even ring (V.2.1 crit: nothing ever sits on top of anything,
  // no big gaps, always roughly a circle). The ring turns slowly as one; each piece bobs a little. Laid out afresh each visit.
  const FIELD = [['maya', 'jo', 'ari', 'sam', 'noor', 'toystory5', 'spirited', 'interstellar', 'budapest', 'hailmary'],
    ['theo', 'kai', 'lena', 'rui', 'arrival', 'parasite', 'coyote', 'dune']]; // the second, wider scatter shows on web only
  const rng = seed => () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 2 ** 32;
  function field(seed) {
    const r = rng(seed), out = [], shuffle = a => a.map(x => [r(), x]).sort((p, q) => p[0] - q[0]).map(([, x]) => x);
    FIELD.forEach((pieces, band) => {
      const people = shuffle(pieces.filter(x => P[x])), films = shuffle(pieces.filter(x => !P[x])), ring = [];
      while (people.length || films.length) { if (people.length) ring.push(people.shift()); if (films.length) ring.push(films.shift()); }
      const step = 360 / ring.length, off = r() * 360;
      ring.forEach((x, i) => { const person = !!P[x];
        out.push({ x, person, wide: band === 1, a: off + i * step + (r() - .5) * step * .14, d: band ? 1.14 : (person ? .66 : .7) + (r() - .5) * .03,
          s: person ? 30 + r() * 2 : 42 + r() * 4, dur: band ? 320 : 260, bob: 5 + r() * 3, bd: -r() * 6 }); });
    });
    return out;
  }
  const fieldItem = o => `<span class="g-field__item ${o.person ? 'is-person' : 'is-film'} ${o.wide ? 'wide-only' : ''}" style="--a:${o.a.toFixed(1)}deg;--d:${o.d.toFixed(3)};--s:${o.s.toFixed(0)}px;--dur:${o.dur.toFixed(0)}s;--bob:${o.bob.toFixed(1)}s;--bd:${o.bd.toFixed(1)}s">
      <span class="g-field__up">${o.person ? `<span class="k-avatar id-${P[o.x].h}">${P[o.x].i}</span>` : poster(o.x, 's')}</span></span>`;

  function groups(st) {
    const top = topbar('');
    const head = `<div class="s-head g-head"><h1 class="s-title">Groups</h1><p class="s-sub">Pick something everyone will love, together.</p></div>`;
    if (st.noGroups) {
      return `${top}${head}
        <div class="g-start">
          <div class="g-orbit"><span class="g-field" aria-hidden="true">${field(st.seed).map(fieldItem).join('')}</span>
            <button class="g-orbit__plus" aria-label="Start a group">${ic('plus')}</button>
          </div>
          <div class="g-start__copy"><h2 class="kino-display-m">Start your first group</h2><p class="s-sub">Pick a few friends. Kino finds films you'll all love.</p>
            <button class="k-btn k-btn--secondary">${ic('share-network')}Invite with a link</button></div>
        </div>`;
    }
    // Quiet rows, like Messages: a bundle of the members' dots, the name, one line of what's happening.
    // A Tomato dot on the bundle's top right means it's your turn, like a notification. Tapping gives a little, then opens the group.
    // On iPhone, swipe a row left for Mute and Leave (Delete, if you started it). On web, "…" on a row opens the same options.
    const item = g => {
      const live = g.id === 'thursday', mine = g.by === 'you', open = st.swiped === g.id, tab = open ? '' : 'tabindex="-1"';
      const sub = live ? 'Voting for Friday. Waiting on you' : g.last ? `Last pick: ${F[g.last][0]}` : `${g.who.length} people · no pick yet`;
      const when = live ? 'Fri' : g.date || '';
      const to = live ? '#/group/thursday' : g.id === 'two' ? '#/profile/maya' : '';
      return `<div class="g-item ${open ? 'is-open' : ''}" data-gid="${g.id}">
        <span class="g-acts narrow-only"><button class="g-act" data-act="gmute" data-gid="${g.id}" ${tab}><span class="g-act__dot">${ic('bell')}</span>${st.muted[g.id] ? 'Unmute' : 'Mute'}</button>
          <button class="g-act g-act--danger" data-act="gask" data-gid="${g.id}" data-step="${mine ? 'delete' : 'leave'}" ${tab}><span class="g-act__dot">${ic('x')}</span>${mine ? 'Delete' : 'Leave'}</button></span>
        <button class="g-row ${live ? 'is-live' : ''}" data-act="group" data-to="${to}" aria-label="${g.name}, ${members(g.who)}${live ? ', waiting on you' : ''}">
          <span class="g-bundle">${cluster(g.who, 60)}${live ? '<span class="g-bundle__turn" aria-hidden="true"></span>' : ''}</span><span class="g-row__text"><span class="g-row__title">${g.name}</span><span class="g-row__sub">${st.muted[g.id] ? 'Muted · ' : ''}${sub}</span></span><span class="g-row__when">${when}</span></button>
        <span class="wide-only"><button class="k-iconbtn k-iconbtn--ghost k-iconbtn--sm g-more" data-act="gmenu" data-gid="${g.id}" aria-label="Options for ${g.name}">${ic('dots-three')}</button></span></div>`; };
    return `${top}${head}
      <div class="g-list">${GROUPS.filter(g => !st.removed[g.id]).map(item).join('')}
        <div class="g-item"><button class="g-row g-row--new" aria-label="Start a new group"><span class="g-new">${ic('plus')}</span><span class="g-row__text"><span class="g-row__title">New group</span><span class="g-row__sub">Pick a few friends, or invite with a link</span></span><span></span></button></div></div>
      <button class="k-btn k-btn--accent k-btn--block narrow-only">${ic('popcorn')}Start a group pick</button>`;
  }

  // Group options: mute, leave, or delete if you started it. Leaving and deleting ask once more, with the bundle front and centre.
  function groupSheet(st) {
    const s = st.gsheet, g = GROUPS.find(x => x.id === s.id), mine = g.by === 'you', del = s.step === 'delete';
    const body = s.step === 'menu'
      ? `<div class="gs-head">${cluster(g.who, 56)}<div class="gs-head__text"><b>${g.name}</b><span class="sub">${members(g.who)}</span></div></div>
        <div class="gs-list">
          <button class="gs-row" data-act="gmute" data-gid="${g.id}"><b>${st.muted[g.id] ? 'Unmute' : 'Mute for a week'}</b><span class="sub">${st.muted[g.id] ? 'Nudges and pick alerts come back on' : 'No nudges or pick alerts from this group'}</span></button>
          <button class="gs-row gs-row--danger" data-act="gask" data-gid="${g.id}" data-step="leave"><b>Leave group</b><span class="sub">Anyone in it can invite you back</span></button>
          ${mine ? `<button class="gs-row gs-row--danger" data-act="gask" data-gid="${g.id}" data-step="delete"><b>Delete group</b><span class="sub">Removes it for everyone in it</span></button>`
            : `<p class="sub gs-note">Only ${P[g.by].n}, who started it, can delete it</p>`}
        </div>
        <button class="k-btn k-btn--ghost k-btn--block" data-act="gclose">Done</button>`
      : `<div class="gs-confirm">${cluster(g.who, 72)}<h2 class="kino-display-m">${del ? 'Delete' : 'Leave'} ${g.name}?</h2>
          <p class="s-sub">${del ? 'It goes for everyone in it. Past picks stay in everyone\'s rankings.' : 'You\'ll stop seeing its picks and nudges. Anyone in it can invite you back.'}</p></div>
        <button class="k-btn k-btn--danger k-btn--block" data-act="gdo" data-gid="${g.id}" data-step="${s.step}">${del ? 'Delete group' : 'Leave group'}</button>
        <button class="k-btn k-btn--ghost k-btn--block" data-act="gclose">Keep it</button>`;
    return `<div class="app__overlay" data-act="goverlay"><div class="app__sheet app__sheet--fit gs" role="dialog" aria-label="${g.name}">${body}</div></div>`;
  }

  function vote(st) {
    const g = GROUPS[0], host = st.host || 'you', pending = st.pending || [];
    const pool = CANDS.concat(st.suggested ? [{ k: st.suggested, by: 'you', fit: '3 of 4 likely 8 or higher', votes: [] }] : []);
    const voted = c => c.votes.filter(p => !pending.includes(p)).concat(st.myVote === c.k ? ['you'] : []);
    const waitingOn = g.who.filter(p => (p === 'you' ? !st.myVote : pending.includes(p)));
    const others = waitingOn.filter(p => p !== 'you'), allIn = !waitingOn.length, nIn = g.who.length - waitingOn.length;
    const by = c => c.by === 'kino' ? `<span class="v-by">Kino's pick</span>`
      : `<span class="v-by"><span class="k-dot ${c.by === 'you' ? '' : 'id-' + P[c.by].h}"></span>${c.by === 'you' ? 'Your pick' : P[c.by].n + '\'s pick'}</span>`;
    const spots = POOL_MAX - pool.length, top = Math.max(...pool.map(c => voted(c).length));
    // Equal posters, spaced out. Your choice is the largest; before you vote, the leader lifts a little to show where the group is leaning.
    // Voters' dots (with initials) just touch each poster's bottom edge: the one thing
    // allowed on a poster (call 1). The titles stay underneath as captions.
    const film = c => { const v = voted(c), mine = st.myVote === c.k, lead = !st.myVote && top > 0 && v.length === top;
      return `<div class="v-film ${mine ? 'is-mine' : ''} ${lead ? 'is-lead' : ''}" data-flip="vf-${c.k}">
        <button class="v-film__poster" data-act="vote" data-k="${c.k}" data-flip-t="vp-${c.k}" aria-pressed="${mine}" aria-label="${mine ? 'Your vote: ' : 'Vote for '}${F[c.k][0]}">${poster(c.k, 'm')}</button>
        <span class="v-film__votes" aria-label="${v.length ? 'Votes from ' + names(v) : 'No votes yet'}">${v.length ? v.map(p => `<span class="v-dot ${p === 'you' ? 'id-you' : 'id-' + P[p].h}" data-flip="vd-${p}">${P[p].i}</span>`).join('') : '<span class="v-film__none">No votes</span>'}</span>
        <span class="v-film__title tap" data-go="#/film/${c.k}">${F[c.k][0]}</span>${by(c)}</div>`; };
    // The next empty slot holds a "+" dot to suggest a film (one each, five films at most)
    const add = !st.suggested && spots > 0 ? `<button class="v-film v-film--add" data-act="suggest" data-flip="v-add"><span class="v-plus">${ic('plus')}</span><span class="v-film__title">Suggest a film</span><span class="v-by">${spots} spot${spots === 1 ? '' : 's'} left</span></button>` : '';
    const focus = pool.find(c => c.k === st.myVote);
    const sub = !st.myVote ? 'Tap a poster to vote. Kino\'s picks are films the whole group is likely to love.'
      : !allIn ? `You're in. Waiting on ${names(others)}`
      : host === 'you' ? 'Everyone\'s in. Lock it whenever you\'re ready.' : `Everyone's in. ${P[host].n} will lock it soon.`;
    return `${topbar(g.name, { back: true, end: iconbtn('dots-three', 'Group options', 'data-act="gmenu" data-gid="thursday"') })}
      <div class="s-head"><span class="sub wide-only">${g.name}</span><h1 class="s-title">What are we watching ${g.when.split(' ·')[0]}?</h1><p class="s-sub">${sub}</p></div>
      <div class="s-vote">
        <div><div class="v-field v-field--${st.dots || 'edge'}">${pool.map(film).join('')}${add}</div>
          ${focus ? `<p class="v-focus">Your vote: <b>${F[focus.k][0]}</b>. ${focus.fit}${st.suggested ? `<br>You've added your suggestion. ${spots} spot${spots === 1 ? '' : 's'} left` : ''}</p>` : ''}</div>
        <aside><div class="v-tally"><div class="m-section-head"><h3>${nIn} of ${g.who.length} voted</h3></div>
          <div class="v-voters">${g.who.map(p => { const done = !waitingOn.includes(p); return `<div class="v-voter ${done ? '' : 'is-waiting'}"><span class="k-avatar id-${P[p].h}">${P[p].i}${done ? `<span class="v-check">${ic('check')}</span>` : ''}</span>${P[p].n}</div>`; }).join('')}</div>
          ${others.length ? `<button class="k-btn k-btn--secondary k-btn--sm k-btn--block${fx(st, 'nudge', 'is-ring')}" data-act="nudge" ${st.nudged ? 'disabled' : ''}>${ic('bell')}${st.nudged ? 'Nudged ' : 'Nudge '}${P[others[0]].n}</button>` : ''}
          ${host === 'you'
            ? `<button class="k-btn k-btn--accent k-btn--block" data-act="lock" ${allIn ? '' : 'disabled'}>${ic('popcorn')}Lock the pick</button>
               <p class="sub" style="text-align:center">${allIn ? 'Only the host can lock it. That\'s you.' : st.myVote ? 'You can lock it once everyone\'s in.' : 'Vote first, then you can lock it.'}</p>`
            : `<p class="sub v-hostnote">${avatar(host, 'sm')}<span>${P[host].n} locks it once everyone's in</span></p>`}</div></aside>
      </div>`;
  }

  function picked(st) {
    const g = GROUPS[0];
    const tally = CANDS.map(c => [c.k, c.votes.length + (st.myVote === c.k ? 1 : 0)]).sort((a, b) => b[1] - a[1]);
    const k = tally[0][0], [prov] = wtwFor(k);
    // No orbit: everyone's dot drops onto the pick's bottom edge, the same way votes sit on a poster. One screen, no scrolling.
    const dots = `<span class="p-dots" aria-label="Watching: ${names(g.who)}">${g.who.map((p, i) => `<span class="v-dot ${p === 'you' ? 'id-you' : 'id-' + P[p].h}" style="--i:${i}">${P[p].i}</span>`).join('')}</span>`;
    return `${topbar('', { back: true })}
      <div class="picked"><h1 class="picked__hero">It's settled.</h1>
        <div class="p-stage">${poster(k, 'xl')}${dots}</div>
        <div class="picked__info">
          <div class="s-head"><h2 class="picked__title">${F[k][0]}</h2><span class="s-sub">${g.name} · ${g.when}</span></div>
          <p class="s-sub picked__why">${tally[0][1]} of 4 voted for it, and Kino predicts the group will score it around 8.7</p>
          <div class="picked__actions"><button class="k-btn k-btn--primary">Watch now${ic('arrow-up-right')}</button><span class="sub">Streaming on ${prov[0]}</span>
            <div class="picked__row"><button class="k-btn k-btn--secondary">${ic('calendar-blank')}Add to calendar</button><button class="k-btn k-btn--secondary">${ic('share-network')}Share</button></div>
            <button class="k-btn k-btn--ghost" data-act="unlock">Change the pick</button></div>
          <p class="sub">After Friday, everyone gets a nudge to rank it.</p></div></div>`;
  }

  function profile(st) {
    const TABS = [['Taste', () => taste() + match('maya')], ['Together', together], ['Rankings', rankings], ['Takes', takes]];
    const tools = iconbtn('share-network', 'Share profile') + iconbtn('dots-three', 'More options');
    return `${topbar('', { back: true, end: tools })}
      <div class="s-split" data-profile>
        <aside class="s-profile-side"><div class="wide-only"><div class="s-profile-tools">${tools}</div></div>${header('friend', { name: st.longName ? 'Maximiliana Ferreira-Okonkwo' : undefined })}</aside>
        <div><div class="s-sticky"><div class="m-seg" role="tablist">${TABS.map(([t], i) => `<button role="tab" aria-selected="${i === st.ptab}" data-act="ptab" data-i="${i}">${t}</button>`).join('')}</div></div>
          <div class="s-panel ${st.ptab === 0 ? 's-panel--2' : ''} ${st.tabDir ? 's-panel--' + st.tabDir : ''}">${TABS[st.ptab][1]()}</div></div>
      </div>`;
  }

  function me(st) {
    const list = myListWith(st), total = MY_TOTAL + Object.keys(st.ranked).length;
    const tools = iconbtn('share-network', 'Share profile') + iconbtn('gear-six', 'Settings');
    return `${topbar('', { end: tools })}
      <div class="s-split" data-profile><aside class="s-profile-side"><div class="wide-only"><div class="s-profile-tools">${tools}</div></div>${header('own')}</aside>
        <div>${taste('you', { top: list.slice(0, 3).map(([k]) => k) })}
          <div class="m-card m-card--flush me-rank"><div class="m-section-head"><h3>Your rankings</h3><button class="k-btn k-btn--ghost k-btn--sm" data-go="#/me/ranked">All ${total}</button></div><span class="sub">Your top 3 are above</span>
          ${list.slice(3, 9).map(([k, s], i) => rankRow(k, s, i + 4)).join('')}
        </div>${credit(st)}</div></div>`;
  }
  const rankRow = (k, s, n) => `<div class="o-rank__row tap" data-go="#/film/${k}"><span class="o-rank__num">${n}</span>${poster(k, 'xs')}<div class="o-rank__body"><span class="o-rank__title">${F[k][0]}</span><span class="m-film-row__meta">${F[k][1]} · ${F[k][2]}</span></div><div class="o-cols"><span class="o-col">${score('you', s)}</span></div></div>`;

  // Every film you've ranked, best first. Very simple filtering: search, plus the three feelings from the rank flow.
  function allRanked(st) {
    const list = myListWith(st), total = MY_TOTAL + Object.keys(st.ranked).length, f = st.rfilter, q = st.rq.trim().toLowerCase();
    const rows = list.map(([k, s], i) => [k, s, i + 1]).filter(([k, s]) => feels(f, s) && (!q || F[k][0].toLowerCase().includes(q)));
    return `${topbar('', { back: true })}
      <div class="s-narrow">
        <div class="s-head"><h1 class="s-title">Your rankings</h1><p class="s-sub">${total} films, best first</p></div>
        <div class="s-sticky"><label class="k-search">${ic('magnifying-glass')}<input type="search" placeholder="Search your rankings" aria-label="Search your rankings" data-input="rsearch" value="${st.rq}"></label>
          <div class="chips r-feel">${FEEL.map(([id, l]) => `<button class="k-chip" aria-pressed="${f === id}" data-act="rfilter" data-f="${id}">${l}</button>`).join('')}</div></div>
        <div class="r-all">${rows.length ? rows.map(([k, s, n]) => rankRow(k, s, n)).join('') : `<p class="sub r-all__none">Nothing ${q ? `called "${st.rq.trim()}"` : 'here'} yet.</p>`}
          ${f === 'all' && !q ? `<div class="r-all__more"><span class="sub">Showing ${rows.length} of ${total}</span><button class="k-btn k-btn--secondary k-btn--sm">Show more</button></div>` : ''}</div>
      </div>`;
  }

  // Edit profile: the basics, your colour, and what your profile shows. Hidden details stay visible to you, marked "only you".
  function editProfile(st) {

  // Numbers that mean something count up into place: your new score, a taste match
  function countUp(el) {

  function mount(root, start = '#/home', opts = {}) {

          <label class="k-search">${ic('magnifying-glass')}<input type="search" placeholder="Search films, friends, lists" aria-label="Search"></label>
          <nav class="app__nav">${NAV.filter(n => n[2] !== 'rank' && n[2] !== '#/me').map(([l, , h]) => `<button class="k-btn k-btn--ghost k-btn--sm" data-go="${h}" ${sec === h ? 'aria-current="page"' : ''}>${l}</button>`).join('')}
            <button class="k-btn k-btn--primary k-btn--sm" data-rank="interstellar" style="margin-left:8px">${ic('plus')}Rank a film</button>

            <button data-go="#/me" style="background:none;border:0;padding:0;cursor:pointer" aria-label="Your profile"><span class="k-avatar k-avatar--sm id-periwinkle">DC<span class="k-avatar__you"></span></span></button></nav>
          ${st.bell ? bellPop(st) : ''}</div></header>`}
        <div class="app__shell">${rail ? railNav(st, sec) : ''}<div class="app__scroll"><div class="app__page ${enter}">${route(st)}</div></div></div>
        <nav class="app__tabs"><div class="k-tabbar" role="tablist">${NAV.map(([l, n, h]) => `<button class="k-tab" role="tab" aria-selected="${sec === h}" ${h === 'rank' ? 'data-rank="interstellar"' : `data-go="${h}"`}>${ic(n, 'k-icon--off')}${ic(n + '-fill', 'k-icon--on')}${l}<span class="k-tab__dot"></span></button>`).join('')}</div></nav>
